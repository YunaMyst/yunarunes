<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monstro — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742;--g:#e6c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:20px;margin-top:16px}.hero{display:flex;gap:22px;align-items:center}.portrait{width:190px;height:190px;background:var(--p2);border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none;font-size:70px}.portrait img{width:100%;height:100%;object-fit:contain}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin:3px 5px 3px 0;background:#25303a}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.playable{background:#173e29;color:#8df0ad}.a2{background:#6a4a18;color:#ffd875}.stars{color:var(--g);letter-spacing:2px}.grid,.team,.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.team-slot,.mode{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:7px}.stat b,.mode b{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.mode{text-align:center}.mode strong{font-size:24px}.used strong{color:#7ee787}.muted{color:var(--m);line-height:1.5}.compat{display:flex;flex-wrap:wrap;gap:8px}.compat a{background:#11171d;border:1px solid var(--b);border-radius:7px;padding:10px;color:var(--t);text-decoration:none}.error{border-color:#7f3b3b}@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.grid,.team,.mode-grid{grid-template-columns:1fr 1fr}.portrait{width:150px;height:150px}}@media(max-width:450px){.grid,.team,.mode-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="database.html">← Voltar à Base de Monstros</a><div id="app"><section class="card"><p class="muted">A carregar o monstro...</p></section></div></main><script>
const q=new URLSearchParams(location.search),wantedId=q.get('id')||'',wantedName=q.get('name')||'',wantedElement=q.get('element')||'',wantedStars=Number(q.get('stars')||0),wantedAwakening=Number(q.get('awakening')||0);
const pt={Fire:'Fogo',Water:'Água',Wind:'Vento',Light:'Luz',Dark:'Trevas',Attack:'Ataque',Defense:'Defesa',HP:'HP',Support:'Suporte'};
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=v=>String(v==null?'':v).replace(/\b2ª\s*modificação\b/gi,'').replace(/\bEdit[_\s-]*(Left|Right)\b/gi,'').replace(/\b(Left|Right|Direita|Direito|Esquerda|Esquerdo)\b/gi,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
const norm=v=>clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
const role=m=>pt[m.role]||m.role||'Função geral';
const mode=(c,l,v)=>'<div class="mode '+c+(v?' used':'')+'"><b>'+l+'</b><strong>'+(v?'X':'—')+'</strong></div>';
const valid=m=>m&&m.name;
function fallbackMonster(){return {id:wantedId||'',name:wantedName||'Monstro',element:wantedElement||'',stars:wantedStars||0,awakeningLevel:wantedAwakening||0,image:'',role:'',family:''}}
function find(all){let m=wantedId?all.find(x=>String(x.id)===String(wantedId)):null;if(m)return m;const n=norm(wantedName),c=all.filter(x=>norm(x.name)===n);return c.find(x=>(!wantedElement||x.element===wantedElement)&&(!wantedStars||Number(x.stars)===wantedStars)&&(!wantedAwakening||Number(x.awakeningLevel||0)===wantedAwakening))||c.find(x=>(!wantedElement||x.element===wantedElement)&&(!wantedStars||Number(x.stars)===wantedStars))||c.find(x=>!wantedElement||x.element===wantedElement)||c[0]}
function companions(target,all){const pool=all.filter(valid).filter(x=>String(x.id)!==String(target.id));const need=target.role==='Attack'?['Support','Defense','HP']:target.role==='Defense'?['Attack','Support','HP']:target.role==='Support'?['Attack','Defense','HP']:['Attack','Support','Defense'];const out=[],families=new Set([String(target.family)]);for(const r of need){const x=pool.find(m=>m.role===r&&!families.has(String(m.family)));if(x){out.push(x);families.add(String(x.family))}}for(const x of pool){if(out.length>=3)break;if(!families.has(String(x.family))){out.push(x);families.add(String(x.family))}}return out.slice(0,3)}
function link(m){return 'monster-view.html?id='+encodeURIComponent(m.id||'')+'&name='+encodeURIComponent(m.name||'')+'&element='+encodeURIComponent(m.element||'')+'&stars='+encodeURIComponent(m.stars||'')+'&awakening='+encodeURIComponent(m.awakeningLevel||0)}
function render(m,all,usage){const d=(usage&&usage.monsters&&usage.monsters[norm(m.name)])||{},cs=companions(m,all),base=m.baseStats||m.stats||{},team=[m,...cs],app=document.getElementById('app');app.innerHTML='<section class="card hero"><div class="portrait">'+(m.image?'<img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'" onerror="this.style.display=\'none\'">':'👾')+'</div><div><h1>'+esc(clean(m.name))+'</h1><span class="badge '+esc(m.element||'')+'">'+esc(pt[m.element]||m.element||'')+'</span><span class="badge">'+esc(m.stars||'')+'★</span><span class="badge">'+esc(role(m))+'</span><span class="badge playable">✓ Jogável</span>'+(m.isSecondAwakening?'<span class="badge a2">2A</span>':'')+'<div class="stars">'+('★'.repeat(Math.min(6,Number(m.stars)||0)))+'</div></div></section><section class="card"><h2>📊 Utilização por conteúdo</h2><p class="muted">X = utilização confirmada na base YunaRunes. — = ainda sem dado confirmado.</p><div class="mode-grid">'+mode('rta','RTA',!!d.rta)+mode('arena','Arena',!!d.arena)+mode('siege','Siege',!!d.siege)+mode('pve','PvE',!!d.pve)+'</div></section><section class="card"><h2>🤝 Jogável com</h2><p class="muted">Sugestões automáticas com base nas funções dos monstros.</p><div class="compat">'+cs.map(x=>'<a href="'+link(x)+'"><b>'+esc(clean(x.name))+'</b><br><small>'+esc(pt[x.element]||x.element||'')+' · '+esc(role(x))+'</small></a>').join('')+'</div></section><section class="card"><h2>⚔️ Que equipa usar com '+esc(clean(m.name))+'?</h2><div class="team">'+team.map((x,i)=>'<div class="team-slot"><b>'+esc(clean(x.name))+'</b><br><small>'+esc(pt[x.element]||x.element||'')+' · '+esc(role(x))+' · '+(i===0?'Monstro pesquisado':'Companheiro')+'</small></div>').join('')+'</div><p class="muted">Sugestão automática de 4 monstros; não é classificação S+/S/A/B.</p></section><section class="card"><h2>📋 Informações</h2><div class="grid"><div class="stat"><b>Nome</b>'+esc(clean(m.name))+'</div><div class="stat"><b>Elemento</b>'+esc(pt[m.element]||m.element||'—')+'</div><div class="stat"><b>Estrelas</b>'+esc(m.stars||'—')+'★</div><div class="stat"><b>Função</b>'+esc(role(m))+'</div><div class="stat"><b>Despertar</b>'+esc(m.isSecondAwakening?'2A — Segundo Despertar':'Normal / Despertado')+'</div><div class="stat"><b>ID</b>'+esc(m.id||'—')+'</div><div class="stat"><b>Estado</b>✓ Jogável</div><div class="stat"><b>Família</b>'+esc(m.family||'—')+'</div></div></section><section class="card"><h2>📈 Estatísticas base</h2><div class="grid"><div class="stat"><b>HP</b>'+esc(base.HP==null?'—':base.HP)+'</div><div class="stat"><b>ATK</b>'+esc(base.ATK==null?'—':base.ATK)+'</div><div class="stat"><b>DEF</b>'+esc(base.DEF==null?'—':base.DEF)+'</div><div class="stat"><b>SPD</b>'+esc(base.SPD==null?'—':base.SPD)+'</div></div></section>')}
async function getJSON(path){const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(path+' HTTP '+r.status);return r.json()}
async function init(){const app=document.getElementById('app');try{let data=null,usage={monsters:{}};try{data=await getJSON('monster-catalog.json')}catch(e){console.error('catalogo:',e)}try{usage=await getJSON('usage-info.json')}catch(e){console.error('utilizacao:',e)}const all=data?(Array.isArray(data)?data:(data.monsters||[])):[];const m=find(all)||fallbackMonster();if(!m.name){throw Error('Monstro não identificado')}render(m,all,usage)}catch(e){console.error(e);app.innerHTML='<section class="card error"><h1>Não foi possível carregar o monstro</h1><p class="muted">O link do monstro está incompleto ou a base está temporariamente indisponível.</p><a class="back" href="database.html">Voltar à Database</a></section>'}}init();
</script></body></html>
