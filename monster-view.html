<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Monstro</title>
<style>body{margin:0;background:#0f141a;color:#eef3f7;font-family:Arial,sans-serif}.top{background:#151b22;border-bottom:1px solid #2b3742;padding:16px 22px}.top a{color:#fff;text-decoration:none;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.card{background:#171e26;border:1px solid #2b3742;border-radius:12px;padding:20px;margin-bottom:16px}.hero{display:grid;grid-template-columns:260px 1fr;gap:22px}.portrait{height:260px;background:#0d1217;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.portrait img{max-width:100%;max-height:100%;object-fit:contain}.muted{color:#93a1ae}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.btn{background:#35a9e1;color:#061018;text-decoration:none;padding:11px 14px;border-radius:8px;font-weight:900}.btn.alt{background:#202a34;color:#fff;border:1px solid #344553}.synergy{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.synergy a{background:#131a21;border:1px solid #2b3742;border-radius:9px;padding:12px;color:#fff;text-decoration:none}.synergy a:hover{border-color:#35a9e1}@media(max-width:650px){.hero{grid-template-columns:1fr}.portrait{height:220px}.synergy{grid-template-columns:1fr}}</style>
</head><body><header class="top"><a href="index.html">← YunaRunes</a></header><main class="wrap"><section id="app" class="card"><div class="muted">A carregar...</div></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);const wanted=params.get('name')||'';const isA2=m=>m?.isSecondAwakening===true||Number(m?.awakeningLevel)===2||/\|A2$/i.test(String(m?.detailsKey||''));
async function load(){try{const r=await fetch('./monster-catalog.json?v=20260916-1',{cache:'no-store'});const data=await r.json();const arr=Array.isArray(data)?data:(data.monsters||data.data||[]);const m=arr.find(x=>String(x.name||'').trim().toLowerCase()===wanted.trim().toLowerCase())||arr.find(x=>String(x.name||'').toLowerCase().includes(wanted.trim().toLowerCase()));if(!m)throw Error();const img=m.image||m.imageUrl||m.image_url||m.img||m.icon||m.iconUrl||m.icon_url||m.portrait||m.portraitUrl||'';const a2=isA2(m);document.title=`YunaRunes — ${m.name}`;document.getElementById('app').innerHTML=`<div class="hero"><div class="portrait">${img?`<img src="${esc(img)}" alt="${esc(m.name)}">`:'<span style="font-size:64px">👹</span>'}</div><div><h1>${esc(m.name)}</h1><p class="muted">${esc(m.element||m.attribute||'')} · ${m.stars||''}★ ${a2?'· 2A':''}</p><p>${esc(m.description||m.role||'Monster Database')}</p><div class="btns"><a class="btn" href="team-builder.html?name=${encodeURIComponent(m.name)}">⚔️ Criar equipa com este mob</a><a class="btn alt" href="database.html?search=${encodeURIComponent(m.name)}">👹 Database</a><a class="btn alt" href="runes.html?name=${encodeURIComponent(m.name)}">🌀 Runas</a><a class="btn alt" href="artifact-optimizer.html?name=${encodeURIComponent(m.name)}">💠 Artefactos</a><a class="btn alt" href="decks.html?name=${encodeURIComponent(m.name)}">🃏 Equipas</a></div></div></div><hr style="border:0;border-top:1px solid #2b3742;margin:22px 0"><h2>🔗 Mob Hub</h2><p class="muted">Tudo para este mob num só lugar: equipa, runas, artefactos e decks.</p></div>`}catch(e){document.getElementById('app').innerHTML='<h2>Monstro não encontrado</h2><a class="btn" href="database.html">Voltar à Database</a>'}}load();
</script></body></html>
