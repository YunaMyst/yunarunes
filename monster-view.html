<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monstro — YunaRunes</title><style>body{margin:0;background:#0f141a;color:#eef3f7;font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid #2b3742;display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:#35a9e1}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.back{color:#35a9e1;text-decoration:none}.card{background:#171e26;border:1px solid #2b3742;border-radius:9px;padding:20px;margin-top:16px}.hero{display:flex;gap:22px;align-items:center}.portrait{width:190px;height:190px;background:#202a34;border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none;font-size:70px}.portrait img{width:100%;height:100%;object-fit:contain}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin:3px 5px 3px 0;background:#25303a}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.playable{background:#173e29;color:#8df0ad}.a2{background:#6a4a18;color:#ffd875}.stars{color:#e6c75b;letter-spacing:2px}.grid,.mode-grid,.companions,.team{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.mode,.mob-card,.team-slot{background:#11171d;border:1px solid #2b3742;padding:14px;border-radius:7px}.stat b,.mode b{display:block;color:#93a1ae;font-size:12px;margin-bottom:6px}.mode{text-align:center}.mode strong{font-size:24px}.used strong{color:#7ee787}.muted{color:#93a1ae;line-height:1.5}.mob-card{color:#eef3f7;text-decoration:none;display:block}.mob-img{height:110px;display:grid;place-items:center;overflow:hidden;margin-bottom:8px}.mob-img img{width:100%;height:100%;object-fit:contain}.small{color:#93a1ae;font-size:12px}@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.grid,.mode-grid,.companions,.team{grid-template-columns:1fr 1fr}.portrait{width:150px;height:150px}}@media(max-width:450px){.grid,.mode-grid,.companions,.team{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="database.html">← Voltar à Base de Monstros</a><div id="app"></div></main><script>
const q=new URLSearchParams(location.search);const wantedId=q.get('id')||'';const wantedName=q.get('name')||'Monstro';const wantedElement=q.get('element')||'';const wantedStars=Number(q.get('stars')||0);const wantedAwakening=Number(q.get('awakening')||0);let all=[];let usage={monsters:{}};
const pt={Fire:'Fogo',Water:'Água',Wind:'Vento',Light:'Luz',Dark:'Trevas',Attack:'Ataque',Defense:'Defesa',HP:'HP',Support:'Suporte'};
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=v=>String(v==null?'':v).replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();
const key=v=>clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
const valid=m=>m&&m.name&&m.image;
function link(m){return 'monster-view.html?id='+encodeURIComponent(m.id||'')+'&name='+encodeURIComponent(m.name||'')+'&element='+encodeURIComponent(m.element||'')+'&stars='+encodeURIComponent(m.stars||'')+'&awakening='+encodeURIComponent(m.awakeningLevel||0)}
function modes(m){const d=usage.monsters?.[key(m.name)]||{};return ['rta','arena','siege','pve'].filter(x=>d[x])}
function findTarget(){return all.find(x=>wantedId&&String(x.id)===String(wantedId))||all.find(x=>key(x.name)===key(wantedName))||{id:wantedId,name:wantedName,element:wantedElement,stars:wantedStars,awakeningLevel:wantedAwakening,image:'',role:'',family:''}}
function compatible(target){if(!all.length)return [];const tm=modes(target);const opposite={Attack:['Support','Defense','HP'],Defense:['Attack','Support','HP'],HP:['Attack','Support','Defense'],Support:['Attack','Defense','HP']};const wantedRoles=opposite[target.role]||['Support','Defense','Attack','HP'];const family=String(target.family||'');const pool=all.filter(valid).filter(x=>String(x.id)!==String(target.id)).filter(x=>String(x.family||'')!==family);const score=x=>{const xm=modes(x);let s=0;s+=xm.filter(v=>tm.includes(v)).length*30;s+=wantedRoles.indexOf(x.role)>=0?(25-wantedRoles.indexOf(x.role)*4):0;s+=Number(x.stars||0)*2;s+=xm.length*3;return s};return pool.sort((a,b)=>score(b)-score(a)).slice(0,8)}
function render(){const m=findTarget();const d=usage.monsters?.[key(m.name)]||{};const cs=compatible(m);const team=cs.slice(0,3);document.title=clean(m.name)+' — YunaRunes';document.getElementById('app').innerHTML='<section class="card hero"><div class="portrait">'+(m.image?'<img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'">':'👾')+'</div><div><h1>'+esc(clean(m.name))+'</h1><span class="badge '+esc(m.element)+'">'+esc(pt[m.element]||m.element||'')+'</span><span class="badge">'+esc(m.stars||0)+'★</span><span class="badge">'+esc(pt[m.role]||m.role||'Função geral')+'</span><span class="badge playable">✓ Jogável</span>'+(m.isSecondAwakening?'<span class="badge a2">2A</span>':'')+'<div class="stars">'+('★'.repeat(Math.min(5,Number(m.stars)||0)))+'</div></div></section><section class="card"><h2>📊 Utilização por conteúdo</h2><p class="muted">X = utilização confirmada na base YunaRunes. — = sem dado confirmado.</p><div class="mode-grid">'+['RTA','Arena','Siege','PvE'].map((x,i)=>{const k=['rta','arena','siege','pve'][i];return '<div class="mode '+(d[k]?'used':'')+'"><b>'+x+'</b><strong>'+(d[k]?'X':'—')+'</strong></div>'}).join('')+'</div></section><section class="card"><h2>🤝 Mobs jogáveis com '+esc(clean(m.name))+'</h2><p class="muted">Sugestões automáticas de monstros jogáveis com sinergia de função e/ou conteúdos em comum. Não são classificações.</p><div class="companions">'+(cs.length?cs.map(x=>'<a class="mob-card" href="'+link(x)+'"><div class="mob-img"><img src="'+esc(x.image)+'" alt="'+esc(clean(x.name))+'" loading="lazy"></div><b>'+esc(clean(x.name))+'</b><div class="small">'+esc(pt[x.element]||x.element||'')+' · '+esc(pt[x.role]||x.role||'')+' · '+esc(x.stars||0)+'★</div></a>').join(''):'<p class="muted">Ainda não existem sugestões suficientes na base.</p>')+'</div></section><section class="card"><h2>⚔️ Que equipa usar com '+esc(clean(m.name))+'?</h2><p class="muted">Equipa sugerida automaticamente a partir dos mobs disponíveis e dos conteúdos em comum.</p><div class="team"><div class="team-slot"><b>'+esc(clean(m.name))+'</b><br><span class="small">Monstro pesquisado</span></div>'+team.map(x=>'<div class="team-slot"><b>'+esc(clean(x.name))+'</b><br><span class="small">'+esc(pt[x.element]||x.element||'')+' · '+esc(pt[x.role]||x.role||'')+'</span></div>').join('')+'</div></section><section class="card"><h2>📋 Informações</h2><div class="grid"><div class="stat"><b>Nome</b>'+esc(clean(m.name))+'</div><div class="stat"><b>Elemento</b>'+esc(pt[m.element]||m.element||'—')+'</div><div class="stat"><b>Estrelas</b>'+esc(m.stars||'—')+'★</div><div class="stat"><b>Função</b>'+esc(pt[m.role]||m.role||'—')+'</div><div class="stat"><b>Despertar</b>'+esc(m.isSecondAwakening?'2A — Segundo Despertar':'Normal / Despertado')+'</div><div class="stat"><b>ID</b>'+esc(m.id||'—')+'</div><div class="stat"><b>Estado</b>✓ Jogável</div><div class="stat"><b>Família</b>'+esc(m.family||'—')+'</div></div></section>'}
async function load(){const m=findTarget();render();try{const r=await fetch('monster-catalog.json?v='+Date.now(),{cache:'no-store'});if(r.ok){const d=await r.json();all=Array.isArray(d)?d:(d.monsters||[]);}}catch(e){}try{const r=await fetch('usage-info.json?v='+Date.now(),{cache:'no-store'});if(r.ok)usage=await r.json()}catch(e){}render()}load();
</script><script src="language.js"></script></body></html>
