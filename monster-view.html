</style><div id="mobViewer" class="mob-viewer" aria-hidden="true"><div class="viewer-backdrop" data-close-viewer></div><div class="viewer-panel"><button class="viewer-close" type="button" data-close-viewer>✕</button><div class="viewer-title" id="viewerTitle"></div><div class="viewer-stage" id="viewerStage"><div class="viewer-glow"></div><img id="viewerImage" alt=""></div><div class="viewer-controls"><span>🖱️ Arrasta para girar</span><span>🔍 Roda para zoom</span><span>📱 Desliza no telemóvel</span></div><div class="viewer-note">Visualizador interativo preparado para os modelos completos dos mobs.</div></div></div><style>.mob-viewer{display:none;position:fixed;inset:0;z-index:100;background:rgba(3,7,11,.92);align-items:center;justify-content:center}.mob-viewer.open{display:flex}.viewer-backdrop{position:absolute;inset:0}.viewer-panel{position:relative;width:min(760px,94vw);max-height:94vh;background:#111820;border:1px solid #344553;border-radius:16px;padding:18px;box-shadow:0 20px 80px rgba(0,0,0,.55);z-index:1}.viewer-close{position:absolute;right:12px;top:10px;border:1px solid #344553;background:#202a34;color:#fff;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;z-index:3}.viewer-title{font-weight:900;font-size:20px;padding:3px 48px 12px}.viewer-stage{height:min(68vh,620px);border-radius:12px;background:radial-gradient(circle at 50% 42%,#263542 0,#10161d 48%,#090d12 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;perspective:1100px;touch-action:none;cursor:grab;position:relative}.viewer-stage:active{cursor:grabbing}.viewer-glow{position:absolute;width:55%;height:16%;bottom:9%;border-radius:50%;background:rgba(53,169,225,.13);filter:blur(24px)}#viewerImage{max-width:82%;max-height:88%;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-style:preserve-3d;filter:drop-shadow(0 20px 22px rgba(0,0,0,.55));will-change:transform}.viewer-controls{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:#cbd5dd;font-size:12px;padding:12px 0 4px}.viewer-note{text-align:center;color:#778694;font-size:11px}@media(max-width:600px){.viewer-panel{padding:12px}.viewer-stage{height:66vh}.viewer-controls{gap:7px;font-size:10px}.viewer-title{font-size:17px}}</style></head><body><header class="top"><div class="topline"><a href="index.html">← YunaRunes</a><nav class="topnav"><a href="database.html" data-i18n="Database">Database</a><a href="nat5.html">⭐ Nat 5</a><a href="codes.html" data-i18n="Codes">🎁 Códigos</a><a href="team-builder.html" data-i18n="Team Builder">Team Builder</a><a href="runes.html" data-i18n="Runes">Runas</a><a href="optimizer.html" data-i18n="Optimizer">Optimizer</a></nav><div class="langs"><button data-lang="pt">🇧🇷 PT/BR</button><button data-lang="en">🇬🇧 ENG</button></div></div></header><main class="wrap"><section id="app" class="card"><div class="muted">A carregar...</div></section></main>
<script>let viewerRotation=0,viewerZoom=1,dragging=false,lastX=0;function openMobViewer(name,img){var box=document.getElementById('mobViewer'),im=document.getElementById('viewerImage');if(!box||!im)return;document.getElementById('viewerTitle').textContent=name||'Monstro';im.src=img||'';im.alt=name||'Monstro';viewerRotation=0;viewerZoom=1;applyViewerTransform();box.classList.add('open');box.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closeMobViewer(){var b=document.getElementById('mobViewer');if(!b)return;b.classList.remove('open');b.setAttribute('aria-hidden','true');document.body.style.overflow=''}function applyViewerTransform(){var im=document.getElementById('viewerImage');if(im)im.style.transform='perspective(900px) rotateY('+viewerRotation+'deg) scale('+viewerZoom+')'}function viewerPointerStart(e){dragging=true;lastX=e.clientX||(e.touches&&e.touches[0]?e.touches[0].clientX:0)}function viewerPointerMove(e){if(!dragging)return;var x=e.clientX||(e.touches&&e.touches[0]?e.touches[0].clientX:lastX);viewerRotation+=(x-lastX)*.65;lastX=x;applyViewerTransform()}function viewerPointerEnd(){dragging=false}document.addEventListener('click',function(e){if(e.target.matches('[data-close-viewer]'))closeMobViewer()});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMobViewer()});window.addEventListener('load',function(){var vs=document.getElementById('viewerStage');if(!vs)return;vs.addEventListener('mousedown',viewerPointerStart);window.addEventListener('mousemove',viewerPointerMove);window.addEventListener('mouseup',viewerPointerEnd);vs.addEventListener('touchstart',viewerPointerStart,{passive:true});window.addEventListener('touchmove',viewerPointerMove,{passive:true});window.addEventListener('touchend',viewerPointerEnd);vs.addEventListener('wheel',function(e){e.preventDefault();viewerZoom=Math.max(.65,Math.min(1.8,viewerZoom+(e.deltaY<0?.08:-.08)));applyViewerTransform()},{passive:false})});</script><script src="team-recommendations.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);const wanted=params.get('name')||'';const isA2=m=>m?.isSecondAwakening===true||Number(m?.awakeningLevel)===2||/\|A2$/i.test(String(m?.detailsKey||''));const clean=s=>String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();const T={pt:{Database:'Database',Codes:'Códigos','Team Builder':'Team Builder',Runes:'Runas',Optimizer:'Optimizer',loading:'A carregar...',back:'Voltar à Database','with':'Com que mobs usar?','synergy':'Sugestões de equipa baseadas no sistema de recomendações do YunaRunes. A composição pode variar conforme o conteúdo e o adversário.','build':'⚔️ Criar equipa com este mob',db:'👹 Database',runes:'🌀 Runas',art:'💠 Artefactos',teams:'🃏 Equipas',favorite:'❤️ Guardar nos Meus Mobs',unfavorite:'💔 Remover dos Meus Mobs',runeTitle:'🧿 Build de Runas',runeNote:'Sugestão geral baseada na função do monstro. Usa o Rune Optimizer para encontrar runas reais do teu inventário.'},en:{Database:'Database',Codes:'Codes','Team Builder':'Team Builder',Runes:'Runes',Optimizer:'Optimizer',loading:'Loading...',back:'Back to Database','with':'What monsters should I use with it?','synergy':'Team suggestions from the YunaRunes recommendation system. The composition can vary by content and opponent.','build':'⚔️ Build a team with this monster',db:'👹 Database',runes:'🌀 Runes',art:'💠 Artifacts',teams:'🃏 Teams',favorite:'❤️ Save to My Monsters',unfavorite:'💔 Remove from My Monsters',runeTitle:'🧿 Rune Build',runeNote:'General suggestion based on the monster role. Use Rune Optimizer to find real runes from your inventory.'}};function lang(){return localStorage.getItem('yunarunes-language')==='en'?'en':'pt'}function applyLang(){const l=lang();document.documentElement.lang=l==='en'?'en':'pt-BR';document.querySelectorAll('[data-i18n]').forEach(x=>{const k=x.dataset.i18n;x.textContent=T[l][k]||x.textContent});document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===l))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('yunarunes-language',b.dataset.lang);location.reload()});const favKey=key=>clean(key).toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'');function updateFavoriteButton(name){const k=favKey(name);let a=[];try{a=JSON.parse(localStorage.getItem('yunarunes-favorites')||'[]')}catch(e){}const on=a.includes(k);const b=document.getElementById('favBtn');if(b){b.textContent=on?T[lang()].unfavorite:T[lang()].favorite;b.dataset.on=on?'1':'0'}}function bindFavorite(name){const b=document.getElementById('favBtn');if(!b)return;updateFavoriteButton(name);b.onclick=()=>{const k=favKey(name);let a=[];try{a=JSON.parse(localStorage.getItem('yunarunes-favorites')||'[]')}catch(e){}if(a.includes(k))a=a.filter(x=>x!==k);else a.unshift(k);try{localStorage.setItem('yunarunes-favorites',JSON.stringify(a.slice(0,100)))}catch(e){}updateFavoriteButton(name)}}
async function load(){try{const [cr,dr]=await Promise.all([fetch('./monster-catalog.json?v=20260916-4',{cache:'no-store'}),fetch('./usage-info.json?v=20260916-4',{cache:'no-store'})]);const data=await cr.json();const usage=dr.ok?await dr.json():{};const arr=Array.isArray(data)?data:(data.monsters||data.data||[]);const m=arr.find(x=>clean(x.name).toLowerCase()===clean(wanted).toLowerCase())||arr.find(x=>clean(x.name).toLowerCase().includes(clean(wanted).toLowerCase()));if(!m)throw Error();const img=m.image||m.imageUrl||m.image_url||m.img||m.icon||m.iconUrl||m.icon_url||m.portrait||m.portraitUrl||'';const a2=isA2(m);document.title=`YunaRunes — ${clean(m.name)}`;const all=arr.filter(x=>x&&x.name&&x.image&&Number(x.stars)>=2&&Number(x.stars)<=5);const team=typeof yunaTeamSuggestions==='function'?yunaTeamSuggestions(m,all):[];const u=usage[clean(m.name).toLowerCase()]||usage[clean(m.name)]||{};const l=lang();document.getElementById('app').innerHTML=`<div class="hero"><div class="portrait">${img?`<img src="${esc(img)}" alt="${esc(clean(m.name))}" onclick="openMobViewer('${esc(clean(m.name))}','${esc(img)}')" title="Abrir visualizador do mob">`:'<span style="font-size:64px">👹</span>'}</div><div><h1>${esc(clean(m.name))}</h1><p class="muted">${esc(m.element||m.attribute||'')} · ${m.stars||''}★ ${a2?'· 2A':''}</p><p>${esc(m.description||m.role||'Monster Database')}</p><div>${u.rta?'<span class="badge">RTA ✓</span>':''}${u.arena?'<span class="badge">Arena ✓</span>':''}${u.siege?'<span class="badge">Siege ✓</span>':''}${u.pve?'<span class="badge">PvE ✓</span>':''}</div><div class="btns"><button id="favBtn" class="btn alt" type="button"></button><a class="btn" href="team-builder.html?name=${encodeURIComponent(m.name)}">${T[l].build}</a><a class="btn alt" href="database.html?search=${encodeURIComponent(m.name)}">${T[l].db}</a><a class="btn alt" href="runes.html?name=${encodeURIComponent(m.name)}">${T[l].runes}</a><a class="btn alt" href="artifact-optimizer.html?name=${encodeURIComponent(m.name)}">${T[l].art}</a><a class="btn alt" href="decks.html?name=${encodeURIComponent(m.name)}">${T[l].teams}</a></div></div></div><section class="card"><h2>🤝 ${T[l].with}</h2><p class="muted">${T[l].synergy}</p><div class="synergy">${team.map(x=>`<a href="monster-view.html?name=${encodeURIComponent(clean(x.name))}"><b>${esc(clean(x.name))}</b><br><span class="muted">${esc(x.element||'')} · ${esc(x.role||'')}</span></a>`).join('')||'<span class="muted">Sem sugestões disponíveis.</span>'}</div>${team.length?`<p class="muted"><b>${esc(clean(m.name))}</b> + ${team.map(x=>esc(clean(x.name))).join(' + ')}</p>`:''}</section><section class="card"><h2>${T[l].runeTitle}</h2><p class="muted">${T[l].runeNote}</p><div class="synergy"><a><b>Set principal</b><br><span class="muted">${String(m.role||"").toLowerCase().includes("attack")?"Rage / Fatal + Blade":"Violent + Will"}</span></a><a><b>Slot 2</b><br><span class="muted">${String(m.role||"").toLowerCase().includes("attack")?"ATK% / SPD":"SPD"}</span></a><a><b>Slot 4</b><br><span class="muted">${String(m.role||"").toLowerCase().includes("attack")?"CR% / CD%":"HP% / DEF%"}</span></a><a><b>Slot 6</b><br><span class="muted">${String(m.role||"").toLowerCase().includes("attack")?"ATK%":"HP% / DEF% / ACC%"}</span></a></div><div class="btns"><a class="btn" href="rune-calculator.html?name=${encodeURIComponent(m.name)}">🧮 Calculadora</a><a class="btn alt" href="optimizer.html?monster=${encodeURIComponent(m.name)}">⚙️ Optimizer</a></div></section><section class="card"><h2>🔗 Mob Hub</h2><p class="muted">Tudo para este mob num só lugar: equipa, runas, artefactos e decks.</p></section>`;bindFavorite(clean(m.name));}catch(e){document.getElementById('app').innerHTML=`<h2>Monstro não encontrado</h2><a class="btn" href="database.html">${T[lang()].back}</a>`}}applyLang();load();</script></body></html>
