const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);const wanted=params.get('name')||'';const isA2=m=>m?.isSecondAwakening===true||Number(m?.awakeningLevel)===2||/\|A2$/i.test(String(m?.detailsKey||''));const clean=s=>String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();const T={pt:{Database:'Database',Codes:'Códigos','Team Builder':'Team Builder',Runes:'Runas',Optimizer:'Optimizer',loading:'A carregar...',back:'Voltar à Database','with':'Com que mobs usar?','synergy':'Sugestões de equipa baseadas no sistema de recomendações do YunaRunes. A composição pode variar conforme o conteúdo e o adversário.','build':'⚔️ Criar equipa com este mob',db:'👹 Database',runes:'🌀 Runas',art:'💠 Artefactos',teams:'🃏 Equipas'},en:{Database:'Database',Codes:'Codes','Team Builder':'Team Builder',Runes:'Runes',Optimizer:'Optimizer',loading:'Loading...',back:'Back to Database','with':'What monsters should I use with it?','synergy':'Team suggestions from the YunaRunes recommendation system. The composition can vary by content and opponent.','build':'⚔️ Build a team with this monster',db:'👹 Database',runes:'🌀 Runes',art:'💠 Artifacts',teams:'🃏 Teams'}};function lang(){return localStorage.getItem('yunarunes-language')==='en'?'en':'pt'}function applyLang(){const l=lang();document.documentElement.lang=l==='en'?'en':'pt-BR';document.querySelectorAll('[data-i18n]').forEach(x=>{const k=x.dataset.i18n;x.textContent=T[l][k]||x.textContent});document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===l))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('yunarunes-language',b.dataset.lang);location.reload()});
async function load(){try{const [cr,dr]=await Promise.all([fetch('./monster-catalog.json?v=20260916-4',{cache:'no-store'}),fetch('./usage-info.json?v=20260916-4',{cache:'no-store'})]);const data=await cr.json();const usage=dr.ok?await dr.json():{};const arr=Array.isArray(data)?data:(data.monsters||data.data||[]);const m=arr.find(x=>clean(x.name).toLowerCase()===clean(wanted).toLowerCase())||arr.find(x=>clean(x.name).toLowerCase().includes(clean(wanted).toLowerCase()));if(!m)throw Error();const img=m.image||m.imageUrl||m.image_url||m.img||m.icon||m.iconUrl||m.icon_url||m.portrait||m.portraitUrl||'';const a2=isA2(m);document.title=`YunaRunes — ${clean(m.name)}`;const all=arr.filter(x=>x&&x.name&&x.image&&Number(x.stars)>=2&&Number(x.stars)<=5);const team=typeof yunaTeamSuggestions==='function'?yunaTeamSuggestions(m,all):[];const u=usage[clean(m.name).toLowerCase()]||usage[clean(m.name)]||{};const l=lang();document.getElementById('app').innerHTML=`<div class="hero"><div class="portrait">${img?`<img src="${esc(img)}" alt="${esc(clean(m.name))}">`:'<span style="font-size:64px">👹</span>'}</div><div><h1>${esc(clean(m.name))}</h1><p class="muted">${esc(m.element||m.attribute||'')} · ${m.stars||''}★ ${a2?'· 2A':''}</p><p>${esc(m.description||m.role||'Monster Database')}</p><div>${u.rta?'<span class="badge">RTA ✓</span>':''}${u.arena?'<span class="badge">Arena ✓</span>':''}${u.siege?'<span class="badge">Siege ✓</span>':''}${u.pve?'<span class="badge">PvE ✓</span>':''}</div><div class="btns"><a class="btn" href="team-builder.html?name=${encodeURIComponent(m.name)}">${T[l].build}</a><a class="btn alt" href="database.html?search=${encodeURIComponent(m.name)}">${T[l].db}</a><a class="btn alt" href="runes.html?name=${encodeURIComponent(m.name)}">${T[l].runes}</a><a class="btn alt" href="artifact-optimizer.html?name=${encodeURIComponent(m.name)}">${T[l].art}</a><a class="btn alt" href="decks.html?name=${encodeURIComponent(m.name)}">${T[l].teams}</a></div></div></div><section class="card"><h2>🤝 ${T[l].with}</h2><p class="muted">${T[l].synergy}</p><div class="synergy">${team.map(x=>`<a href="monster-view.html?name=${encodeURIComponent(clean(x.name))}"><b>${esc(clean(x.name))}</b><br><span class="muted">${esc(x.element||'')} · ${esc(x.role||'')}</span></a>`).join('')||'<span class="muted">Sem sugestões disponíveis.</span>'}</div>${team.length?`<p class="muted"><b>${esc(clean(m.name))}</b> + ${team.map(x=>esc(clean(x.name))).join(' + ')}</p>`:''}</section><section class="card"><h2>🔗 Mob Hub</h2><p class="muted">Tudo para este mob num só lugar: equipa, runas, artefactos e decks.</p></section>`}catch(e){document.getElementById('app').innerHTML=`<h2>Monstro não encontrado</h2><a class="btn" href="database.html">${T[lang()].back}</a>`}}applyLang();load();
</script></body></html>
