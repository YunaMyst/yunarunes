<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monstro — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742;--g:#e6c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:20px;margin-top:16px}.hero{display:flex;gap:22px;align-items:center}.portrait{width:190px;height:190px;background:var(--p2);border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none}.portrait img{width:100%;height:100%;object-fit:contain}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin:3px 5px 3px 0}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.playable{background:#173e29;color:#8df0ad}.a2{background:#6a4a18;color:#ffd875}.stars{color:var(--g);letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:7px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.muted{color:var(--m);line-height:1.5}.btn{display:inline-block;background:var(--a);color:#061018;border-radius:5px;padding:10px 14px;text-decoration:none;font-weight:800;margin:12px 5px 0 0}.team{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.team-slot{background:#11171d;border:1px solid var(--b);border-radius:7px;padding:14px}.team-slot strong{display:block;margin-bottom:7px}.tag{display:inline-block;padding:4px 7px;border:1px solid var(--b);border-radius:4px;font-size:11px;color:var(--m);margin:6px 4px 0 0}.note{background:var(--p2);padding:12px;border-radius:7px;margin-top:12px}@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr 1fr}.team{grid-template-columns:1fr 1fr}.portrait{width:150px;height:150px}}@media(max-width:450px){.grid,.team{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="database.html">← Voltar à Base de Monstros</a><div id="app"></div></main><script>const p=new URLSearchParams(location.search),wanted=(p.get('name')||'').trim(),el=p.get('element')||'',stars=Number(p.get('stars')||0),aw=Number(p.get('awakening')||0);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const pt={Fire:'Fogo',Water:'Água',Wind:'Vento',Light:'Luz',Dark:'Trevas',Attack:'Ataque',Defense:'Defesa',HP:'PV',Support:'Suporte'};function clean(v){return String(v??'').replace(/\b2ª\s*modificação\b/gi,'').replace(/\bEdit[_\s-]*(Left|Right)\b/gi,'').replace(/\b(Left|Right|Direita|Direito|Esquerda|Esquerdo)\b/gi,'').replace(/[_]+/g,' ').replace(/\s{2,}/g,' ').trim()}function role(m){return pt[m.role]||m.role||'Não registada'}function cls(m){if(m.role==='Attack')return'Dano';if(m.role==='Defense')return'Defesa / Controlo';if(m.role==='HP')return'PV / Sustentação';if(m.role==='Support')return'Suporte';return'Função geral'}function key(m){return String(m.family)+'|'+m.element}function playable(m){return m&&m.image&&Number(m.stars)>=2&&Number(m.stars)<=6&&String(m.family||'')!=='0'&&String(m.family||'')!=='100000'}function unique(a){const x=new Map();for(const m of a.filter(playable)){const k=key(m),old=x.get(k);if(!old||Number(m.awakeningLevel||0)>Number(old.awakeningLevel||0))x.set(k,m)}return[...x.values()]}function team(target,all){const pool=unique(all).filter(x=>key(x)!==key(target));const wantedRoles=target.role==='Attack'?['Support','Defense','HP']:target.role==='Defense'?['Attack','Support','HP']:target.role==='Support'?['Attack','Defense','HP']:['Attack','Support','Defense'];const out=[target],used=new Set([key(target)]);for(const r of wantedRoles){let m=pool.find(x=>x.role===r&&!used.has(key(x)));if(!m)m=pool.find(x=>!used.has(key(x)));if(m){out.push(m);used.add(key(m))}}return out.slice(0,4)}async function init(){const app=document.getElementById('app');try{const r=await fetch('monster-catalog.json?v='+Date.now());const d=await r.json();const all=Array.isArray(d)?d:(d.monsters||[]);const candidates=all.filter(x=>clean(x.name).toLowerCase()===clean(wanted).toLowerCase());let m=candidates.find(x=>(!el||x.element===el)&&(!stars||Number(x.stars)===stars)&&(!aw||Number(x.awakeningLevel||0)===aw))||candidates.find(x=>(!el||x.element===el)&&(!stars||Number(x.stars)===stars))||candidates[0];if(!m){app.innerHTML='<section class="card"><h1>Monstro não encontrado</h1><p class="muted">Este nome não está na base atual.</p></section>';return}const t=team(m,all),base=m.baseStats||m.stats||{};app.innerHTML='<section class="card hero"><div class="portrait"><img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'"></div><div><h1>'+esc(clean(m.name))+'</h1><span class="badge '+esc(m.element)+'">'+esc(pt[m.element]||m.element)+'</span><span class="badge">'+esc(m.stars)+'★</span><span class="badge">'+esc(role(m))+'</span><span class="badge playable">✓ Jogável</span>'+(m.isSecondAwakening?'<span class="badge a2">2A</span>':'')+'<div class="stars">'+('★'.repeat(Math.min(6,Number(m.stars)||0)))+'</div><p class="muted">Família: '+esc(m.family)+' · Despertar: '+esc(m.awakeningLevel||0)+' · Função: '+esc(cls(m))+'</p><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Rune Builder</a><a class="btn" href="optimizer.html?monster='+encodeURIComponent(m.name)+'">Optimizer</a></div></section><section class="card"><h2>📋 Informações do monstro</h2><div class="grid"><div class="stat"><b>Nome</b>'+esc(clean(m.name))+'</div><div class="stat"><b>Elemento</b>'+esc(pt[m.element]||m.element)+'</div><div class="stat"><b>Estrelas</b>'+esc(m.stars)+'★</div><div class="stat"><b>Função</b>'+esc(role(m))+'</div><div class="stat"><b>Família</b>'+esc(m.family)+'</div><div class="stat"><b>Despertar</b>'+esc(m.isSecondAwakening?'2A — Segundo Despertar':'Normal / Despertado')+'</div><div class="stat"><b>ID</b>'+esc(m.id)+'</div><div class="stat"><b>Estado</b>✓ Jogável</div></div><div class="note">Esta ficha agora usa diretamente a base principal do YunaRunes. Assim, o monstro não fica sem informação mesmo quando o ficheiro antigo de detalhes não tem uma ficha individual.</div></section><section class="card"><h2>⚔️ Que equipa usar com '+esc(clean(m.name))+'?</h2><div class="team">'+t.map((x,i)=>'<div class="team-slot"><strong>'+esc(clean(x.name))+'</strong><span class="tag">'+esc(pt[x.element]||x.element)+'</span><span class="tag">'+esc(role(x))+'</span><span class="tag">'+esc(i===0?'Monstro pesquisado':'Companheiro')+'</span></div>').join('')+'</div><div class="note">A equipa é sugerida automaticamente para equilibrar dano, suporte, defesa/controlo e sustentação. Para PvP/RTA, a composição ideal depende do adversário.</div></section><section class="card"><h2>📊 Dados disponíveis</h2><div class="grid"><div class="stat"><b>HP</b>'+esc(base.HP??'—')+'</div><div class="stat"><b>ATK</b>'+esc(base.ATK??'—')+'</div><div class="stat"><b>DEF</b>'+esc(base.DEF??'—')+'</div><div class="stat"><b>SPD</b>'+esc(base.SPD??'—')+'</div></div><p class="muted">Os dados de skills, multiplicadores e materiais serão adicionados quando o detalhe individual estiver disponível na fonte.</p></section>'}catch(e){app.innerHTML='<section class="card"><h1>Erro ao carregar</h1><p class="muted">Não foi possível carregar a base de monstros.</p></section>'}}init();</script></body></html>
