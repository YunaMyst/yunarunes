<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monstro — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742;--g:#e6c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:20px;margin-top:16px}.hero{display:flex;gap:22px;align-items:center}.portrait{width:190px;height:190px;background:var(--p2);border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none;font-size:70px}.portrait img{width:100%;height:100%;object-fit:contain}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin:3px 5px 3px 0}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.playable{background:#173e29;color:#8df0ad}.a2{background:#6a4a18;color:#ffd875}.stars{color:var(--g);letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:7px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.muted{color:var(--m);line-height:1.5}.btn{display:inline-block;background:var(--a);color:#061018;border-radius:5px;padding:10px 14px;text-decoration:none;font-weight:800;margin:12px 5px 0 0}.team{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.team-slot{background:#11171d;border:1px solid var(--b);border-radius:7px;padding:14px}.team-slot strong{display:block;margin-bottom:7px}.tag{display:inline-block;padding:4px 7px;border:1px solid var(--b);border-radius:4px;font-size:11px;color:var(--m);margin:6px 4px 0 0}.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mode{background:#11171d;border:1px solid var(--b);padding:16px;border-radius:7px;text-align:center}.mode b{display:block;color:var(--m);font-size:12px;margin-bottom:8px}.mode strong{font-size:24px}.used strong{color:#7ee787}.rta{border-left:4px solid #5d8fe8}.arena{border-left:4px solid #d28a45}.siege{border-left:4px solid #70b47b}.pve{border-left:4px solid #a879d1}.compat{display:flex;flex-wrap:wrap;gap:8px}.compat a{background:#11171d;border:1px solid var(--b);border-radius:7px;padding:10px;color:var(--t);text-decoration:none}.compat a:hover{border-color:var(--a)}.error{border-color:#7f3b3b}@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr 1fr}.team{grid-template-columns:1fr 1fr}.mode-grid{grid-template-columns:1fr 1fr}.portrait{width:150px;height:150px}}@media(max-width:450px){.grid,.team,.mode-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="database.html">← Voltar à Base de Monstros</a><div id="app"><section class="card"><p class="muted">A carregar o monstro...</p></section></div></main><script>
const q=new URLSearchParams(location.search),wantedId=q.get('id')||'',wantedName=q.get('name')||'',wantedElement=q.get('element')||'',wantedStars=Number(q.get('stars')||0),wantedAwakening=Number(q.get('awakening')||0);
const pt={Fire:'Fogo',Water:'Água',Wind:'Vento',Light:'Luz',Dark:'Trevas',Attack:'Ataque',Defense:'Defesa',HP:'PV',Support:'Suporte'};
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=v=>String(v==null?'':v).replace(/\b2ª\s*modificação\b/gi,'').replace(/\bEdit[_\s-]*(Left|Right)\b/gi,'').replace(/\b(Left|Right|Direita|Direito|Esquerda|Esquerdo)\b/gi,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
const norm=v=>clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
const role=m=>pt[m.role]||m.role||'Função geral';
const RTA=['Oliver','Giana','Son Zhang Lao','Shi Hou','Okeanos','Tian Lang','Josephine','Sonia','Harmonia','Zeratu','Vanessa','Lora','Juno','Haegang','Kovarci','Jeogun','Yeonhong','Chandra','Han','Verdehile','Seara','Racuni','Shizuka','Seimei','Ethna','Leo','Miles','Velajuel','Karnal','Nephthys','Moore','Nana','Camilla','Woosa','Cheongpung','Anavel','Rica','Mo Long','Eshir','Ganymede','Hathor','Chiwu','Diana','Mei Hou Wang','Minato','Praha','Amber','Charlotte','Sekhmet','Sagar','Zibala','Tomoe','Taor','Tetra','Herne','Abellio','Masha'];
const ARENA=['Oliver','Giana','Teshar','Nephthys','Veromos','Kro','Loren','Sigmarus','Tyron','Camilla','Masha','Juno','Rica','Leo','Fran','Galleon','Lushen','Riley','Savannah','Verdehile','Seara','Karnal','Vanessa','Chiwu','Zima','Abellio','Alice','Alicia','Berenice','Sonia','Feng Yan'];
const SIEGE=['Feng Yan','Artamiel','Rakan','Chandra','Louise','Carcano','Eshir','Shahat','Moore','Cheongpung','Karnal','Savannah','Mo Long','Seara','Giana','Riley','Triana','Manon','Nora','Skogul','Orion','Vigor','Odin','Cichlid','Clara','Imesety','Susano','Praha','Qebehsenuef','Malite','Ophilia','Iunu','Emma','Tetra','Ritesh','Taranys','Camilla','Abellio','Sonia','Coco','Theomars','Galleon','Shaina','Sabrina'];
const PVE=['Teshar','Loren','Sigmarus','Tyron','Kro','Veromos','Fran','Riley','Lushen','Icaru','Spectra','Mellia','Sath','Verdehile','Galleon','Raoq','Naomi','Vigor','Shaina','Sabrina','Talia','Belladeon','Colleen','Baretta','Mav','Theomars','Xiong Fei','Dias','Lapis','Iris','Konamiya','Eirgar','Astar','Kaki','Baleygr','Hraesvelg','Homunculus'];
const sets={rta:new Set(RTA.map(norm)),arena:new Set(ARENA.map(norm)),siege:new Set(SIEGE.map(norm)),pve:new Set(PVE.map(norm))};
const mode=(c,l,v)=>'<div class="mode '+c+(v?' used':'')+'"><b>'+l+'</b><strong>'+(v?'X':'—')+'</strong></div>';
function valid(m){return m&&m.name&&m.image&&!/cristal|chefe do despertar/i.test(String(m.name))}
function find(all){let m=wantedId?all.find(x=>String(x.id)===String(wantedId)):null;if(m)return m;const n=norm(wantedName),c=all.filter(x=>norm(x.name)===n);return c.find(x=>(!wantedElement||x.element===wantedElement)&&(!wantedStars||Number(x.stars)===wantedStars)&&(!wantedAwakening||Number(x.awakeningLevel||0)===wantedAwakening))||c.find(x=>(!wantedElement||x.element===wantedElement)&&(!wantedStars||Number(x.stars)===wantedStars))||c.find(x=>!wantedElement||x.element===wantedElement)||c[0]}
function companions(target,all){const pool=all.filter(valid).filter(x=>String(x.id)!==String(target.id));const sameRole=pool.filter(x=>x.role===target.role);const needed=target.role==='Attack'?['Support','Defense','HP']:target.role==='Defense'?['Attack','Support','HP']:target.role==='Support'?['Attack','Defense','HP']:['Attack','Support','Defense'];const out=[];const usedFamilies=new Set([String(target.family)]);for(const r of needed){let x=pool.find(m=>m.role===r&&!usedFamilies.has(String(m.family)));if(x){out.push(x);usedFamilies.add(String(x.family))}}for(const x of pool){if(out.length>=3)break;if(!usedFamilies.has(String(x.family))){out.push(x);usedFamilies.add(String(x.family))}}return out.slice(0,3)}
function link(m){return 'monster-view.html?id='+encodeURIComponent(m.id)+'&name='+encodeURIComponent(m.name)+'&element='+encodeURIComponent(m.element||'')+'&stars='+encodeURIComponent(m.stars||'')+'&awakening='+encodeURIComponent(m.awakeningLevel||0)}
function render(m,all){const n=norm(m.name),cs=companions(m,all),base=m.baseStats||m.stats||{},app=document.getElementById('app');const team=[m,...cs];app.innerHTML='<section class="card hero"><div class="portrait">'+(m.image?'<img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'" onerror="this.style.display=\'none\'">':'👾')+'</div><div><h1>'+esc(clean(m.name))+'</h1><span class="badge '+esc(m.element||'')+'">'+esc(pt[m.element]||m.element||'')+'</span><span class="badge">'+esc(m.stars||'')+'★</span><span class="badge">'+esc(role(m))+'</span><span class="badge playable">✓ Jogável</span>'+(m.isSecondAwakening?'<span class="badge a2">2A</span>':'')+'<div class="stars">'+('★'.repeat(Math.min(6,Number(m.stars)||0)))+'</div><p class="muted">Este monstro pode ser usado juntamente com outros monstros da base YunaRunes.</p></div></section><section class="card"><h2>📊 Utilização por conteúdo</h2><p class="muted">X = este monstro está marcado como usado neste conteúdo.</p><div class="mode-grid">'+mode('rta','RTA',sets.rta.has(n))+mode('arena','Arena',sets.arena.has(n))+mode('siege','Siege',sets.siege.has(n))+mode('pve','PvE',sets.pve.has(n))+'</div></section><section class="card"><h2>🤝 Jogável com</h2><p class="muted">Companheiros sugeridos automaticamente a partir da função do monstro.</p><div class="compat">'+cs.map(x=>'<a href="'+link(x)+'"><b>'+esc(clean(x.name))+'</b><br><small>'+esc(pt[x.element]||x.element||'')+' · '+esc(role(x))+'</small></a>').join('')+'</div></section><section class="card"><h2>⚔️ Que equipa usar com '+esc(clean(m.name))+'?</h2><div class="team">'+team.map((x,i)=>'<div class="team-slot"><strong>'+esc(clean(x.name))+'</strong><span class="tag">'+esc(pt[x.element]||x.element||'')+'</span><span class="tag">'+esc(role(x))+'</span><span class="tag">'+(i===0?'Monstro pesquisado':'Companheiro')+'</span></div>').join('')+'</div><p class="muted">A equipa é uma sugestão automática de 4 monstros para equilibrar funções. Não é uma classificação S+/S/A/B.</p></section><section class="card"><h2>📋 Informações</h2><div class="grid"><div class="stat"><b>Nome</b>'+esc(clean(m.name))+'</div><div class="stat"><b>Elemento</b>'+esc(pt[m.element]||m.element||'—')+'</div><div class="stat"><b>Estrelas</b>'+esc(m.stars||'—')+'★</div><div class="stat"><b>Função</b>'+esc(role(m))+'</div><div class="stat"><b>Despertar</b>'+esc(m.isSecondAwakening?'2A — Segundo Despertar':'Normal / Despertado')+'</div><div class="stat"><b>ID</b>'+esc(m.id||'—')+'</div><div class="stat"><b>Estado</b>✓ Jogável</div><div class="stat"><b>Família</b>'+esc(m.family||'—')+'</div></div></section><section class="card"><h2>📈 Estatísticas base</h2><div class="grid"><div class="stat"><b>HP</b>'+esc(base.HP==null?'—':base.HP)+'</div><div class="stat"><b>ATK</b>'+esc(base.ATK==null?'—':base.ATK)+'</div><div class="stat"><b>DEF</b>'+esc(base.DEF==null?'—':base.DEF)+'</div><div class="stat"><b>SPD</b>'+esc(base.SPD==null?'—':base.SPD)+'</div></div></section>'}
async function init(){const app=document.getElementById('app');try{const r=await fetch('monster-catalog.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const all=Array.isArray(data)?data:(data.monsters||[]);const m=find(all);if(!m){app.innerHTML='<section class="card error"><h1>Monstro não encontrado</h1><p class="muted">O link não corresponde a nenhum monstro da base.</p><a class="btn" href="database.html">Voltar à Database</a></section>';return}render(m,all)}catch(e){console.error(e);app.innerHTML='<section class="card error"><h1>Erro ao carregar o monstro</h1><p class="muted">Falha ao carregar a base de monstros.</p><a class="btn" href="database.html">Voltar à Database</a></section>'}}init();
</script></body></html>
