<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Detalhes, jogabilidade e sugestões de equipa para monstros de Summoners War."><title>Monster — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742;--gold:#e6c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1050px;margin:auto;padding:30px 18px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:24px;margin-top:18px}.hero{display:flex;gap:24px;align-items:center}.portrait{width:190px;height:190px;background:var(--p2);border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none}.portrait img{width:100%;height:100%;object-fit:contain}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin:2px 6px 2px 0}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.a2{background:#6a4a18;color:#ffd875}.playable{background:#173e29;color:#8df0ad}.stars{color:var(--gold);letter-spacing:2px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:6px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.muted{color:var(--m);line-height:1.5}.btn{display:inline-block;background:var(--a);color:#061018;border-radius:5px;padding:11px 15px;text-decoration:none;font-weight:800;margin-top:15px}.skill{margin:8px 0}.cost{display:inline-block;background:var(--p2);padding:7px 9px;border-radius:5px;margin:4px;font-size:12px}.source{font-size:12px;color:var(--m)}.team{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.team-slot{background:#11171d;border:1px solid var(--b);border-radius:7px;padding:13px}.team-slot strong{display:block;margin-bottom:5px}.team-slot span{font-size:12px;color:var(--m)}.team-note{margin-top:12px}.tag{display:inline-block;padding:4px 7px;border:1px solid var(--b);border-radius:4px;font-size:11px;color:var(--m);margin:2px 4px 2px 0}@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.portrait{width:150px;height:150px}.grid{grid-template-columns:1fr 1fr}.team{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="index.html#monsters">← Voltar à Monster Database</a><div id="app"></div></main><script>const p=new URLSearchParams(location.search),name=p.get('name')||'',element=p.get('element')||'',stars=Number(p.get('stars')||0),awakening=Number(p.get('awakening')||0);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function cleanName(v){return String(v??'').replace(/\b2ª\s*modificação\s*do\s*/gi,'').replace(/\b2ª\s*modificação\b/gi,'').replace(/\bEdit[_\s-]*(Left|Right)\b/gi,'').replace(/\b(Left|Right|Direita|Direito|Esquerda|Esquerdo)\b/gi,'').replace(/[_]+/g,' ').replace(/\s{2,}/g,' ').trim()}async function json(url){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():null}catch(e){return null}}function uniqueByName(list){const seen=new Set();return list.filter(m=>{const k=(m.name+'|'+m.element).toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}function roleOf(m){return String(m?.role||'').toLowerCase()}function buildTeam(target,all){const pool=uniqueByName(all).filter(x=>cleanName(x.name).toLowerCase()!==cleanName(target.name).toLowerCase()||x.element!==target.element);const used=new Set(),result=[target];const pick=tests=>{for(const t of tests){const found=pool.find(x=>!used.has(x.id||x.name)&&t(x));if(found){used.add(found.id||found.name);return found}}return null};const support=x=>['support','hp'].includes(roleOf(x));const attack=x=>roleOf(x)==='attack';const defense=x=>roleOf(x)==='defense';const wind=x=>x.element==='Wind';const water=x=>x.element==='Water';const light=x=>x.element==='Light';const dark=x=>x.element==='Dark';if(attack(target)){result.push(pick([support,defense,wind,light]));result.push(pick([support,water,defense,dark]));result.push(pick([support,attack,wind]))}else if(defense(target)){result.push(pick([attack,support,wind]));result.push(pick([support,attack,water]));result.push(pick([attack,support,light]))}else{result.push(pick([attack,wind,defense]));result.push(pick([attack,water,defense]));result.push(pick([support,attack,light]))}return result.filter(Boolean).slice(0,4)}function teamHtml(team){const labels=['Monstro pesquisado','Dano / pressão','Suporte / controlo','Sustentação / dano'];return '<div class="team">'+team.map((m,i)=>'<div class="team-slot"><strong>'+esc(cleanName(m.name))+'</strong><span>'+esc(m.element)+' · '+esc(m.role||'Função')+'</span><div><span class="tag">'+esc(labels[i]||'Complemento')+'</span></div></div>').join('')+'</div><p class="muted team-note">Sugestão automática baseada na função do monstro e nas funções complementares disponíveis na base. Em PvP, a equipa ideal depende também do adversário.</p>'}async function init(){const app=document.getElementById('app');if(!name){app.innerHTML='<div class="card"><h1>Monstro não especificado</h1></div>';return}const cat=await json('monster-catalog.json?'+Date.now())||{},catalog=cat.monsters||[];const m=catalog.find(x=>x.name?.toLowerCase()===name.toLowerCase()&&(!element||x.element===element)&&(!stars||Number(x.stars)===stars)&&Number(x.awakeningLevel||0)===awakening)||catalog.find(x=>x.name?.toLowerCase()===name.toLowerCase()&&(!element||x.element===element)&&(!stars||Number(x.stars)===stars))||catalog.find(x=>x.name?.toLowerCase()===name.toLowerCase());if(!m){app.innerHTML='<div class="card"><h1>Monstro não encontrado</h1><p class="muted">A base completa está a ser atualizada.</p></div>';return}const all=await json('monster-details.json?'+Date.now())||{},d=all[m.detailsKey]||{},stats=d.stats||{},base=d.baseStats||{},keys=['HP','ATK','DEF','SPD','CRI Rate','CRI Dmg','Resistance','Accuracy'];const statHtml=keys.map(k=>'<div class="stat"><b>'+esc(k)+'</b>'+((stats[k]??'')!==''?esc(stats[k]):'<span class="muted">A verificar</span>')+'</div>').join('');const skills=d.skills||[],skillsHtml=skills.length?skills.map(s=>'<div class="stat skill"><b>'+esc(s.name||'Skill')+'</b><p class="muted">'+esc(s.description||'')+'</p>'+(s.effects||[]).map(x=>'<span class="cost">'+esc(x)+'</span>').join('')+'</div>').join(''):'<p class="muted">Skills não disponíveis no snapshot atual.</p>';const costs=d.awakeningCost||[];const costHtml=costs.length?costs.map(c=>'<span class="cost">'+esc(c.item)+' × '+esc(c.quantity)+'</span>').join(''):'<span class="muted">Sem materiais registados.</span>';const team=buildTeam(m,catalog);app.innerHTML='<section class="card hero"><div class="portrait">'+(m.image?'<img src="'+esc(m.image)+'" alt="'+esc(cleanName(m.name))+'">':'👾')+'</div><div><h1>'+esc(cleanName(m.name))+'</h1><span class="badge '+esc(m.element)+'">'+esc(m.element)+'</span><span class="badge">'+esc(m.stars)+'★ natural</span><span class="badge playable">✓ Jogável</span>'+(m.isSecondAwakening?'<span class="badge a2">2A — Segundo Despertar</span>':'')+'<div class="stars">'+('★'.repeat(Math.min(5,Number(m.stars)||0)))+'</div><p class="muted">Awakening Level '+esc(m.awakeningLevel||0)+' · '+esc(m.role||'')+'</p><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Rune Builder</a> <a class="btn" href="optimizer.html?monster='+encodeURIComponent(m.name)+'">Optimizer</a></div></section><section class="card"><h2>É jogável?</h2><p><span class="badge playable">✓ Sim — monstro jogável</span></p><p class="muted">Este monstro pertence à base de monstros jogáveis do YunaRunes. O 2º Despertar, quando existe, é tratado como evolução do mesmo monstro e não como um mob duplicado.</p></section><section class="card"><h2>⚔️ Bons times com '+esc(cleanName(m.name))+'</h2>'+teamHtml(team)+'</section><section class="card"><h2>Informações</h2><div class="grid"><div class="stat"><b>Elemento</b>'+esc(m.element)+'</div><div class="stat"><b>Estrelas naturais</b>'+esc(m.stars)+'★</div><div class="stat"><b>Despertar</b>'+esc(m.isSecondAwakening?'2A — Segundo Despertar':'Despertado')+'</div><div class="stat"><b>Skill-ups</b>'+esc(d.skillUpsToMax??'—')+'</div></div></section><section class="card"><h2>Stats reais</h2><div class="grid">'+statHtml+'</div><p class="muted">Base: HP '+esc(base.HP??'—')+' · ATK '+esc(base.ATK??'—')+' · DEF '+esc(base.DEF??'—')+' · SPD '+esc(base.SPD??'—')+'</p></section><section class="card"><h2>Skills</h2>'+(d.leaderSkill?'<div class="stat"><b>Leader Skill</b><p class="muted">'+esc(d.leaderSkill)+'</p></div>':'')+skillsHtml+'</section><section class="card"><h2>Despertar</h2><p class="muted">'+esc(d.awakening||'Sem bónus registado.')+'</p><h3>Materiais</h3>'+costHtml+'</section><section class="card"><p class="source">Dados sincronizados do SWARFARM Bestiary.</p></section>}init();</script></body></html>
