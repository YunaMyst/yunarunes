<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monster — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:24px;margin-top:18px}.hero{display:flex;gap:24px;align-items:center}.portrait{width:190px;height:190px;background:var(--p2);border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none}.portrait img{width:100%;height:100%;object-fit:contain}.fallback{font-size:80px}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin-right:6px}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.stars{color:#e6c75b;letter-spacing:2px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:6px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.muted{color:var(--m);line-height:1.5}.btn{display:inline-block;background:var(--a);color:#061018;border-radius:5px;padding:11px 15px;text-decoration:none;font-weight:800;margin-top:15px}.tag{display:inline-block;padding:4px 8px;background:var(--p2);border-radius:4px;color:var(--m);font-size:12px;margin:3px}.skill{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:6px;margin:10px 0}.skill h3{margin:0 0 7px}.pill{display:inline-block;padding:4px 8px;border:1px solid var(--b);border-radius:20px;margin:3px;color:var(--m);font-size:12px}.source{font-size:12px;color:var(--m)}@media(max-width:650px){.hero{flex-direction:column;align-items:flex-start}.portrait{width:150px;height:150px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="index.html#monsters">← Voltar à Monster Database</a><div id="app"></div></main><script>const p=new URLSearchParams(location.search),name=p.get('name')||'',element=p.get('element')||'',stars=Number(p.get('stars')||0);const CSV_URL='https://raw.githubusercontent.com/Selahtin86/summoners-war-db/75104b286b752cd05739dce1db50cd3a3829bdf5/data/monsters.csv';const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function csv(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='\"'){if(q&&n==='\"'){f+='\"';i++}else q=!q}else if(c===','&&!q){row.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(f);if(row.some(v=>v.trim()))rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}async function loadJSON(url){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():null}catch(e){return null}}async function init(){const app=document.getElementById('app');if(!name){app.innerHTML='<div class="card"><h1>Monstro não especificado</h1><p class="muted">Escolhe um monstro na Monster Database.</p></div>';return}let m=null;const local=await loadJSON('monsters.json');if(Array.isArray(local))m=local.find(x=>x.name?.toLowerCase()===name.toLowerCase()&&(!element||x.element===element)&&(!stars||Number(x.stars)===stars))||local.find(x=>x.name?.toLowerCase()===name.toLowerCase());if(!m){try{const r=await fetch(CSV_URL,{cache:'no-store'});if(r.ok){const rows=csv(await r.text()),h=rows.shift().map(x=>x.replace(/^\uFEFF/,'')),i=Object.fromEntries(h.map((x,n)=>[x.trim(),n]));for(const r of rows){const s=Number(r[i.star_grade])||0;if(s<1||s>5)continue;const c={name:r[i.awakened_name],element:r[i.element],role:r[i.monster_type],stars:s,family:r[i.monster_family],image:r[i.image_url]||r[i.base_image_url]||''};if(c.name?.toLowerCase()===name.toLowerCase()&&(!element||c.element===element)&&(!stars||c.stars===stars)){m=c;break}}}}catch(e){}}if(!m){app.innerHTML='<div class="card"><h1>Monstro não encontrado</h1><p class="muted">Esta variante não foi encontrada.</p></div>';return}const all=await loadJSON('monster-details.json')||{};const key=[m.name,m.element,m.stars].join('|');const d=all[key]||all[m.name]||{};const stats=d.stats||{};const keys=['HP','ATK','DEF','SPD','CRI Rate','CRI Dmg','Resistance','Accuracy'];const statHtml=keys.map(k=>'<div class="stat"><b>'+esc(k)+'</b>'+(stats[k]!=null?esc(stats[k]):'<span class="muted">Sem dados</span>')+'</div>').join('');const skills=Array.isArray(d.skills)?d.skills:[];const skillHtml=skills.length?skills.map((s,i)=>'<div class="skill"><h3>'+esc(s.name||('Skill '+(i+1)))+'</h3><p class="muted">'+esc(s.description||'')+'</p>'+((s.effects||[]).map(e=>'<span class="pill">'+esc(e)+'</span>').join(''))+(s.multiplier?'<p class="source">Multiplicador: '+esc(s.multiplier)+'</p>':'')+'</div>').join(''):'<p class="muted">Ainda não há skills disponíveis nesta snapshot.</p>';const costs=Array.isArray(d.awakeningCost)?d.awakeningCost.filter(x=>x.item):[];const costHtml=costs.length?costs.map(x=>'<span class="pill">'+esc(x.item)+' × '+esc(x.quantity)+'</span>').join(''):'<span class="muted">Sem custo registado.</span>';const leader=d.leaderSkill?'<div class="skill"><h3>Leader Skill</h3><p class="muted">'+esc(d.leaderSkill)+'</p></div>':'';const awakening=d.awakening?'<p class="muted">'+esc(d.awakening)+'</p>':'<p class="muted">Sem bónus de despertar registado.</p>';document.title=m.name+' '+m.element+' — YunaRunes';app.innerHTML='<section class="card hero"><div class="portrait">'+(m.image?'<img src="'+esc(m.image)+'" alt="'+esc(m.name)+' '+esc(m.element)+'">':'<span class="fallback">👾</span>')+'</div><div><h1>'+esc(m.name)+'</h1><span class="badge '+esc(m.element)+'">'+esc(m.element)+'</span><span class="muted">'+esc(m.family||'')+'</span><div class="stars">'+('★'.repeat(Math.min(5,Number(m.stars)||0)))+'</div><p class="muted">'+esc(m.element)+' · '+esc(m.stars)+'★</p><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Montar Rune Build</a><a class="btn" href="optimizer.html?monster='+encodeURIComponent(m.name)+'">Abrir Optimizer</a></div></section><section class="card"><h2>Informações</h2><div class="grid"><div class="stat"><b>Função</b>'+esc(m.role||'—')+'</div><div class="stat"><b>Elemento</b>'+esc(m.element||'—')+'</div><div class="stat"><b>Estrelas naturais</b>'+esc(m.stars||'—')+'★</div><div class="stat"><b>Família</b>'+esc(m.family||'—')+'</div><div class="stat"><b>Skill-ups</b>'+esc(d.skillUpsToMax??'—')+'</div><div class="stat"><b>Awakening</b>'+esc(d.awakeningLevel??'—')+'</div></div></section><section class="card"><h2>Stats base — Lv.40 / 6★</h2><div class="grid">'+statHtml+'</div></section><section class="card"><h2>Skills</h2>'+leader+skillHtml+'</section><section class="card"><h2>Despertar</h2>'+awakening+'<h3>Materiais</h3><div>'+costHtml+'</div></section><section class="card"><h2>Runas recomendadas</h2><p class="muted">A recomendação automática de runas será calculada pelo Optimizer.</p><a class="btn" href="optimizer.html?monster='+encodeURIComponent(m.name)+'">Otimizar runas</a></section><section class="card"><p class="source">Dados do monstro atualizados automaticamente a partir do SWARFARM Bestiary. A página usa uma snapshot estática para o GitHub Pages.</p></section>'}init();</script></body></html>
