<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.top{background:#111820;border-bottom:1px solid var(--line);padding:12px 18px;position:sticky;top:0;z-index:10}.topline{max-width:1120px;margin:auto;display:flex;align-items:center;gap:18px}.top a{color:#fff;text-decoration:none;font-weight:900}.topnav{display:flex;gap:14px;flex:1;justify-content:center}.topnav a{color:#cbd5dd;font-size:13px}.topnav a:hover{color:var(--accent)}.langs{display:flex;gap:5px}.langs button{border:0;border-radius:7px;background:#202a34;color:#fff;padding:8px;font-weight:900;cursor:pointer}.langs button.active{background:var(--accent);color:#061018}.wrap{max-width:1120px;margin:auto;padding:24px 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}.hero{display:grid;grid-template-columns:280px 1fr;gap:24px}.portrait{height:280px;background:#0d1319;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.portrait img{max-width:100%;max-height:100%;object-fit:contain}.hero h1{font-size:32px;margin:2px 0 8px}.muted{color:var(--muted)}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.badge{background:#202a34;border:1px solid #344553;border-radius:7px;padding:6px 9px;font-size:12px}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.btn{background:var(--accent);color:#061018;text-decoration:none;padding:11px 14px;border-radius:8px;font-weight:900;border:0;cursor:pointer}.btn.alt{background:#202a34;color:#fff;border:1px solid #344553}.section-title{margin:0 0 7px;font-size:21px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.info{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}.info b{display:block;margin-bottom:6px}.build-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.build-box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}.build-box strong{display:block;font-size:18px;margin-top:5px}.note{margin:10px 0 0}.hub{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.hub a{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;color:#fff;text-decoration:none;font-weight:900}.hub a:hover{border-color:var(--accent)}@media(max-width:800px){.topline{display:block}.topnav{display:none}.langs{position:absolute;right:10px;top:10px}.topline>a{display:inline-block;padding:8px 0}.hero{grid-template-columns:1fr}.portrait{height:230px}.hero h1{font-size:27px}.grid,.build-grid,.hub{grid-template-columns:repeat(2,1fr)}.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.btns .btn{width:100%;text-align:center;line-height:1.2}}@media(max-width:390px){.grid,.build-grid,.hub,.btns{grid-template-columns:1fr}}

/* YunaRunes — aquisição, progresso pessoal e builds por conteúdo */

.yr-select,.yr-input{width:100%;background:#0d1319;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:7px}

</style></head><body><header class="top"><div class="topline"><a href="index.html">← YunaRunes</a><div class="langs"><button data-lang="pt">🇧🇷 PT/BR</button><button data-lang="en">🇬🇧 ENG</button></div></div></header><main class="wrap"><section id="app" class="card"><div class="muted">A carregar...</div></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);const wanted=params.get('name')||'';const isA2=m=>m?.isSecondAwakening===true||Number(m?.awakeningLevel)===2||/\|A2$/i.test(String(m?.detailsKey||''));const clean=s=>String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();
const T={pt:{Database:'Database','Team Builder':'Team Builder',Runes:'Runas',Optimizer:'Optimizer',loading:'A carregar...',back:'Voltar à Database',build:'⚔️ Criar equipa',db:'👹 Database',runes:'🌀 Runas',art:'💠 Artefactos',teams:'🃏 Equipas',favorite:'❤️ Guardar nos Meus Mobs',unfavorite:'💔 Remover dos Meus Mobs',runeTitle:'🧿 Build de Runas',runeNote:'Sugestão rápida baseada na função do monstro. Usa o Optimizer para encontrar as melhores runas do teu inventário.',set:'Conjunto principal',slot2:'Slot 2',slot4:'Slot 4',slot6:'Slot 6',role:'Função',element:'Elemento',stars:'Estrelas',awakening:'Despertar',content:'Conteúdos',hub:'🔗 Acesso rápido',skills:'📖 Skills',stats:'📊 Informações do monstro',second:'🌙 Segundo Despertar'},en:{Database:'Database','Team Builder':'Team Builder',Runes:'Runes',Optimizer:'Optimizer',loading:'Loading...',back:'Back to Database',build:'⚔️ Build a team',db:'👹 Database',runes:'🌀 Runes',art:'💠 Artifacts',teams:'🃏 Teams',favorite:'❤️ Save to My Monsters',unfavorite:'💔 Remove from My Monsters',runeTitle:'🧿 Rune Build',runeNote:'Quick recommendation based on the monster role. Use Optimizer to find the best runes from your inventory.',set:'Main set',slot2:'Slot 2',slot4:'Slot 4',slot6:'Slot 6',role:'Role',element:'Element',stars:'Stars',awakening:'Awakening',content:'Content',hub:'🔗 Quick access',skills:'📖 Skills',stats:'📊 Monster information',second:'🌙 Second Awakening'}};
function lang(){return localStorage.getItem('yunarunes-language')==='en'?'en':'pt'}function applyLang(){const l=lang();document.documentElement.lang=l==='en'?'en':'pt-BR';document.querySelectorAll('[data-i18n]').forEach(x=>{const k=x.dataset.i18n;x.textContent=T[l][k]||x.textContent});document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===l))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('yunarunes-language',b.dataset.lang);location.reload()});
const favKey=key=>clean(key).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');function updateFavoriteButton(name){const k=favKey(name);let a=[];try{a=JSON.parse(localStorage.getItem('yunarunes-favorites')||'[]')}catch(e){}const on=a.includes(k);const b=document.getElementById('favBtn');if(b)b.textContent=on?T[lang()].unfavorite:T[lang()].favorite}function bindFavorite(name){const b=document.getElementById('favBtn');if(!b)return;updateFavoriteButton(name);b.onclick=()=>{const k=favKey(name);let a=[];try{a=JSON.parse(localStorage.getItem('yunarunes-favorites')||'[]')}catch(e){}if(a.includes(k))a=a.filter(x=>x!==k);else a.unshift(k);try{localStorage.setItem('yunarunes-favorites',JSON.stringify(a.slice(0,100)))}catch(e){}updateFavoriteButton(name)}}
async function load(){try{const [cr,dr]=await Promise.all([fetch('./monster-catalog.json?v=20260916-4',{cache:'no-store'}),fetch('./usage-info.json?v=20260916-4',{cache:'no-store'})]);const data=await cr.json();const usage=dr.ok?await dr.json():{};const arr=Array.isArray(data)?data:(data.monsters||data.data||[]);const m=arr.find(x=>clean(x.name).toLowerCase()===clean(wanted).toLowerCase())||arr.find(x=>clean(x.name).toLowerCase().includes(clean(wanted).toLowerCase()));if(!m)throw Error();const img=m.image||m.imageUrl||m.image_url||m.img||m.icon||m.iconUrl||m.icon_url||m.portrait||m.portraitUrl||'';const a2=isA2(m);document.title='YunaRunes — '+clean(m.name);const u=usage[clean(m.name).toLowerCase()]||usage[clean(m.name)]||{};const l=lang();const role=clean(m.role||m.type||'Monster');const element=clean(m.element||m.attribute||'—');const stars=m.stars||'—';const contents=[u.rta?'RTA':null,u.arena?'Arena':null,u.siege?'Siege':null,u.pve?'PvE':null].filter(Boolean);const offensive=/attack|ataque|dd|damage/i.test(role);const mainSet=offensive?'Rage / Fatal + Blade':'Violent + Will';const s2=offensive?'ATK% / SPD':'SPD';const s4=offensive?'CR% / CD%':'HP% / DEF%';const s6=offensive?'ATK%':'HP% / DEF% / ACC%';
document.getElementById('app').innerHTML=`<div class="hero"><div class="portrait">${img?`<img src="${esc(img)}" alt="${esc(clean(m.name))}">`:'<span style="font-size:64px">👹</span>'}</div><div><h1>${esc(clean(m.name))}</h1><p class="muted">${esc(element)} · ${esc(stars)}★ ${a2?'· 2A':''}</p><p>${esc(m.description||m.role||'Monster Database')}</p><div class="badges">${contents.map(x=>'<span class="badge">'+x+' ✓</span>').join('')||'<span class="badge">Database</span>'}</div><div class="btns"><button id="favBtn" class="btn alt" type="button"></button><a class="btn" href="team-builder.html?name=${encodeURIComponent(m.name)}">${T[l].build}</a><a class="btn alt" href="database.html?search=${encodeURIComponent(m.name)}">${T[l].db}</a><a class="btn alt" href="runes.html?name=${encodeURIComponent(m.name)}">${T[l].runes}</a><a class="btn alt" href="artifact-optimizer.html?name=${encodeURIComponent(m.name)}">${T[l].art}</a><a class="btn alt" href="decks.html?name=${encodeURIComponent(m.name)}">${T[l].teams}</a></div></div></div>
<section class="card"><h2 class="section-title">${T[l].stats}</h2><div class="grid"><div class="info"><b>${T[l].element}</b><span class="muted">${esc(element)}</span></div><div class="info"><b>${T[l].stars}</b><span class="muted">${esc(stars)}★</span></div><div class="info"><b>${T[l].role}</b><span class="muted">${esc(role)}</span></div><div class="info"><b>${T[l].awakening}</b><span class="muted">${a2?'2A':'Normal'}</span></div></div></section>
<section class="card" id="yr-obtain-section"><h2 class="section-title">${l==='en'?'📍 Where to get this monster':'📍 Onde obter este monstro'}</h2><p class="muted">${l==='en'?'Only show a source as confirmed when verified for this exact monster. The current database does not yet contain verified acquisition records for every monster.':'As fontes só devem ser consideradas confirmadas quando forem verificadas para este monstro. A base atual ainda não contém registos de obtenção confirmados para todos os monstros.'}</p><div class="obtain-grid"><div class="obtain-item"><b>📜 ${l==='en'?'Summoning scrolls':'Pergaminhos de invocação'}</b><p>${l==='en'?'Check the scroll pool and monster element/rank in-game.':'Confirma no jogo a lista de invocação e a compatibilidade com o elemento e raridade.'}</p></div><div class="obtain-item"><b>🚪 Secret Dungeon</b><p>${l==='en'?'Availability depends on the exact monster and event rotation.':'A disponibilidade depende do monstro específico e da rotação/evento.'}</p></div><div class="obtain-item"><b>🧬 ${l==='en'?'Fusion / pieces':'Fusion / peças'}</b><p>${l==='en'?'Check whether this monster is a Fusion result or has summon pieces.':'Verifica se este monstro é resultado de Fusion ou se existem peças de invocação.'}</p></div><div class="obtain-item"><b>🎁 ${l==='en'?'Events and shops':'Eventos e lojas'}</b><p>${l==='en'?'Limited-time sources can change; confirm current availability in-game.':'As fontes temporárias podem mudar; confirma a disponibilidade atual dentro do jogo.'}</p></div></div><div class="yr-note">${l==='en'?'Verification note: no method is automatically marked as guaranteed. This prevents misleading acquisition claims.':'Nota de verificação: nenhum método é marcado automaticamente como garantido. Assim evitamos indicar fontes erradas.'}</div></section>
<section class="card" id="yr-progress-section"><h2 class="section-title">${l==='en'?'📌 My monster progress':'📌 O meu progresso com este mob'}</h2><p class="muted">${l==='en'?'Saved locally on this device/browser.':'Guardado localmente neste dispositivo/navegador.'}</p><div class="progress-grid"><label class="progress-item"><b>${l==='en'?'Collection status':'Estado na coleção'}</b><select id="yr-monster-status" class="yr-select"><option value="none">${l==='en'?'Not set':'Por definir'}</option><option value="owned">${l==='en'?'I own this monster':'Tenho este mob'}</option><option value="wanted">${l==='en'?'Want to summon':'Quero obter'}</option><option value="build">${l==='en'?'Want to build':'Quero construir'}</option></select></label><label class="progress-item"><b>${l==='en'?'Personal note':'Nota pessoal'}</b><input id="yr-monster-note" class="yr-input" maxlength="240" placeholder="${l==='en'?'e.g. target speed, team idea...':'ex.: velocidade alvo, ideia de equipa...'}"></label></div><div class="btns"><button class="btn" id="yr-save-progress" type="button">${l==='en'?'💾 Save progress':'💾 Guardar progresso'}</button><span id="yr-progress-message" class="muted" aria-live="polite"></span></div></section>
<section class="card" id="yr-awakening-section"><h2 class="section-title">${l==='en'?'✨ Awakening materials':'✨ Materiais de despertar'}</h2><div class="obtain-grid"><div class="obtain-item"><b>${l==='en'?'Elemental essences':'Essências elementais'}</b><p>${l==='en'?'Use the relevant elemental dungeon to farm essences matching the monster element. Exact quantities must be checked in the Awakening screen.':'Usa a dungeon elemental correspondente para obter essências do elemento do monstro. Confirma as quantidades exatas no ecrã de Despertar.'}</p></div><div class="obtain-item"><b>${l==='en'?'Magic essences':'Essências mágicas'}</b><p>${l==='en'?'Farm these in the appropriate Cairos/elemental dungeons. Check the monster screen for the exact grade and quantity.':'Obtém-nas nas dungeons apropriadas. Confirma a raridade e quantidade exatas na ficha do monstro.'}</p></div></div><div class="yr-note">${l==='en'?'This is general guidance, not an invented material count. Second Awakening requirements differ and should be checked in-game.':'Estas são indicações gerais, não quantidades inventadas. Os requisitos do Segundo Despertar são diferentes e devem ser confirmados no jogo.'}</div></section>
<section class="card" id="yr-content-builds"><h2 class="section-title">${l==='en'?'🧭 Builds by content':'🧭 Builds por conteúdo'}</h2><p class="muted">${l==='en'?'Choose a mode to see a role-based starting point. Treat it as a template, not a verified top build for this monster.':'Escolhe um conteúdo para ver uma base de build conforme a função. É um ponto de partida, não uma build de topo confirmada para este monstro.'}</p><label><b>${l==='en'?'Content':'Conteúdo'}</b><select id="yr-build-mode" class="yr-select"><option value="pve">PvE — Giants / Dragons / Necropolis</option><option value="arena">Arena</option><option value="siege">Siege</option><option value="rta">RTA</option></select></label><div id="yr-build-mode-result" class="content-build-grid"></div></section>
<section class="card" id="yr-team-suggestions"><h2 class="section-title">${l==='en'?'🤝 Team ideas and alternatives':'🤝 Ideias de equipas e alternativas'}</h2><p class="muted">${l==='en'?'These are team-building prompts, not a claim that specific teammates are optimal. Use Team Builder to test your own monster pool.':'São orientações para montar equipas, não uma afirmação de que determinados parceiros são ideais. Usa o Team Builder para testar os teus próprios monstros.'}</p><div class="team-suggestions"><div class="team-item"><b>${l==='en'?'Core role':'Função principal'}</b><p>${l==='en'?'Use this monster for its actual skill kit: damage, control, support, healing, or defense break.':'Escolhe a função pela skill real deste mob: dano, controlo, suporte, cura ou redução de defesa.'}</p></div><div class="team-item"><b>${l==='en'?'Partners to consider':'Parceiros a considerar'}</b><p>${l==='en'?'Add a speed lead/booster, protection or sustain, and a complementary damage/control unit as the content requires.':'Considera líder/impulsionador de velocidade, proteção ou sustain e uma unidade complementar de dano/controlo conforme o conteúdo.'}</p></div><div class="team-item"><b>${l==='en'?'Alternatives':'Alternativas'}</b><p>${l==='en'?'Replace missing units with the same function rather than copying a team blindly.':'Substitui os mobs em falta por unidades com função semelhante em vez de copiar uma equipa sem adaptação.'}</p></div><div class="team-item"><b>${l==='en'?'Open Team Builder':'Abrir Team Builder'}</b><p><a href="team-builder.html?name=${encodeURIComponent(m.name)}" style="color:var(--accent);font-weight:800">${l==='en'?'Build a team with this monster →':'Criar equipa com este mob →'}</a></p></div></div></section>
<section class="card"><h2 class="section-title">${T[l].runeTitle}</h2><p class="muted">${T[l].runeNote}</p><div class="build-grid"><div class="build-box"><span>${T[l].set}</span><strong>${mainSet}</strong></div><div class="build-box"><span>${T[l].slot2}</span><strong>${s2}</strong></div><div class="build-box"><span>${T[l].slot4}</span><strong>${s4}</strong></div><div class="build-box"><span>${T[l].slot6}</span><strong>${s6}</strong></div></div><div class="btns"><a class="btn" href="rune-calculator.html?name=${encodeURIComponent(m.name)}">🧮 Calculadora</a><a class="btn alt" href="optimizer.html?monster=${encodeURIComponent(m.name)}">⚙️ Optimizer</a></div></section>
<section class="card"><h2 class="section-title">${T[l].hub}</h2><div class="hub"><a href="team-builder.html?name=${encodeURIComponent(m.name)}">${T[l].build}</a><a href="runes.html?name=${encodeURIComponent(m.name)}">${T[l].runes}</a><a href="artifact-optimizer.html?name=${encodeURIComponent(m.name)}">${T[l].art}</a><a href="decks.html?name=${encodeURIComponent(m.name)}">${T[l].teams}</a></div></section>
${a2?'<section class="card"><h2 class="section-title">'+T[l].second+'</h2><p class="muted">Este monstro possui uma versão de Segundo Despertar.</p></section>':''}`;
const progressKey='yunarunes-monster-progress-v1';function initMonsterProgress(name){const id=favKey(name),all=(()=>{try{return JSON.parse(localStorage.getItem(progressKey)||'{}')}catch(e){return {}}})();const saved=all[id]||{};const status=document.getElementById('yr-monster-status'),note=document.getElementById('yr-monster-note'),msg=document.getElementById('yr-progress-message');if(status)status.value=saved.status||'none';if(note)note.value=saved.note||'';const btn=document.getElementById('yr-save-progress');if(btn)btn.onclick=()=>{all[id]={status:status.value,note:note.value.slice(0,240),name:clean(name),updatedAt:new Date().toISOString()};try{localStorage.setItem(progressKey,JSON.stringify(all));msg.textContent=lang()==='en'?'Saved on this device.':'Guardado neste dispositivo.'}catch(e){msg.textContent=lang()==='en'?'Could not save in this browser.':'Não foi possível guardar neste navegador.'}}}
function renderContentBuild(){const select=document.getElementById('yr-build-mode'),out=document.getElementById('yr-build-mode-result');if(!select||!out)return;const en=lang()==='en';const offensive=/attack|ataque|dd|damage/i.test(role);const mode=select.value;let title='',sets='',stats='',focus='';if(mode==='rta'){title='RTA';sets=offensive?'Swift / Will or Violent / Will':'Violent / Will';stats=offensive?'SPD, CR/CD or ATK, accuracy if needed':'SPD, HP%, DEF%, RES/ACC as skills require';focus=en?'Tune speed and turn order to your draft.':'Ajusta a velocidade e a ordem de turnos à tua composição.'}else if(mode==='siege'){title='Siege';sets=offensive?'Violent / Will or Rage / Blade':'Violent / Will';stats=offensive?'SPD, ATK%, CR/CD':'SPD, HP%, DEF%, RES/ACC as needed';focus=en?'Prioritize consistency and survival for the defense/attack plan.':'Prioriza consistência e sobrevivência para o plano de ataque/defesa.'}else if(mode==='arena'){title='Arena';sets=offensive?'Swift / Blade or Rage / Blade':'Swift / Will or Violent / Will';stats=offensive?'SPD for cleave, or ATK/CR/CD':'SPD, HP%, DEF%, accuracy if needed';focus=en?'Choose a speed-cleave or turn-two setup based on the rest of the team.':'Escolhe uma estratégia de velocidade ou segundo turno conforme o resto da equipa.'}else{title='PvE';sets=offensive?'Rage / Blade, Fatal / Blade or Swift':'Swift, Violent or Despair depending on skills';stats=offensive?'Damage stats; enough SPD to cycle turns':'SPD, HP%, DEF%, ACC if the skills need debuffs';focus=en?'Match accuracy and survivability to the dungeon and team.':'Ajusta precisão e sobrevivência à dungeon e à equipa.'}out.innerHTML='<div class="content-build-item"><b>'+title+' · '+(en?'Rune sets':'Conjuntos')+'</b><p>'+sets+'</p></div><div class="content-build-item"><b>'+(en?'Stat priorities':'Prioridade de stats')+'</b><p>'+stats+'</p></div><div class="content-build-item" style="grid-column:1/-1"><b>'+(en?'Build note':'Nota da build')+'</b><p>'+focus+' '+(en?'Generic starting point; verify the monster skills and team role.':'Base genérica; confirma as skills e a função do monstro na equipa.')+'</p></div>'}document.getElementById('yr-build-mode')?.addEventListener('change',renderContentBuild);
bindFavorite(clean(m.name));initMonsterProgress(clean(m.name));renderContentBuild();}catch(e){document.getElementById('app').innerHTML='<h2>Monstro não encontrado</h2><a class="btn" href="database.html">'+T[lang()].back+'</a>'}}applyLang();load();
</script><script src="language.js?v=20261016-global-lang-fix-v16"></script></body></html>
