<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Detalhes, jogabilidade e sugestões de equipa para monstros de Summoners War."><title>Monster — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742;--gold:#e6c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1050px;margin:auto;padding:30px 18px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:24px;margin-top:18px}.hero{display:flex;gap:24px;align-items:center}.portrait{width:190px;height:190px;background:var(--p2);border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none}.portrait img{width:100%;height:100%;object-fit:contain}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin:2px 6px 2px 0}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.a2{background:#6a4a18;color:#ffd875}.playable{background:#173e29;color:#8df0ad}.stars{color:var(--gold);letter-spacing:2px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:6px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.muted{color:var(--m);line-height:1.5}.btn{display:inline-block;background:var(--a);color:#061018;border-radius:5px;padding:11px 15px;text-decoration:none;font-weight:800;margin-top:15px}.skill{margin:8px 0}.cost{display:inline-block;background:var(--p2);padding:7px 9px;border-radius:5px;margin:4px;font-size:12px}.source{font-size:12px;color:var(--m)}.team{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.team-slot{background:#11171d;border:1px solid var(--b);border-radius:7px;padding:15px}.team-slot strong{display:block;margin-bottom:6px;font-size:16px}.team-slot .element-role{font-size:12px;color:var(--m)}.tag{display:inline-block;padding:4px 7px;border:1px solid var(--b);border-radius:4px;font-size:11px;color:var(--m);margin:7px 4px 0 0}.team-note{margin-top:14px}.why{margin-top:14px;padding:14px;background:var(--p2);border-radius:7px}.why b{display:block;margin-bottom:5px}.warn{background:#3d3018;color:#f3d58a;border:1px solid #665022;padding:12px;border-radius:7px}@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.portrait{width:150px;height:150px}.grid{grid-template-columns:1fr 1fr}.team{grid-template-columns:1fr 1fr}}@media(max-width:450px){.team{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="index.html#monsters">← Voltar à Monster Database</a><div id="app"></div></main><script>const p=new URLSearchParams(location.search),name=p.get('name')||'',element=p.get('element')||'',stars=Number(p.get('stars')||0),awakening=Number(p.get('awakening')||0);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function cleanName(v){return String(v??'').replace(/\b2ª\s*modificação\s*do\s*/gi,'').replace(/\b2ª\s*modificação\b/gi,'').replace(/\bEdit[_\s-]*(Left|Right)\b/gi,'').replace(/\b(Left|Right|Direita|Direito|Esquerda|Esquerdo)\b/gi,'').replace(/[_]+/g,' ').replace(/\s{2,}/g,' ').trim()}async function json(url){try{const r=await fetch(url,{cache:'no-store'});return r.ok?await r.json():null}catch(e){return null}}function playable(m){const fam=String(m?.family??'').trim(),role=String(m?.role??'').toLowerCase(),stars=Number(m?.stars||0),name=cleanName(m?.name||'');return stars>=2&&stars<=5&&fam&&fam!=='0'&&fam!=='100000'&&!['material','none'].includes(role)&&m?.obtainable!==false&&!/angelmon|rainbowmon|devilmon|rainbow|material|food|monster\s*storage/i.test(name)}function canonical(list){const map=new Map();for(const m of list.filter(playable)){const key=String(m.family||cleanName(m.name)).toLowerCase()+'|'+String(m.element||'').toLowerCase(),level=Number(m.awakeningLevel||0),old=map.get(key);if(!old||level>Number(old.awakeningLevel||0))map.set(key,m)}return [...map.values()]}function roleOf(m){return String(m?.role||'').toLowerCase()}function classOf(m){const r=roleOf(m),n=cleanName(m?.name||'').toLowerCase();if(/fran|belladeon|colleen|jeanne|chasun|konamiya|lulu|aegir|water homunculus|wind homunculus/.test(n))return 'Sustentação';if(r==='attack')return 'Dano';if(r==='defense')return 'Controlo / debuff';if(r==='support'||r==='hp')return 'Suporte / buffs';return 'Complemento'}function score(m,target,want,index){let s=0,r=roleOf(m),c=classOf(m);if(c===want)s+=100;if(want==='Dano'&&r==='attack')s+=50;if(want==='Controlo / debuff'&&r==='defense')s+=45;if(want==='Suporte / buffs'&&(r==='support'||r==='hp'))s+=40;if(want==='Sustentação'&&c==='Sustentação')s+=60;if(m.element!==target.element)s+=4;if(Number(m.awakeningLevel||0)>=2)s+=5;if(c!==classOf(target))s+=5;if(String(m.family)===String(target.family))s-=1000;s-=index*.001;return s}function buildTeam(target,all){const pool=canonical(all).filter(x=>String(x.family)!==String(target.family)||String(x.element)!==String(target.element));const needs=roleOf(target)==='attack'?['Suporte / buffs','Controlo / debuff','Sustentação']:roleOf(target)==='defense'?['Dano','Suporte / buffs','Sustentação']:roleOf(target)==='support'?['Dano','Controlo / debuff','Sustentação']:['Dano','Suporte / buffs','Controlo / debuff'];const chosen=[target],used=new Set([String(target.family)+'|'+String(target.element)]);needs.forEach(want=>{let best=null,bestScore=-1e9;pool.forEach((m,i)=>{const key=String(m.family)+'|'+String(m.element);if(used.has(key))return;const s=score(m,target,want,i);if(s>bestScore){bestScore=s;best=m}});if(best){chosen.push(best);used.add(String(best.family)+'|'+String(best.element))}});return chosen.slice(0,4)}function teamReason(target,team){const names=team.slice(1).map(classOf);return 'A composição procura cobrir '+names.join(', ')+', além da função do monstro pesquisado, para evitar uma equipa dependente de apenas uma função.'}function teamHtml(target,team){const labels=['Monstro pesquisado','Companheiro 1','Companheiro 2','Companheiro 3'];return '<div class="team">'+team.map((m,i)=>'<div class="team-slot"><strong>'+esc(cleanName(m.name))+'</strong><div class="element-role">'+esc(m.element)+' · '+esc(m.role||'Função não registada')+'</div><span class="tag">'+esc(i===0?classOf(m):classOf(m))+'</span><span class="tag">'+esc(labels[i])+'</span></div>').join('')+'</div><div class="why"><b>🎯 Por que esta equipa?</b><span class="muted">'+esc(teamReason(target,team))+'</span></div><p class="muted team-note">📌 Esta é uma sugestão automática baseada em sinergia e cobertura de funções. Não é uma equipa meta universal: em PvP, conteúdo, dungeon e outras áreas, a melhor composição pode mudar conforme o objetivo e o adversário.</p>'}async function init(){const app=document.getElementById('app');if(!name){app.innerHTML='<div class="card"><h1>Monstro não especificado</h1></div>';return}const cat=await json('monster-catalog.json?'+Date.now())||{},catalog=Array.isArray(cat.monsters)?cat.monsters:[],m=catalog.find(x=>cleanName(x.name).toLowerCase()===cleanName(name).toLowerCase()&&(!element||x.element===element)&&(!stars||Number(x.stars)===stars)&&Number(x.awakeningLevel||0)===awakening)||catalog.find(x=>cleanName(x.name).toLowerCase()===cleanName(name).toLowerCase()&&(!element||x.element===element)&&(!stars||Number(x.stars)===stars))||catalog.find(x=>cleanName(x.name).toLowerCase()===cleanName(name).toLowerCase());if(!m){app.innerHTML='<div class="card"><h1>Monstro não encontrado</h1><p class="muted">A base completa está a ser atualizada.</p></div>';return}const all=await json('monster-details.json?'+Date.now())||{},d=all[m.detailsKey]||{},stats=d.stats||{},base=d.baseStats||{},keys=['HP','ATK','DEF','SPD','CRI Rate','CRI Dmg','Resistance','Accuracy'],statHtml=keys.map(k=>'<div class="stat"><b>'+esc(k)+'</b>'+((stats[k]??'')!==''?esc(stats[k]):'<span class="muted">A verificar</span>')+'</div>').join(''),skills=d.skills||[],skillsHtml=skills.length?skills.map(s=>'<div class="stat skill"><b>'+esc(s.name||'Skill')+'</b><p class="muted">'+esc(s.description||'')+'</p>'+(s.effects||[]).map(x=>'<span class="cost">'+esc(x)+'</span>').join('')+'</div>').join(''):'<p class="muted">Skills não disponíveis no snapshot atual.</p>',costs=d.awakeningCost||[],costHtml=costs.length?costs.map(c=>'<span class="cost">'+esc(c.item)+' × '+esc(c.quantity)+'</span>').join(''):'<span class="muted">Sem materiais registados.</span>',team=buildTeam(m,catalog);app.innerHTML='<section class="card hero"><div class="portrait">'+(m.image?'<img src="'+esc(m.image)+'" alt="'+esc(cleanName(m.name))+'">':'👾')+'</div><div><h1>'+esc(cleanName(m.name))+'</h1><span class="badge '+esc(m.element)+'">'+esc(m.element)+'</span><span class="badge">'+esc(m.stars)+'★ natural</span><span class="badge playable">✓ Jogável</span>'+(m.isSecondAwakening?'<span class="badge a2">2A — Segundo Despertar</span>':'')+'<div class="stars">'+('★'.repeat(Math.min(5,Number(m.stars)||0)))+'</div><p class="muted">Awakening Level '+esc(m.awakeningLevel||0)+' · '+esc(m.role||'')+'</p><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Rune Builder</a> <a class="btn" href="optimizer.html?monster='+encodeURIComponent(m.name)+'">Optimizer</a></div></section><section class="card"><h2>1. É jogável?</h2><p><span class="badge playable">✓ Sim — monstro jogável</span></p><p class="muted">Este monstro pertence à base de monstros jogáveis do YunaRunes. O 2º Despertar, quando existe, é tratado como evolução do mesmo monstro e não como um mob duplicado.</p></section><section class="card"><h2>2. ⚔️ Bons times com '+esc(cleanName(m.name))+'</h2>'+teamHtml(m,team)+'</section><section class="card"><h2>3. 👥 Os 3 companheiros recomendados</h2>'+team.slice(1).map((x,i)=>'<div class="stat" style="margin:8px 0"><b>'+(i+1)+'. '+esc(cleanName(x.name))+'</b><p class="muted"><strong>Função:</strong> '+esc(classOf(x))+' · '+esc(x.element||'')+' · '+esc(x.role||'')+'</p></div>').join('')+'</section><section class="card"><h2>4. 🎯 Função de cada membro</h2><div class="grid">'+team.map(x=>'<div class="stat"><b>'+esc(cleanName(x.name))+'</b><span>'+esc(classOf(x))+'</span></div>').join('')+'</div><p class="muted">A equipa tenta equilibrar dano, suporte, controlo e sustentação sempre que os dados disponíveis permitem.</p></section><section class="card"><h2>Informações</h2><div class="grid"><div class="stat"><b>Elemento</b>'+esc(m.element)+'</div><div class="stat"><b>Estrelas naturais</b>'+esc(m.stars)+'★</div><div class="stat"><b>Despertar</b>'+esc(m.isSecondAwakening?'2A — Segundo Despertar':'Despertado')+'</div><div class="stat"><b>Skill-ups</b>'+esc(d.skillUpsToMax??'—')+'</div></div></section><section class="card"><h2>Stats reais</h2><div class="grid">'+statHtml+'</div><p class="muted">Base: HP '+esc(base.HP??'—')+' · ATK '+esc(base.ATK??'—')+' · DEF '+esc(base.DEF??'—')+' · SPD '+esc(base.SPD??'—')+'</p></section><section class="card"><h2>Skills</h2>'+(d.leaderSkill?'<div class="stat"><b>Leader Skill</b><p class="muted">'+esc(d.leaderSkill)+'</p></div>':'')+skillsHtml+'</section><section class="card"><h2>Despertar</h2><p class="muted">'+esc(d.awakening||'Sem bónus registado.')+'</p><h3>Materiais</h3>'+costHtml+'</section><section class="card"><p class="source">Dados sincronizados do SWARFARM Bestiary.</p></section>}init();</script></bo
