<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Monstro</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.top{background:#111820;border-bottom:1px solid var(--line);padding:12px 18px;position:sticky;top:0;z-index:10}.topline{max-width:1120px;margin:auto;display:flex;align-items:center;gap:18px}.top a{color:#fff;text-decoration:none;font-weight:900}.topnav{display:flex;gap:14px;flex:1;justify-content:center}.topnav a{color:#cbd5dd;font-size:13px}.topnav a:hover{color:var(--accent)}.langs{display:flex;gap:5px}.langs button{border:0;border-radius:7px;background:#202a34;color:#fff;padding:8px;font-weight:900;cursor:pointer}.langs button.active{background:var(--accent);color:#061018}.wrap{max-width:1120px;margin:auto;padding:24px 16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}.hero{display:grid;grid-template-columns:280px 1fr;gap:24px}.portrait{height:280px;background:#0d1319;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.portrait img{max-width:100%;max-height:100%;object-fit:contain}.hero h1{font-size:32px;margin:2px 0 8px}.muted{color:var(--muted)}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.badge{background:#202a34;border:1px solid #344553;border-radius:7px;padding:6px 9px;font-size:12px}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.btn{background:var(--accent);color:#061018;text-decoration:none;padding:11px 14px;border-radius:8px;font-weight:900;border:0;cursor:pointer}.btn.alt{background:#202a34;color:#fff;border:1px solid #344553}.section-title{margin:0 0 7px;font-size:21px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.info{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px}.info b{display:block;margin-bottom:6px}.build-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.build-box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}.build-box strong{display:block;font-size:18px;margin-top:5px}.note{margin:10px 0 0}.hub{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.hub a{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;color:#fff;text-decoration:none;font-weight:900}.hub a:hover{border-color:var(--accent)}@media(max-width:800px){.topline{display:block}.topnav{display:none}.langs{position:absolute;right:10px;top:10px}.topline>a{display:inline-block;padding:8px 0}.hero{grid-template-columns:1fr}.portrait{height:230px}.hero h1{font-size:27px}.grid,.build-grid,.hub{grid-template-columns:repeat(2,1fr)}.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.btns .btn{width:100%;text-align:center;line-height:1.2}}@media(max-width:390px){.grid,.build-grid,.hub,.btns{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="topline"><a href="index.html">← YunaRunes</a><nav class="topnav"><a href="database.html" data-i18n="Database">Database</a><a href="nat5.html">⭐ Nat 5</a><a href="team-builder.html" data-i18n="Team Builder">Team Builder</a><a href="runes.html" data-i18n="Runes">Runas</a><a href="optimizer.html" data-i18n="Optimizer">Optimizer</a></nav><div class="langs"><button data-lang="pt">🇧🇷 PT/BR</button><button data-lang="en">🇬🇧 ENG</button></div></div></header><main class="wrap"><section id="app" class="card"><div class="muted">A carregar...</div></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);const wanted=params.get('name')||'';const isA2=m=>m?.isSecondAwakening===true||Number(m?.awakeningLevel)===2||/\|A2$/i.test(String(m?.detailsKey||''));const clean=s=>String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();
const T={pt:{Database:'Database','Team Builder':'Team Builder',Runes:'Runas',Optimizer:'Optimizer',loading:'A carregar...',back:'Voltar à Database',build:'⚔️ Criar equipa',db:'👹 Database',runes:'🌀 Runas',art:'💠 Artefactos',teams:'🃏 Equipas',favorite:'❤️ Guardar nos Meus Mobs',unfavorite:'💔 Remover dos Meus Mobs',runeTitle:'🧿 Build de Runas',runeNote:'Sugestão rápida baseada na função do monstro. Usa o Optimizer para encontrar as melhores runas do teu inventário.',set:'Conjunto principal',slot2:'Slot 2',slot4:'Slot 4',slot6:'Slot 6',role:'Função',element:'Elemento',stars:'Estrelas',awakening:'Despertar',content:'Conteúdos',hub:'🔗 Acesso rápido',skills:'📖 Skills',stats:'📊 Informações do monstro',second:'🌙 Segundo Despertar'},en:{Database:'Database','Team Builder':'Team Builder',Runes:'Runes',Optimizer:'Optimizer',loading:'Loading...',back:'Back to Database',build:'⚔️ Build a team',db:'👹 Database',runes:'🌀 Runes',art:'💠 Artifacts',teams:'🃏 Teams',favorite:'❤️ Save to My Monsters',unfavorite:'💔 Remove from My Monsters',runeTitle:'🧿 Rune Build',runeNote:'Quick recommendation based on the monster role. Use Optimizer to find the best runes from your inventory.',set:'Main set',slot2:'Slot 2',slot4:'Slot 4',slot6:'Slot 6',role:'Role',element:'Element',stars:'Stars',awakening:'Awakening',content:'Content',hub:'🔗 Quick access',skills:'📖 Skills',stats:'📊 Monster information',second:'🌙 Second Awakening'}};
function lang(){return localStorage.getItem('yunarunes-language')==='en'?'en':'pt'}function applyLang(){const l=lang();document.documentElement.lang=l==='en'?'en':'pt-BR';document.querySelectorAll('[data-i18n]').forEach(x=>{const k=x.dataset.i18n;x.textContent=T[l][k]||x.textContent});document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===l))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('yunarunes-language',b.dataset.lang);location.reload()});
const favKey=key=>clean(key).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');function updateFavoriteButton(name){const k=favKey(name);let a=[];try{a=JSON.parse(localStorage.getItem('yunarunes-favorites')||'[]')}catch(e){}const on=a.includes(k);const b=document.getElementById('favBtn');if(b)b.textContent=on?T[lang()].unfavorite:T[lang()].favorite}function bindFavorite(name){const b=document.getElementById('favBtn');if(!b)return;updateFavoriteButton(name);b.onclick=()=>{const k=favKey(name);let a=[];try{a=JSON.parse(localStorage.getItem('yunarunes-favorites')||'[]')}catch(e){}if(a.includes(k))a=a.filter(x=>x!==k);else a.unshift(k);try{localStorage.setItem('yunarunes-favorites',JSON.stringify(a.slice(0,100)))}catch(e){}updateFavoriteButton(name)}}
async function load(){try{const [cr,dr]=await Promise.all([fetch('./monster-catalog.json?v=20260916-4',{cache:'no-store'}),fetch('./usage-info.json?v=20260916-4',{cache:'no-store'})]);const data=await cr.json();const usage=dr.ok?await dr.json():{};const arr=Array.isArray(data)?data:(data.monsters||data.data||[]);const m=arr.find(x=>clean(x.name).toLowerCase()===clean(wanted).toLowerCase())||arr.find(x=>clean(x.name).toLowerCase().includes(clean(wanted).toLowerCase()));if(!m)throw Error();const img=m.image||m.imageUrl||m.image_url||m.img||m.icon||m.iconUrl||m.icon_url||m.portrait||m.portraitUrl||'';const a2=isA2(m);document.title='YunaRunes — '+clean(m.name);const u=usage[clean(m.name).toLowerCase()]||usage[clean(m.name)]||{};const l=lang();const role=clean(m.role||m.type||'Monster');const element=clean(m.element||m.attribute||'—');const stars=m.stars||'—';const contents=[u.rta?'RTA':null,u.arena?'Arena':null,u.siege?'Siege':null,u.pve?'PvE':null].filter(Boolean);const offensive=/attack|ataque|dd|damage/i.test(role);const mainSet=offensive?'Rage / Fatal + Blade':'Violent + Will';const s2=offensive?'ATK% / SPD':'SPD';const s4=offensive?'CR% / CD%':'HP% / DEF%';const s6=offensive?'ATK%':'HP% / DEF% / ACC%';
document.getElementById('app').innerHTML=`<div class="hero"><div class="portrait">${img?`<img src="${esc(img)}" alt="${esc(clean(m.name))}">`:'<span style="font-size:64px">👹</span>'}</div><div><h1>${esc(clean(m.name))}</h1><p class="muted">${esc(element)} · ${esc(stars)}★ ${a2?'· 2A':''}</p><p>${esc(m.description||m.role||'Monster Database')}</p><div class="badges">${contents.map(x=>'<span class="badge">'+x+' ✓</span>').join('')||'<span class="badge">Database</span>'}</div><div class="btns"><button id="favBtn" class="btn alt" type="button"></button><a class="btn" href="team-builder.html?name=${encodeURIComponent(m.name)}">${T[l].build}</a><a class="btn alt" href="database.html?search=${encodeURIComponent(m.name)}">${T[l].db}</a><a class="btn alt" href="runes.html?name=${encodeURIComponent(m.name)}">${T[l].runes}</a><a class="btn alt" href="artifact-optimizer.html?name=${encodeURIComponent(m.name)}">${T[l].art}</a><a class="btn alt" href="decks.html?name=${encodeURIComponent(m.name)}">${T[l].teams}</a></div></div></div>
<section class="card"><h2 class="section-title">${T[l].stats}</h2><div class="grid"><div class="info"><b>${T[l].element}</b><span class="muted">${esc(element)}</span></div><div class="info"><b>${T[l].stars}</b><span class="muted">${esc(stars)}★</span></div><div class="info"><b>${T[l].role}</b><span class="muted">${esc(role)}</span></div><div class="info"><b>${T[l].awakening}</b><span class="muted">${a2?'2A':'Normal'}</span></div></div></section>
<section class="card"><h2 class="section-title">${T[l].runeTitle}</h2><p class="muted">${T[l].runeNote}</p><div class="build-grid"><div class="build-box"><span>${T[l].set}</span><strong>${mainSet}</strong></div><div class="build-box"><span>${T[l].slot2}</span><strong>${s2}</strong></div><div class="build-box"><span>${T[l].slot4}</span><strong>${s4}</strong></div><div class="build-box"><span>${T[l].slot6}</span><strong>${s6}</strong></div></div><div class="btns"><a class="btn" href="rune-calculator.html?name=${encodeURIComponent(m.name)}">🧮 Calculadora</a><a class="btn alt" href="optimizer.html?monster=${encodeURIComponent(m.name)}">⚙️ Optimizer</a></div></section>
<section class="card"><h2 class="section-title">${T[l].hub}</h2><div class="hub"><a href="team-builder.html?name=${encodeURIComponent(m.name)}">${T[l].build}</a><a href="runes.html?name=${encodeURIComponent(m.name)}">${T[l].runes}</a><a href="artifact-optimizer.html?name=${encodeURIComponent(m.name)}">${T[l].art}</a><a href="decks.html?name=${encodeURIComponent(m.name)}">${T[l].teams}</a></div></section>
${a2?'<section class="card"><h2 class="section-title">'+T[l].second+'</h2><p class="muted">Este monstro possui uma versão de Segundo Despertar.</p></section>':''}`;
bindFavorite(clean(m.name));}catch(e){document.getElementById('app').innerHTML='<h2>Monstro não encontrado</h2><a class="btn" href="database.html">'+T[lang()].back+'</a>'}}applyLang();load();
</script><script src="language.js?v=20260925-lang-v14"></script><script src="language-dynamic.js?v=20260925-lang-v29"></script></body></html>
