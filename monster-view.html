<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monstro — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742;--g:#e6c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:20px;margin-top:16px}.hero{display:flex;gap:22px;align-items:center}.portrait{width:190px;height:190px;background:var(--p2);border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none;font-size:70px}.portrait img{width:100%;height:100%;object-fit:contain}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin:3px 5px 3px 0;background:#25303a}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.playable{background:#173e29;color:#8df0ad}.a2{background:#6a4a18;color:#ffd875}.stars{color:var(--g);letter-spacing:2px}.grid,.team,.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.team-slot,.mode{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:7px}.stat b,.mode b{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.mode{text-align:center}.mode strong{font-size:24px}.used strong{color:#7ee787}.muted{color:var(--m);line-height:1.5}.compat{display:flex;flex-wrap:wrap;gap:8px}.compat a{background:#11171d;border:1px solid var(--b);border-radius:7px;padding:10px;color:var(--t);text-decoration:none}.error{border-color:#7f3b3b}@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.grid,.team,.mode-grid{grid-template-columns:1fr 1fr}.portrait{width:150px;height:150px}}@media(max-width:450px){.grid,.team,.mode-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="database.html">← Voltar à Base de Monstros</a><div id="app"><section class="card"><p class="muted">A carregar...</p></section></div></main><script>
const q=new URLSearchParams(location.search);const name=q.get('name')||'';const id=q.get('id')||'';const element=q.get('element')||'';const stars=Number(q.get('stars')||0);const awakening=Number(q.get('awakening')||0);const pt={Fire:'Fogo',Water:'Água',Wind:'Vento',Light:'Luz',Dark:'Trevas',Attack:'Ataque',Defense:'Defesa',HP:'HP',Support:'Suporte'};const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=v=>String(v==null?'':v).replace(/\b2ª\s*modificação\b/gi,'').replace(/\bEdit[_\s-]*(Left|Right)\b/gi,'').replace(/\b(Left|Right|Direita|Direito|Esquerda|Esquerdo)\b/gi,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();const key=v=>clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');const mode=(label,on)=>'<div class="mode'+(on?' used':'')+'"><b>'+label+'</b><strong>'+(on?'X':'—')+'</strong></div>';const link=m=>'monster-view.html?id='+encodeURIComponent(m.id||'')+'&name='+encodeURIComponent(m.name||'')+'&element='+encodeURIComponent(m.element||'')+'&stars='+encodeURIComponent(m.stars||'')+'&awakening='+encodeURIComponent(m.awakeningLevel||0);const baseMonster={id,name:name||'Monstro',element,stars,awakeningLevel:awakening,image:'',role:'',family:''};
function draw(m,usage,all){const d=usage?.monsters?.[key(m.name)]||{};const companions=(all||[]).filter(x=>x&&x.name&&String(x.id)!==String(m.id)).slice(0,3);const team=[m,...companions];const stats=m.baseStats||m.stats||{};document.getElementById('app').innerHTML='<section class="card hero"><div class="portrait">'+(m.image?'<img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'" onerror="this.parentElement.textContent=\'👾\'">':'👾')+'</div><div><h1>'+esc(clean(m.name))+'</h1><span class="badge '+esc(m.element)+'">'+esc(pt[m.element]||m.element||'')+'</span><span class="badge">'+esc(m.stars||'')+'★</span><span class="badge">'+esc(pt[m.role]||m.role||'Função geral')+'</span><span class="badge playable">✓ Jogável</span>'+(m.isSecondAwakening?'<span class="badge a2">2A</span>':'')+'<div class="stars">'+('★'.repeat(Math.min(6,Number(m.stars)||0)))+'</div></div></section><section class="card"><h2>📊 Utilização por conteúdo</h2><p class="muted">X = utilização confirmada na base YunaRunes. — = ainda sem dado confirmado.</p><div class="mode-grid">'+mode('RTA',!!d.rta)+mode('Arena',!!d.arena)+mode('Siege',!!d.siege)+mode('PvE',!!d.pve)+'</div></section><section class="card"><h2>🤝 Jogável com</h2><p class="muted">Monstros sugeridos da base YunaRunes.</p><div class="compat">'+(companions.length?companions.map(x=>'<a href="'+link(x)+'"><b>'+esc(clean(x.name))+'</b><br><small>'+esc(pt[x.element]||x.element||'')+' · '+esc(pt[x.role]||x.role||'')+'</small></a>').join(''):'<span class="muted">A carregar sugestões...</span>')+'</div></section><section class="card"><h2>⚔️ Que equipa usar com '+esc(clean(m.name))+'?</h2><div class="team">'+team.map((x,i)=>'<div class="team-slot"><b>'+esc(clean(x.name))+'</b><br><small>'+esc(pt[x.element]||x.element||'')+' · '+esc(pt[x.role]||x.role||'')+' · '+(i===0?'Monstro pesquisado':'Companheiro')+'</small></div>').join('')+'</div></section><section class="card"><h2>📋 Informações</h2><div class="grid"><div class="stat"><b>Nome</b>'+esc(clean(m.name))+'</div><div class="stat"><b>Elemento</b>'+esc(pt[m.element]||m.element||'—')+'</div><div class="stat"><b>Estrelas</b>'+esc(m.stars||'—')+'★</div><div class="stat"><b>Função</b>'+esc(pt[m.role]||m.role||'Função geral')+'</div><div class="stat"><b>Despertar</b>'+esc(m.isSecondAwakening?'2A — Segundo Despertar':'Normal / Despertado')+'</div><div class="stat"><b>ID</b>'+esc(m.id||'—')+'</div><div class="stat"><b>Estado</b>✓ Jogável</div><div class="stat"><b>Família</b>'+esc(m.family||'—')+'</div></div></section><section class="card"><h2>📈 Estatísticas base</h2><div class="grid"><div class="stat"><b>HP</b>'+esc(stats.HP==null?'—':stats.HP)+'</div><div class="stat"><b>ATK</b>'+esc(stats.ATK==null?'—':stats.ATK)+'</div><div class="stat"><b>DEF</b>'+esc(stats.DEF==null?'—':stats.DEF)+'</div><div class="stat"><b>SPD</b>'+esc(stats.SPD==null?'—':stats.SPD)+'</div></div></section>');}
async function json(path){const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(path+' '+r.status);return r.json()}
async function init(){if(!name&&!id){document.getElementById('app').innerHTML='<section class="card error"><h1>Monstro não identificado</h1><a class="back" href="database.html">Voltar à Database</a></section>';return}let usage={monsters:{}};try{usage=await json('usage-info.json')}catch(e){console.warn(e)}draw(baseMonster,usage,[]);try{const data=await json('monster-catalog.json');const all=Array.isArray(data)?data:(data.monsters||[]);const m=all.find(x=>id&&String(x.id)===String(id))||all.find(x=>key(x.name)===key(name)&&(!element||x.element===element));if(m)draw(m,usage,all)}catch(e){console.warn('Catálogo opcional:',e)}}init();
</script></body></html>
