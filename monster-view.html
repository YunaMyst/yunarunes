<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monstro — YunaRunes</title><style>body{margin:0;background:#0f141a;color:#eef3f7;font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid #2b3742;display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:#35a9e1}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.back{color:#35a9e1;text-decoration:none}.card{background:#171e26;border:1px solid #2b3742;border-radius:9px;padding:20px;margin-top:16px}.hero{display:flex;gap:22px;align-items:center}.portrait{width:190px;height:190px;background:#202a34;border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none;font-size:70px}.portrait img{width:100%;height:100%;object-fit:contain}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin:3px 5px 3px 0;background:#25303a}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.playable{background:#173e29;color:#8df0ad}.a2{background:#6a4a18;color:#ffd875}.stars{color:#e6c75b;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.mode{background:#11171d;border:1px solid #2b3742;padding:14px;border-radius:7px}.stat b,.mode b{display:block;color:#93a1ae;font-size:12px;margin-bottom:6px}.mode{text-align:center}.mode strong{font-size:24px}.used strong{color:#7ee787}.mode-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.muted{color:#93a1ae;line-height:1.5}.error{border-color:#7f3b3b}@media(max-width:700px){.hero{flex-direction:column;align-items:flex-start}.grid,.mode-grid{grid-template-columns:1fr 1fr}.portrait{width:150px;height:150px}}@media(max-width:450px){.grid,.mode-grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="database.html">← Voltar à Base de Monstros</a><div id="app"></div></main><script>const q=new URLSearchParams(location.search);const id=q.get('id')||'';const name=q.get('name')||'Monstro';const element=q.get('element')||'';const stars=Number(q.get('stars')||0);const awakening=Number(q.get('awakening')||0);const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=v=>String(v==null?'':v).replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();const pt={Fire:'Fogo',Water:'Água',Wind:'Vento',Light:'Luz',Dark:'Trevas',Attack:'Ataque',Defense:'Defesa',HP:'HP',Support:'Suporte'};function show(m,usage){const d=usage&&usage.monsters?usage.monsters[clean(m.name).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'')]:{};document.title=clean(m.name)+' — YunaRunes';document.getElementById('app').innerHTML='<section class="card hero"><div class="portrait">'+(m.image?'<img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'">':'👾')+'</div><div><h1>'+esc(clean(m.name))+'</h1><span class="badge '+esc(m.element)+'">'+esc(pt[m.element]||m.element||'')+'</span><span class="badge">'+esc(m.stars||0)+'★</span><span class="badge">'+esc(pt[m.role]||m.role||'Função geral')+'</span><span class="badge playable">✓ Jogável</span>'+(m.isSecondAwakening?'<span class="badge a2">2A</span>':'')+'<div class="stars">'+('★'.repeat(Math.min(5,Number(m.stars)||0)))+'</div></div></section><section class="card"><h2>📊 Utilização por conteúdo</h2><p class="muted">X = utilização confirmada. — = sem dado confirmado.</p><div class="mode-grid"><div class="mode"><b>RTA</b><strong>'+(d.rta?'X':'—')+'</strong></div><div class="mode"><b>Arena</b><strong>'+(d.arena?'X':'—')+'</strong></div><div class="mode"><b>Siege</b><strong>'+(d.siege?'X':'—')+'</strong></div><div class="mode"><b>PvE</b><strong>'+(d.pve?'X':'—')+'</strong></div></div></section><section class="card"><h2>📋 Informações</h2><div class="grid"><div class="stat"><b>Nome</b>'+esc(clean(m.name))+'</div><div class="stat"><b>Elemento</b>'+esc(pt[m.element]||m.element||'—')+'</div><div class="stat"><b>Estrelas</b>'+esc(m.stars||'—')+'★</div><div class="stat"><b>Função</b>'+esc(pt[m.role]||m.role||'—')+'</div><div class="stat"><b>Despertar</b>'+esc(m.isSecondAwakening?'2A — Segundo Despertar':'Normal / Despertado')+'</div><div class="stat"><b>ID</b>'+esc(m.id||'—')+'</div><div class="stat"><b>Estado</b>✓ Jogável</div><div class="stat"><b>Família</b>'+esc(m.family||'—')+'</div></div></section></div></section>'}const base={id:id,name:name,element:element,stars:stars,awakeningLevel:awakening,image:'',role:'',family:''};show(base,{});fetch('monster-catalog.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(data=>{const all=Array.isArray(data)?data:(data.monsters||[]);let m=all.find(x=>String(x.id)===String(id));if(!m)m=all.find(x=>clean(x.name).toLowerCase()===clean(name).toLowerCase());if(m)show(m,{});}).catch(()=>{});fetch('usage-info.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(u=>{fetch('monster-catalog.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(data=>{const all=data?(Array.isArray(data)?data:(data.monsters||[])):[];let m=all.find(x=>String(x.id)===String(id))||all.find(x=>clean(x.name).toLowerCase()===clean(name).toLowerCase())||base;show(m,u)}).catch(()=>show(base,u))}).catch(()=>{});</script></body></html>
