<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monster — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:24px;margin-top:18px}.hero{display:flex;gap:24px;align-items:center}.portrait{width:190px;height:190px;background:var(--p2);border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none}.portrait img{width:100%;height:100%;object-fit:contain}.fallback{font-size:80px}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin-right:6px}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.stars{color:#e6c75b;letter-spacing:2px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:6px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.muted{color:var(--m);line-height:1.5}.btn{display:inline-block;background:var(--a);color:#061018;border-radius:5px;padding:11px 15px;text-decoration:none;font-weight:800;margin-top:15px}.tag{display:inline-block;padding:4px 8px;background:var(--p2);border-radius:4px;color:var(--m);font-size:12px;margin:3px}@media(max-width:650px){.hero{flex-direction:column;align-items:flex-start}.portrait{width:150px;height:150px}.grid{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="index.html#monsters">← Voltar à Monster Database</a><div id="app"></div></main><script>const p=new URLSearchParams(location.search),name=p.get('name')||'',element=p.get('element')||'',stars=Number(p.get('stars')||0);const CSV_URL='https://raw.githubusercontent.com/Selahtin86/summoners-war-db/75104b286b752cd05739dce1db50cd3a3829bdf5/data/monsters.csv';const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function csv(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='\"'){if(q&&n==='\"'){f+='\"';i++}else q=!q}else if(c===','&&!q){row.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(f);if(row.some(v=>v.trim()))rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}async function init(){const app=document.getElementById('app');if(!name){app.innerHTML='<div class="card"><h1>Monstro não especificado</h1><p class="muted">Escolhe um monstro na Monster Database.</p></div>';return}let m=null;try{const r=await fetch('monsters.json',{cache:'no-store'});if(r.ok){const d=await r.json();m=d.find(x=>x.name?.toLowerCase()===name.toLowerCase()&&(!element||x.element===element)&&(!stars||Number(x.stars)===stars))||d.find(x=>x.name?.toLowerCase()===name.toLowerCase())}}catch(e){}if(!m){try{const r=await fetch(CSV_URL,{cache:'no-store'});if(r.ok){const rows=csv(await r.text()),h=rows.shift().map(x=>x.replace(/^\uFEFF/,'')),i=Object.fromEntries(h.map((x,n)=>[x.trim(),n]));for(const r of rows){const s=Number(r[i.star_grade])||0;if(s<1||s>5)continue;const c={name:r[i.awakened_name],element:r[i.element],role:r[i.monster_type],stars:s,family:r[i.monster_family],image:r[i.image_url]||r[i.base_image_url]||''};if(c.name?.toLowerCase()===name.toLowerCase()&&(!element||c.element===element)&&(!stars||c.stars===stars)){m=c;break}}}}catch(e){}}if(!m){app.innerHTML='<div class="card"><h1>Monstro não encontrado</h1><p class="muted">Esta variante não foi encontrada.</p></div>';return}let d={};try{const r=await fetch('monster-details.json',{cache:'no-store'});if(r.ok){const all=await r.json();d=all[m.name]||{}}}catch(e){}const stats=d.stats||{};const keys=['HP','ATK','DEF','SPD','CRI Rate','CRI Dmg','Resistance','Accuracy'];const statHtml=keys.map(k=>'<div class="stat"><b>'+esc(k)+'</b>'+(stats[k]!=null?esc(stats[k]):'<span class="muted">A verificar</span>')+'</div>').join('');const skills=Array.isArray(d.skills)?d.skills:[];const skillHtml=skills.length?skills.map(s=>'<div class="stat"><b>'+esc(s.name||'Skill')+'</b><span class="muted">'+esc(s.description||'')+'</span></div>').join(''):'<p class="muted">Skills detalhadas ainda não adicionadas.</p>';document.title=m.name+' '+m.element+' — YunaRunes';app.innerHTML='<section class="card hero"><div class="portrait">'+(m.image?'<img src="'+esc(m.image)+'" alt="'+esc(m.name)+' '+esc(m.element)+'">':'<span class="fallback">👾</span>')+'</div><div><h1>'+esc(m.name)+'</h1><span class="badge '+esc(m.element)+'">'+esc(m.element)+'</span><span class="muted">'+esc(m.family||'')+'</span><div class="stars">'+('★'.repeat(Math.min(5,Number(m.stars)||0)))+'</div><p class="muted">Variante individual: '+esc(m.element)+' · '+esc(m.stars)+'★</p><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Montar Rune Build</a></div></section><section class="card"><h2>Informações</h2><div class="grid"><div class="stat"><b>Função</b>'+esc(m.role||'—')+'</div><div class="stat"><b>Elemento</b>'+esc(m.element||'—')+'</div><div class="stat"><b>Estrelas</b>'+esc(m.stars||'—')+'★</div><div class="stat"><b>Família</b>'+esc(m.family||'—')+'</div></div></section><section class="card"><h2>Stats base</h2><div class="grid">'+statHtml+'</div></section><section class="card"><h2>Skills</h2>'+skillHtml+'</section><section class="card"><h2>Runas recomendadas</h2><p class="muted">As recomendações serão adicionadas quando os dados forem verificados.</p><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Abrir Rune Builder</a></section>'}init();</script></body></html>
