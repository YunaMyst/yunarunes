<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Rune Builder</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#edf2f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{padding:18px 24px;background:#151b22;border-bottom:1px solid var(--b)}.logo{font-size:24px;font-weight:900;color:#fff;text-decoration:none}.logo span{color:var(--a)}.wrap{max-width:1050px;margin:auto;padding:25px 16px}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:20px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}select,input{background:#0d1217;color:white;border:1px solid var(--b);border-radius:5px;padding:11px;width:100%;margin-top:6px}.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.slot{background:var(--p2);border:1px solid #364452;padding:14px 7px;border-radius:6px}.slot h3{margin:0 0 8px}.slot select{font-size:12px}.btn{background:var(--a);border:0;border-radius:5px;padding:12px 18px;font-weight:800;margin-top:15px;cursor:pointer}.muted{color:var(--m)}.result{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#11171d;border:1px solid var(--b);border-radius:6px;padding:12px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.monster-info{margin-top:10px;display:flex;align-items:center;gap:12px;color:var(--m);min-height:58px}.monster-icon{width:58px;height:58px;border-radius:8px;object-fit:cover;background:#0b1015;border:1px solid var(--b);display:none}.monster-text{line-height:1.45}.monster-name{color:#fff;font-weight:800}.stars{color:#f5c451;letter-spacing:1px}@media(max-width:800px){.slots{grid-template-columns:repeat(3,1fr)}.result{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.slots,.result{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><div class="card"><h1>Rune Builder</h1><p class="muted">Pesquisa um monstro para preparar a build. A base inclui nome, elemento, família, estrelas e, quando disponível, o ícone do monstro.</p><div class="grid"><label>Monstro<input id="monster" list="monsterList" autocomplete="off" placeholder="Pesquisar qualquer monstro..."/><datalist id="monsterList"></datalist><div id="monsterInfo" class="monster-info"><img id="monsterIcon" class="monster-icon" alt=""><div id="monsterText" class="monster-text">A carregar base de monstros...</div></div></label><label>Set principal<select id="set"><option>Violent</option><option>Swift</option><option>Despair</option><option>Fatal</option><option>Rage</option><option>Will</option><option>Revenge</option><option>Shield</option><option>Focus</option><option>Energy</option><option>Guard</option><option>Nemesis</option></select></label></div></div><div class="card"><h2>Slots 1–6</h2><div class="slots" id="slots"></div><button class="btn" onclick="saveBuild()">Guardar build</button><button class="btn" onclick="clearBuild()">Limpar</button><p id="msg" class="muted"></p></div><div class="card"><h2>Resumo da build</h2><div class="result"><div class="stat"><b>Monstro</b><span id="rMonster">—</span></div><div class="stat"><b>Set</b><span id="rSet">—</span></div><div class="stat"><b>Slots escolhidos</b><span id="rSlots">0/6</span></div><div class="stat"><b>Estado</b><span id="rState">Não guardada</span></div></div></div></main><script>const params=new URLSearchParams(location.search);const monsterInput=document.getElementById('monster');const monsterText=document.getElementById('monsterText');const monsterIcon=document.getElementById('monsterIcon');monsterInput.value=params.get('monster')||localStorage.getItem('yunarunes_monster')||'';const configs=[['1',['ATK']],['2',['SPD','ATK%','DEF%','HP%']],['3',['DEF']],['4',['CD%','CR%','ATK%','DEF%','HP%']],['5',['HP']],['6',['HP%','DEF%','ATK%','ACC%','RES%']]];let monsterDB=[];function csvRows(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quoted&&n==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(field);if(row.some(v=>v.trim()!==''))rows.push(row);row=[];field=''}else field+=c}if(field||row.length){row.push(field);rows.push(row)}return rows}function addMonster(name,element,family,stars,image){name=(name||'').trim();if(!name)return;const key=(name+'|'+(element||'')).toLowerCase();const existing=monsterDB.find(m=>(m.name+'|'+m.element).toLowerCase()===key);if(existing){if(!existing.image&&image)existing.image=image;return}monsterDB.push({name,element:element||'',family:family||'',stars:stars||'',image:image||''})}function renderMonsterList(){const dl=document.getElementById('monsterList');const unique=[];const seen=new Set();monsterDB.sort((a,b)=>a.name.localeCompare(b.name,'en'));monsterDB.forEach(m=>{const key=m.name+'|'+m.element;if(!seen.has(key)){seen.add(key);unique.push(m)}});dl.innerHTML=unique.map(m=>'<option value="'+m.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" label="'+(m.element||'')+' • '+(m.family||'')+'">').join('');monsterDB=unique;monsterText.textContent=unique.length+' entradas de monstros carregadas';setTimeout(updateMonsterInfo,0)}async function loadMonsters(){try{const local=await fetch('monsters.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]);(Array.isArray(local)?local:[]).forEach(m=>addMonster(m.name,m.element,m.family,m.stars,m.image_url||m.image))}catch(e){}try{const url='https://raw.githubusercontent.com/Selahtin86/summoners-war-db/75104b286b752cd05739dce1db50cd3a3829bdf5/data/monsters.csv';const csv=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('csv');return r.text()});const rows=csvRows(csv);const header=rows.shift().map(x=>x.replace(/^\uFEFF/,''));const idx=Object.fromEntries(header.map((h,i)=>[h,i]));rows.forEach(r=>addMonster(r[idx.awakened_name],r[idx.element],r[idx.monster_family],r[idx.star_grade],r[idx.image_url]));renderMonsterList()}catch(e){renderMonsterList();monsterText.textContent=monsterDB.length+' entradas locais carregadas. A base externa não respondeu.'}}function updateMonsterInfo(){const value=monsterInput.value.trim().toLowerCase();const matches=monsterDB.filter(m=>m.name.toLowerCase()===value);monsterIcon.style.display='none';monsterIcon.removeAttribute('src');if(matches.length===1){const m=matches[0];const stars=m.stars?' <span class="stars">'+'★'.repeat(Math.min(Number(m.stars),6))+'</span>':'';monsterText.innerHTML='<span class="monster-name">'+m.name+'</span><br>'+[m.element,m.family].filter(Boolean).join(' • ')+(stars?' • '+stars:'');if(m.image){monsterIcon.src=m.image;monsterIcon.alt=m.name;monsterIcon.style.display='block';monsterIcon.onerror=()=>{monsterIcon.style.display='none'}}}else if(matches.length>1){monsterText.textContent=matches.map(m=>(m.element||'')+' • '+(m.family||'')).join(' / ')}else if(value){monsterText.textContent='Monstro não encontrado na base carregada.'}else{monsterText.textContent=monsterDB.length?monsterDB.length+' entradas de monstros carregadas':'A carregar base de monstros...'}}function draw(){document.getElementById('slots').innerHTML=configs.map(([n,opts])=>'<div class="slot"><h3>Slot '+n+'</h3><select id="slot'+n+'"><option value="">Escolher main stat</option>'+opts.map(x=>'<option>'+x+'</option>').join('')+'</select><input id="sub'+n+'" placeholder="Substats (ex.: SPD, HP%)"></div>').join('');configs.forEach(([n])=>{const d=JSON.parse(localStorage.getItem('yunarunes_slot_'+n)||'null');if(d){document.getElementById('slot'+n).value=d.main||'';document.getElementById('sub'+n).value=d.sub||''}});updateSummary()}function updateSummary(){let count=configs.filter(([n])=>document.getElementById('slot'+n)?.value).length;document.getElementById('rMonster').textContent=monsterInput.value||'—';document.getElementById('rSet').textContent=document.getElementById('set').value;document.getElementById('rSlots').textContent=count+'/6';updateMonsterInfo()}function saveBuild(){localStorage.setItem('yunarunes_monster',monsterInput.value);localStorage.setItem('yunarunes_set',document.getElementById('set').value);configs.forEach(([n])=>localStorage.setItem('yunarunes_slot_'+n,JSON.stringify({main:document.getElementById('slot'+n).value,sub:document.getElementById('sub'+n).value})));document.getElementById('rState').textContent='Guardada neste dispositivo';document.getElementById('msg').textContent='Build guardada automaticamente no teu dispositivo.';updateSummary()}function clearBuild(){configs.forEach(([n])=>localStorage.removeItem('yunarunes_slot_'+n));localStorage.removeItem('yunarunes_monster');localStorage.removeItem('yunarunes_set');monsterInput.value='';document.getElementById('set').value='Violent';draw();document.getElementById('rState').textContent='Não guardada';document.getElementById('msg').textContent='Build limpa.'}document.getElementById('set').value=localStorage.getItem('yunarunes_set')||'Violent';document.getElementById('set').addEventListener('change',updateSummary);monsterInput.addEventListener('input',updateSummary);draw();loadMonsters();</script></body></html>
