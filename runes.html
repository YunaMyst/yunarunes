<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Rune Builder</title><style>body{margin:0;background:#0f141a;color:#edf2f7;font-family:Arial}.top{padding:18px 24px;background:#151b22;border-bottom:1px solid #2b3742}.logo{font-size:24px;font-weight:900}.logo span{color:#35a9e1}.wrap{max-width:900px;margin:auto;padding:25px 16px}.card{background:#171e26;border:1px solid #2b3742;border-radius:8px;padding:20px;margin-bottom:15px}select,input{background:#0d1217;color:white;border:1px solid #2b3742;border-radius:5px;padding:11px;width:100%;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.slot{background:#202a34;border:1px solid #364452;padding:18px 5px;text-align:center;border-radius:6px}.btn{background:#35a9e1;border:0;border-radius:5px;padding:12px 18px;font-weight:800;margin-top:15px;cursor:pointer}@media(max-width:650px){.grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><div class="card"><h1>Rune Builder</h1><p>Cria uma build de runas para o teu monstro.</p><div class="grid"><label>Monstro<input id="monster" placeholder="Ex.: Lushen"></label><label>Set principal<select><option>Violent</option><option>Swift</option><option>Despair</option><option>Fatal</option><option>Rage</option><option>Will</option><option>Revenge</option><option>Shield</option><option>Focus</option><option>Energy</option><option>Guard</option><option>Nemesis</option></select></label></div></div><div class="card"><h2>Slots</h2><div class="slots"><div class="slot">Slot 1<br>ATK</div><div class="slot">Slot 2<br>ATK% / SPD</div><div class="slot">Slot 3<br>DEF</div><div class="slot">Slot 4<br>ATK% / CR / CD</div><div class="slot">Slot 5<br>HP</div><div class="slot">Slot 6<br>HP% / DEF%</div></div><button class="btn" onclick="saveBuild()">Guardar build</button><p id="msg"></p></div></main><script>function saveBuild(){let m=document.getElementById('monster').value||'Monstro';document.getElementById('msg').textContent='Build de '+m+' preparada. O sistema de contas e gravação permanente será adicionado numa próxima fase.'}</script></body></html>
