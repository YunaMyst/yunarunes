<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Rune Builder</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#edf2f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742;--ok:#8ee28e}.top{padding:18px 24px;background:#151b22;border-bottom:1px solid var(--b)}.logo{font-size:24px;font-weight:900;color:#fff;text-decoration:none}.logo span{color:var(--a)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:20px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}select,input{background:#0d1217;color:white;border:1px solid var(--b);border-radius:5px;padding:11px;width:100%;margin-top:6px}.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.slot{background:var(--p2);border:1px solid #364452;padding:14px 7px;border-radius:6px}.slot h3{margin:0 0 8px}.slot select{font-size:12px}.btn{background:var(--a);border:0;border-radius:5px;padding:12px 18px;font-weight:800;margin-top:15px;cursor:pointer}.btn.secondary{background:var(--p2);color:var(--t)}.muted{color:var(--m)}.result{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#11171d;border:1px solid var(--b);border-radius:6px;padding:12px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.monster-info{margin-top:10px;display:flex;align-items:center;gap:12px;color:var(--m);min-height:72px}.monster-icon{width:72px;height:72px;border-radius:8px;object-fit:cover;background:#0b1015;border:1px solid var(--b);display:none}.monster-name{color:#fff;font-weight:800}.stars{color:#f5c451;letter-spacing:1px}.element{font-weight:700}.optimized{border:1px solid var(--a);background:#10212c;padding:14px;border-radius:7px;margin-bottom:15px}.rune-data{font-size:12px;color:var(--m);margin-top:8px;line-height:1.5}.catalog-note{margin-top:8px;font-size:12px;color:var(--m)}@media(max-width:800px){.slots{grid-template-columns:repeat(3,1fr)}.result{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.slots,.result{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><div id="optimized" class="optimized" style="display:none"></div><div class="card"><h1>Rune Builder</h1><p class="muted">Escolhe qualquer monstro, elemento e evolução disponível na base. Cada variante usa a fotografia correspondente.</p><div class="grid"><label>Monstro<input id="monster" list="monsterList" autocomplete="off" placeholder="Pesquisar nome, elemento ou estrelas..."><datalist id="monsterList"></datalist><div id="monsterInfo" class="monster-info"><img id="monsterIcon" class="monster-icon" alt=""><div id="monsterText">A carregar todos os monstros...</div></div><div id="catalogNote" class="catalog-note"></div></label><label>Set principal<select id="set"><option>Violent</option><option>Swift</option><option>Despair</option><option>Fatal</option><option>Rage</option><option>Will</option><option>Revenge</option><option>Shield</option><option>Focus</option><option>Energy</option><option>Guard</option><option>Nemesis</option></select></label></div></div><div class="card"><h2>Slots 1–6</h2><div class="slots" id="slots"></div><button class="btn" onclick="saveBuild()">Guardar build</button><button class="btn secondary" onclick="clearBuild()">Limpar</button><p id="msg" class="muted"></p></div><div class="card"><h2>Resumo da build</h2><div class="result"><div class="stat"><b>Monstro</b><span id="rMonster">—</span></div><div class="stat"><b>Set</b><span id="rSet">—</span></div><div class="stat"><b>Slots</b><span id="rSlots">0/6</span></div><div class="stat"><b>Estado</b><span id="rState">Não guardada</span></div></div></div></main><script>const params=new URLSearchParams(location.search),monsterInput=document.getElementById('monster'),monsterText=document.getElementById('monsterText'),monsterIcon=document.getElementById('monsterIcon'),catalogNote=document.getElementById('catalogNote');monsterInput.value=params.get('monster')||localStorage.getItem('yunarunes_monster')||'';const configs=[['1',['ATK']],['2',['SPD','ATK%','DEF%','HP%']],['3',['DEF']],['4',['CD%','CR%','ATK%','DEF%','HP%']],['5',['HP']],['6',['HP%','DEF%','ATK%','ACC%','RES%']]];let monsterDB=[];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function keyOf(m){return [m.name,m.element,m.stars].join('|').toLowerCase()}function addMonster(m){if(!m||!m.name)return;const item={name:String(m.name).trim(),element:String(m.element||'').trim(),family:String(m.family||'').trim(),stars:Number(m.stars)||'',image:m.image_url||m.image||'',role:m.role||m.monster_type||''};const k=keyOf(item);if(!monsterDB.some(x=>keyOf(x)===k))monsterDB.push(item)}function labelOf(m){return m.name+' — '+m.element+' ★'+m.stars}function findMonster(value){const v=String(value||'').trim().toLowerCase();let m=monsterDB.find(x=>labelOf(x).toLowerCase()===v);if(m)return m;m=monsterDB.find(x=>x.name.toLowerCase()===v);return m||monsterDB.find(x=>labelOf(x).toLowerCase().startsWith(v+' —'))}async function loadMonsters(){try{const r=await fetch('monsters.json',{cache:'no-store'});if(r.ok)(await r.json()).forEach(addMonster)}catch(e){}try{const r=await fetch('https://raw.githubusercontent.com/Selahtin86/summoners-war-db/75104b286b752cd05739dce1db50cd3a3829bdf5/data/monsters.csv',{cache:'no-store'});if(r.ok){const t=await r.text(),rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){f+='"';i++}else q=!q}else if(c===','&&!q){row.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(f);if(row.some(v=>v.trim()))rows.push(row);row=[];f=''}else f+=c}if(row.length){row.push(f);rows.push(row)}const h=rows.shift().map(x=>x.replace(/^\uFEFF/,'')),idx=Object.fromEntries(h.map((x,i)=>[x,i]));rows.forEach(r=>addMonster({name:r[idx.awakened_name],element:r[idx.element],family:r[idx.monster_family],stars:r[idx.star_grade],image_url:r[idx.image_url],monster_type:r[idx.monster_type]}))}}catch(e){}monsterDB.sort((a,b)=>a.name.localeCompare(b.name)||a.element.localeCompare(b.element)||a.stars-b.stars);document.getElementById('monsterList').innerHTML=monsterDB.map(m=>'<option value="'+esc(labelOf(m))+'">').join('');const elements=[...new Set(monsterDB.map(m=>m.element).filter(Boolean))],stars=[...new Set(monsterDB.map(m=>m.stars).filter(Boolean))].sort((a,b)=>a-b);catalogNote.textContent=monsterDB.length+' variantes carregadas • Elementos: '+elements.join(', ')+' • Estrelas: '+stars.join(', ');updateMonsterInfo()}function updateMonsterInfo(){const m=findMonster(monsterInput.value);monsterIcon.style.display='none';if(m){monsterText.innerHTML='<span class="monster-name">'+esc(m.name)+'</span><br><span class="element">'+esc(m.element)+'</span> • '+esc(m.family)+(m.role?' • '+esc(m.role):'')+(m.stars?' • <span class="stars">'+'★'.repeat(Math.min(Number(m.stars),6))+'</span>':'');if(m.image){monsterIcon.onload=()=>monsterIcon.style.display='block';monsterIcon.onerror=()=>monsterIcon.style.display='none';monsterIcon.src=m.image}}else monsterText.textContent=monsterInput.value?'Monstro não encontrado na base carregada.':monsterDB.length+' variantes carregadas'}function draw(){document.getElementById('slots').innerHTML=configs.map(([n,o])=>'<div class="slot"><h3>Slot '+n+'</h3><select id="slot'+n+'"><option value="">Escolher main stat</option>'+o.map(x=>'<option>'+x+'</option>').join('')+'</select><input id="sub'+n+'" placeholder="Substats (ex.: SPD, HP%)"><div id="rune'+n+'" class="rune-data"></div></div>').join('');configs.forEach(([n])=>{const d=JSON.parse(localStorage.getItem('yunarunes_slot_'+n)||'null');if(d){document.getElementById('slot'+n).value=d.main||'';document.getElementById('sub'+n).value=d.sub||''}});updateSummary()}function updateSummary(){let c=configs.filter(([n])=>document.getElementById('slot'+n)?.value).length;document.getElementById('rMonster').textContent=monsterInput.value||'—';document.getElementById('rSet').textContent=document.getElementById('set').value;document.getElementById('rSlots').textContent=c+'/6';updateMonsterInfo()}function saveBuild(){localStorage.setItem('yunarunes_monster',monsterInput.value);localStorage.setItem('yunarunes_set',document.getElementById('set').value);configs.forEach(([n])=>localStorage.setItem('yunarunes_slot_'+n,JSON.stringify({main:document.getElementById('slot'+n).value,sub:document.getElementById('sub'+n).value})));document.getElementById('rState').textContent='Guardada neste dispositivo';document.getElementById('msg').textContent='Build guardada automaticamente.';updateSummary()}function clearBuild(){configs.forEach(([n])=>localStorage.removeItem('yunarunes_slot_'+n));localStorage.removeItem('yunarunes-selected-build');monsterInput.value='';draw();document.getElementById('rState').textContent='Não guardada';document.getElementById('msg').textContent='Build limpa.'}function applyOptimized(){const raw=localStorage.getItem('yunarunes-selected-build');if(!raw)return;try{const build=JSON.parse(raw);build.forEach(r=>{const n=r.slot,s=document.getElementById('slot'+n),sub=document.getElementById('sub'+n),info=document.getElementById('rune'+n);if(s){s.value=r.main?.stat||'';sub.value=(r.substats||[]).map(x=>x.stat+' '+x.value).join(', ');info.textContent=r.id+' • '+r.set+' • '+r.main.stat+' '+r.main.value}});document.getElementById('optimized').style.display='block';document.getElementById('optimized').innerHTML='<b>✓ Build do Optimizer aplicada</b><br><span class="muted">As 6 runas encontradas foram colocadas nos slots. Podes alterar e guardar.</span>';localStorage.removeItem('yunarunes-selected-build');document.getElementById('rState').textContent='Optimizer aplicado'}catch(e){}}document.getElementById('set').value=localStorage.getItem('yunarunes_set')||'Violent';document.getElementById('set').addEventListener('change',updateSummary);monsterInput.addEventListener('input',updateSummary);draw();loadMonsters();if(params.get('optimized')==='1')setTimeout(applyOptimized,500)</script><script src="language.js"></script></body></html>
