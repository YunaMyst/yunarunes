<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Rune Builder</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#edf2f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{padding:18px 24px;background:#151b22;border-bottom:1px solid var(--b)}.logo{font-size:24px;font-weight:900;color:#fff;text-decoration:none}.logo span{color:var(--a)}.wrap{max-width:1050px;margin:auto;padding:25px 16px}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:20px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}select,input{background:#0d1217;color:white;border:1px solid var(--b);border-radius:5px;padding:11px;width:100%;margin-top:6px}.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.slot{background:var(--p2);border:1px solid #364452;padding:14px 7px;border-radius:6px}.slot h3{margin:0 0 8px}.slot select{font-size:12px}.btn{background:var(--a);border:0;border-radius:5px;padding:12px 18px;font-weight:800;margin-top:15px;cursor:pointer}.muted{color:var(--m)}.result{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#11171d;border:1px solid var(--b);border-radius:6px;padding:12px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:5px}@media(max-width:800px){.slots{grid-template-columns:repeat(3,1fr)}.result{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.slots,.result{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><div class="card"><h1>Rune Builder</h1><p class="muted">Cria e guarda uma build de runas para o teu monstro. Os slots 1, 3 e 5 têm main stats fixas; os slots 2, 4 e 6 permitem escolher entre várias opções. citeturn0search3</p><div class="grid"><label>Monstro<input id="monster" placeholder="Ex.: Lushen"></label><label>Set principal<select id="set"><option>Violent</option><option>Swift</option><option>Despair</option><option>Fatal</option><option>Rage</option><option>Will</option><option>Revenge</option><option>Shield</option><option>Focus</option><option>Energy</option><option>Guard</option><option>Nemesis</option></select></label></div></div><div class="card"><h2>Slots 1–6</h2><div class="slots" id="slots"></div><button class="btn" onclick="saveBuild()">Guardar build</button><button class="btn" onclick="clearBuild()">Limpar</button><p id="msg" class="muted"></p></div><div class="card"><h2>Resumo da build</h2><div class="result"><div class="stat"><b>Monstro</b><span id="rMonster">—</span></div><div class="stat"><b>Set</b><span id="rSet">—</span></div><div class="stat"><b>Slots escolhidos</b><span id="rSlots">0/6</span></div><div class="stat"><b>Estado</b><span id="rState">Não guardada</span></div></div></div></main><script>const params=new URLSearchParams(location.search);const monsterInput=document.getElementById('monster');monsterInput.value=params.get('monster')||localStorage.getItem('yunarunes_monster')||'';const configs=[['1',['ATK']],['2',['SPD','ATK%','DEF%','HP%']],['3',['DEF']],['4',['CD%','CR%','ATK%','DEF%','HP%']],['5',['HP']],['6',['HP%','DEF%','ATK%','ACC%','RES%']]];function draw(){document.getElementById('slots').innerHTML=configs.map(([n,opts])=>'<div class="slot"><h3>Slot '+n+'</h3><select id="slot'+n+'"><option value="">Escolher main stat</option>'+opts.map(x=>'<option>'+x+'</option>').join('')+'</select><input id="sub'+n+'" placeholder="Substats (ex.: SPD, HP%)"></div>').join('');configs.forEach(([n])=>{const d=JSON.parse(localStorage.getItem('yunarunes_slot_'+n)||'null');if(d){document.getElementById('slot'+n).value=d.main||'';document.getElementById('sub'+n).value=d.sub||''}});updateSummary()}function updateSummary(){let count=configs.filter(([n])=>document.getElementById('slot'+n)?.value).length;document.getElementById('rMonster').textContent=monsterInput.value||'—';document.getElementById('rSet').textContent=document.getElementById('set').value;document.getElementById('rSlots').textContent=count+'/6'}function saveBuild(){localStorage.setItem('yunarunes_monster',monsterInput.value);localStorage.setItem('yunarunes_set',document.getElementById('set').value);configs.forEach(([n])=>localStorage.setItem('yunarunes_slot_'+n,JSON.stringify({main:document.getElementById('slot'+n).value,sub:document.getElementById('sub'+n).value})));document.getElementById('rState').textContent='Guardada neste dispositivo';document.getElementById('msg').textContent='Build guardada automaticamente no teu dispositivo.';updateSummary()}function clearBuild(){configs.forEach(([n])=>localStorage.removeItem('yunarunes_slot_'+n));localStorage.removeItem('yunarunes_monster');localStorage.removeItem('yunarunes_set');monsterInput.value='';document.getElementById('set').value='Violent';draw();document.getElementById('rState').textContent='Não guardada';document.getElementById('msg').textContent='Build limpa.'}document.getElementById('set').value=localStorage.getItem('yunarunes_set')||'Violent';document.getElementById('set').addEventListener('change',updateSummary);monsterInput.addEventListener('input',updateSummary);draw();</script></body></html>
