<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Decks</title><link rel="stylesheet" href="advanced-tools.css"></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="tool-wrap"><section class="hero"><h1>🃏 Decks</h1><p class="muted">Guarda as tuas equipas por conteúdo, adiciona notas e exporta/importa os decks.</p></section><section class="card"><div class="toolbar"><label>Nome do deck<input id="name" placeholder="Ex.: Siege — Galleon/Lushen"></label><label>Conteúdo<select id="content"><option>Arena</option><option>Siege</option><option>WGB</option><option>PvE</option><option>RTA</option></select></label><label>Mobs<input id="mobs" placeholder="Galleon, Lushen, Megan"></label><label>Notas<input id="notes" placeholder="Speed tune, alvo, condição..."></label><button class="btn" id="save">Guardar deck</button></div><div class="toolbar" style="margin-top:10px"><button class="btn secondary" id="export">Exportar JSON</button><label>Importar decks JSON<input id="file" type="file" accept="application/json,.json"></label><button class="btn danger" id="clear">Apagar todos</button></div></section><section class="stat-grid" id="summary"></section><section class="card"><h2>Os meus decks</h2><div id="list" class="grid"></div></section></main><script>const EN=localStorage.getItem('yunarunes-language')==='en';const T=EN?{saved:'Deck saved.',deleted:'All decks deleted.',empty:'No decks saved yet.',mobs:'monsters',notes:'Notes',content:'Content',copy:'Copy'}:{saved:'Deck guardado.',deleted:'Todos os decks apagados.',empty:'Ainda não tens decks guardados.',mobs:'mobs',notes:'Notas',content:'Conteúdo',copy:'Copiar'};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let decks=JSON.parse(localStorage.getItem('yunarunes-decks')||'[]');function persist(){localStorage.setItem('yunarunes-decks',JSON.stringify(decks))}function render(){const counts={};decks.forEach(d=>counts[d.content]=(counts[d.content]||0)+1);$('summary').innerHTML=`<div class="stat"><b>Decks</b><strong>${decks.length}</strong></div><div class="stat"><b>Arena</b><strong>${counts.Arena||0}</strong></div><div class="stat"><b>Siege</b><strong>${counts.Siege||0}</strong></div><div class="stat"><b>WGB / PvE / RTA</b><strong>${(counts.WGB||0)+(counts.PvE||0)+(counts.RTA||0)}</strong></div>`;$('list').innerHTML=decks.length?decks.map((d,i)=>`<article class="card"><span class="badge">${esc(d.content)}</span><h3>${esc(d.name)}</h3><div class="chips">${d.mobs.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><p class="muted">${esc(d.notes||'')}</p><button class="btn secondary" onclick="copyDeck(${i})">${T.copy}</button> <button class="btn danger" onclick="removeDeck(${i})">${EN?'Delete':'Apagar'}</button></article>`).join(''):`<div class="empty">${T.empty}</div>`}function save(){const name=$('name').value.trim()||`Deck ${decks.length+1}`,mobs=$('mobs').value.split(',').map(x=>x.trim()).filter(Boolean);if(!mobs.length)return;$('save').disabled=true;decks.unshift({id:Date.now(),name,content:$('content').value,mobs,notes:$('notes').value.trim(),created:new Date().toISOString()});persist();render();$('name').value='';$('mobs').value='';$('notes').value='';$('save').disabled=false;alert(T.saved)}function removeDeck(i){decks.splice(i,1);persist();render()}async function copyDeck(i){try{await navigator.clipboard.writeText(JSON.stringify(decks[i],null,2))}catch(_){}}$('save').onclick=save;$('clear').onclick=()=>{if(confirm(EN?'Delete all decks?':'Apagar todos os decks?')){decks=[];persist();render();alert(T.deleted)}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(decks,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yunarunes-decks.json';a.click();URL.revokeObjectURL(a.href)};$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw Error();decks=d;persist();render()}catch(_){alert(EN?'Invalid JSON.':'JSON inválido.')}};render();</script><script src="language.js?v=20260925-lang-v14"></script><script src="advanced-tools-lang.js"></script><script src="language-dynamic.js?v=20260925-lang-v27"></script></body></html>
