</style></head><body><header class="top"><a class="logo yunarunes-home" href="index.html" aria-label="YunaRunes" style="display:inline-flex!important;align-items:center!important;flex:0 0 auto!important;width:max-content!important;max-width:100%!important;min-width:0!important;color:#fff!important;text-decoration:none!important;font-size:28px!important;font-weight:900!important;letter-spacing:-.7px!important;line-height:1.15!important;white-space:nowrap!important;background:transparent!important;border:0!important">YunaRunes</a><div class="yuna-controls" style="display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap"><a class="donate-link" href="https://www.paypal.com/myaccount/summary" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:7px 10px;border:1px solid #8c63c4;border-radius:8px;background:#6e45a6;color:#fff;text-decoration:none;font-weight:700;white-space:nowrap">💜 Donate</a><button type="button" data-lang="pt" aria-label="Português" style="min-height:36px;padding:7px 10px;border:1px solid #34475a;border-radius:8px;background:#111c27;color:#fff;cursor:pointer">🇧🇷 PT/BR</button><button type="button" data-lang="en" aria-label="English" style="min-height:36px;padding:7px 10px;border:1px solid #34475a;border-radius:8px;background:#111c27;color:#fff;cursor:pointer">🇬🇧 ENG</button></div></header><main class="tool-wrap"><section class="hero"><h1>🃏 Decks</h1><p class="muted">Save your teams by content, add notes, and export or import decks.</p></section><section class="card"><div class="toolbar"><label>Deck name<input id="name" placeholder="E.g. Siege — Galleon/Lushen"></label><label>Content<select id="content"><option>Arena</option><option>Siege</option><option>WGB</option><option>PvE</option><option>RTA</option></select></label><label>Monsters<input id="mobs" placeholder="Galleon, Lushen, Megan"></label><label>Notes<input id="notes" placeholder="Speed tuning, target, conditions..."></label><button class="btn" id="save">Save deck</button></div><div class="toolbar" style="margin-top:10px"><button class="btn secondary" id="export">Export JSON</button><label>Import JSON decks <span class="file-picker"><button class="btn secondary" type="button" id="choose-file">Choose file</button> <span id="file-name" aria-live="polite">No file selected</span><input id="file" type="file" accept="application/json,.json" hidden style="display:none!important"></span></label><button class="btn danger" id="clear">Delete all</button></div></section><section class="stat-grid" id="summary"></section><section class="card"><h2>My decks</h2><div id="list" class="grid"></div></section></main><script>const EN=localStorage.getItem('yunarunes-language')==='en';const T=EN?{saved:'Deck saved.',deleted:'All decks deleted.',empty:'No decks saved yet.',mobs:'monsters',notes:'Notes',content:'Content',copy:'Copy'}:{saved:'Deck guardado.',deleted:'Todos os decks apagados.',empty:'Ainda não tens decks guardados.',mobs:'monsters',notes:'Notes',content:'Content',copy:'Copy'};const $=id=>document.getElementById(id);if(!EN){document.querySelector('.hero .muted').textContent='Guarda as tuas equipas por conteúdo, adiciona notas e exporta/importa os decks.';document.querySelector('label[for="name"]');const labels=[...document.querySelectorAll('.toolbar label')];if(labels[0])labels[0].childNodes[0].textContent='Nome do deck';if(labels[1])labels[1].childNodes[0].textContent='Conteúdo';if(labels[2])labels[2].childNodes[0].textContent='Mobs';if(labels[3])labels[3].childNodes[0].textContent='Notas';if(labels[4])labels[4].childNodes[0].textContent='Importar decks JSON';$('choose-file').textContent='Escolher ficheiro';$('file-name').textContent='Nenhum ficheiro selecionado';$('name').placeholder='Ex.: Siege — Galleon/Lushen';$('notes').placeholder='Speed tune, alvo, condição...';$('save').textContent='Guardar deck';$('export').textContent='Exportar JSON';$('clear').textContent='Apagar todos';document.querySelector('main .card h2').textContent='Os meus decks';}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let decks=JSON.parse(localStorage.getItem('yunarunes-decks')||'[]');function persist(){localStorage.setItem('yunarunes-decks',JSON.stringify(decks))}function render(){const counts={};decks.forEach(d=>counts[d.content]=(counts[d.content]||0)+1);$('summary').innerHTML=`<div class="stat"><b>Decks</b><strong>${decks.length}</strong></div><div class="stat"><b>Arena</b><strong>${counts.Arena||0}</strong></div><div class="stat"><b>Siege</b><strong>${counts.Siege||0}</strong></div><div class="stat"><b>WGB / PvE / RTA</b><strong>${(counts.WGB||0)+(counts.PvE||0)+(counts.RTA||0)}</strong></div>`;$('list').innerHTML=decks.length?decks.map((d,i)=>`<article class="card"><span class="badge">${esc(d.content)}</span><h3>${esc(d.name)}</h3><div class="chips">${d.mobs.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><p class="muted">${esc(d.notes||'')}</p><button class="btn secondary" onclick="copyDeck(${i})">${T.copy}</button> <button class="btn danger" onclick="removeDeck(${i})">${EN?'Delete':'Apagar'}</button></article>`).join(''):`<div class="empty">${T.empty}</div>`}function save(){const name=$('name').value.trim()||`Deck ${decks.length+1}`,mobs=$('mobs').value.split(',').map(x=>x.trim()).filter(Boolean);if(!mobs.length)return;$('save').disabled=true;decks.unshift({id:Date.now(),name,content:$('content').value,mobs,notes:$('notes').value.trim(),created:new Date().toISOString()});persist();render();$('name').value='';$('mobs').value='';$('notes').value='';$('save').disabled=false;alert(T.saved)}function removeDeck(i){decks.splice(i,1);persist();render()}async function copyDeck(i){try{await navigator.clipboard.writeText(JSON.stringify(decks[i],null,2))}catch(_){}}$('save').onclick=save;$('clear').onclick=()=>{if(confirm(EN?'Delete all decks?':'Apagar todos os decks?')){decks=[];persist();render();alert(T.deleted)}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(decks,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yunarunes-decks.json';a.click();URL.revokeObjectURL(a.href)};$('choose-file').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];$('file-name').textContent=f?f.name:((localStorage.getItem('yunarunes-language')==='en'||document.documentElement.lang==='en')?'No file selected':'Nenhum ficheiro selecionado');if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw Error();decks=d;persist();render()}catch(_){alert(EN?'Invalid JSON.':'JSON inválido.')}};render();</script><script src="advanced-tools-lang.js?v=20261008-v5"></script><script src="yunarunes-upgrades.js?v=20261001-v2"></script><script>
/* Decks header: enforce exactly one Donate link and one button per language. */
(function(){
 function cleanDecksHeader(){
  const h=document.querySelector('header.top');if(!h)return;
  const donate=[...h.querySelectorAll('a.donate-link')];
  donate.slice(1).forEach(a=>a.remove());
  const langs=['pt','en'];
  langs.forEach(lang=>{
   const buttons=[...h.querySelectorAll('[data-lang="'+lang+'"]')];
   buttons.slice(1).forEach(b=>b.remove());
  });
 }
 cleanDecksHeader();
 const h=document.querySelector('header.top');
 if(h)new MutationObserver(cleanDecksHeader).observe(h,{childList:true,subtree:true});
})();
</script>
