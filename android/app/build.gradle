plugins { id 'com.android.application' }

android {
    namespace 'com.yunarunes.app'
    compileSdk 36

    defaultConfig {
        // Keep the original YunaRunes package so existing phone installs can
        // receive this release as an update, while the APK remains tablet-compatible.
        applicationId 'com.yunarunes.mobile.v3'
        minSdk 19
        targetSdk 35
        versionCode 19
        versionName '1.8.2'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('YUNARUNES_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('YUNARUNES_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('YUNARUNES_KEY_ALIAS')
            def keyPasswordValue = System.getenv('YUNARUNES_KEY_PASSWORD')

            if (keystorePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            def hasReleaseSigning = System.getenv('YUNARUNES_KEYSTORE_PATH') &&
                    System.getenv('YUNARUNES_KEYSTORE_PASSWORD') &&
                    System.getenv('YUNARUNES_KEY_ALIAS') &&
                    System.getenv('YUNARUNES_KEY_PASSWORD')
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }
}
