plugins { id 'com.android.application' }

import java.util.Base64

android {
    namespace 'com.yunarunes.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yunarunes.mobile'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.4.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('YUNARUNES_KEYSTORE_PATH')
            def storePasswordValue = System.getenv('YUNARUNES_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('YUNARUNES_KEY_ALIAS')
            def keyPasswordValue = System.getenv('YUNARUNES_KEY_PASSWORD')

            if (keystorePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }
}

tasks.register('prepareYunaRunesIcon') {
    inputs.file(rootProject.file('app-icon.webp.b64'))
    outputs.file(file('src/main/res/drawable-nodpi/yunarunes_icon_webp.webp'))
    doLast {
        def source = rootProject.file('app-icon.webp.b64')
        def target = file('src/main/res/drawable-nodpi/yunarunes_icon_webp.webp')
        target.parentFile.mkdirs()
        def encoded = source.getText('UTF-8').replaceAll(/\s+/, '')
        target.bytes = Base64.decoder.decode(encoded)
    }
}

tasks.named('preBuild').configure {
    dependsOn('prepareYunaRunesIcon')
}
