<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Calculadora de Runas</title><style>:root{--bg:#0b1015;--p:#141b23;--p2:#10171e;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742;--ok:#7ee787;--warn:#e6c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:24px 16px}.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{color:var(--m);font-size:13px}input,select{width:100%;margin-top:6px;background:#0c1218;color:#fff;border:1px solid var(--b);border-radius:7px;padding:11px}.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.slot{background:var(--p2);border:1px solid var(--b);border-radius:9px;padding:12px}.slot b{display:block;color:var(--a);margin-bottom:8px}.slot input{font-size:12px}.btn{display:inline-flex;border:0;border-radius:8px;padding:11px 15px;background:var(--a);color:#061018;font-weight:900;cursor:pointer;text-decoration:none;margin:12px 6px 0 0}.btn.alt{background:#202a34;color:#fff;border:1px solid var(--b)}.muted{color:var(--m)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--p2);border:1px solid var(--b);border-radius:9px;padding:13px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.good{color:var(--ok);font-weight:800}.warn{color:var(--warn);font-weight:800}.actions{display:flex;flex-wrap:wrap}.note{padding:12px;border:1px dashed var(--b);border-radius:8px;color:var(--m);font-size:12px;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.slots{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.slots,.stats{grid-template-columns:1fr}.wrap{padding:15px 10px}.card{padding:15px}}</style></head><body><header class="top"></header><main class="wrap"><section class="card"><h1>🧿 Calculadora de Runas</h1><p class="muted">Monta uma build manual, soma os substats e compara o resultado com metas gerais para a função do monstro.</p><div class="grid"><label>Monstro<input id="monster" list="names" placeholder="Pesquisar monstro..."><datalist id="names"></datalist></label><label>Modo<select id="mode"><option value="balanced">Normal</option><option value="speed">SPD</option><option value="damage">Dano</option><option value="tank">Sobrevivência</option></select></label><label>Set principal<select id="set"><option>Violent</option><option>Swift</option><option>Despair</option><option>Rage</option><option>Fatal</option><option>Will</option><option>Shield</option><option>Revenge</option><option>Nemesis</option><option>Other</option></select></label></div></section><section class="card"><h2>Slots 1–6</h2><div id="slots" class="slots"></div><div class="actions"><button class="btn" id="calc">Calcular</button><button class="btn alt" id="clear">Limpar</button><button class="btn alt" id="save">Salvar no dispositivo</button></div><div class="note">Coloca os valores dos substats exatamente como aparecem nas suas runas. A calculadora não inventa stats nem assume uma build oficial.</div></section><section class="card"><h2>📊 Resultado</h2><div id="result" class="stats"></div><p id="advice" class="muted"></p></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db=[];const $=id=>document.getElementById(id);const cfg=[['1','ATK'],['2','SPD / HP% / ATK% / DEF%'],['3','DEF'],['4','CR% / CD% / HP% / ATK% / DEF%'],['5','HP'],['6','HP% / ATK% / DEF% / ACC% / RES%']];const statNames=['SPD','HP%','DEF%','ATK%','CR%','CD%','ACC%','RES%'];function key(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'')}function find(v){const k=key(v);return db.find(m=>key(m.name)===k)||db.find(m=>key(m.name).includes(k))}function renderSlots(){ $('slots').innerHTML=cfg.map(([n,main])=>'<div class="slot"><b>Slot '+n+'</b><div class="muted" style="font-size:11px">Main: '+main+'</div>'+statNames.map(s=>'<label style="display:block;margin-top:6px">'+s+'<input type="number" min="0" step="1" data-stat="'+s+'" data-slot="'+n+'" value="0"></label>').join('')+'</div>').join('')}function calculate(){const s=Object.fromEntries(statNames.map(x=>[x,0]));document.querySelectorAll('[data-stat]').forEach(i=>s[i.dataset.stat]+=Number(i.value)||0);const mode=$('mode').value;const weights=mode==='speed'?{SPD:1.6,ACC:.2,HP:.05}:mode==='damage'?{ATK:1.15,CD:.75,CR:.9,SPD:.2}:mode==='tank'?{HP:1.1,DEF:1,RES:.2,SPD:.15}:{SPD:.65,HP:.55,DEF:.5,ATK:.5,CR:.45,CD:.35,ACC:.3,RES:.2};const score=Object.entries(weights).reduce((a,[k,w])=>a+s[k]*w,0);$('result').innerHTML=statNames.map(x=>'<div class="stat"><b>'+x+'</b><span>'+s[x]+'</span></div>').join('')+'<div class="stat"><b>Pontuação da build</b><span>'+score.toFixed(1)+'</span></div>';const m=find($('monster').value),role=String(m?.role||'').toLowerCase();let target={SPD:100,HP:80,DEF:40,ATK:40,CR:50,CD:100,ACC:0,RES:0};if(role.includes('attack'))target={...target,ATK:100,CR:70,CD:150};if(role.includes('support'))target={...target,SPD:120,HP:100,DEF:50};if(mode==='speed')target.SPD=150;if(mode==='damage'){target.ATK=120;target.CR=85;target.CD=170}const missing=Object.entries(target).filter(([k,v])=>s[k]<v).slice(0,4);$('advice').innerHTML=missing.length?'<span class="warn">Metas gerais ainda abaixo:</span> '+missing.map(([k,v])=>k+' '+s[k]+'/'+v).join(' · '):'<span class="good">✓ A build atingiu as metas gerais selecionadas.</span>'}function clearAll(){document.querySelectorAll('[data-stat]').forEach(i=>i.value=0);$('result').innerHTML='';$('advice').textContent=''}async function init(){renderSlots();try{const r=await fetch('monster-catalog.json?v=20260918',{cache:'no-store'});const d=await r.json();db=(Array.isArray(d)?d:d.monsters||[]).filter(m=>m&&m.name&&m.image);$('names').innerHTML=[...new Set(db.map(m=>m.name))].sort().map(n=>'<option value="'+esc(n)+'">').join('');const p=new URLSearchParams(location.search);if(p.get('name'))$('monster').value=p.get('name')}catch(e){}}$('calc').onclick=calculate;$('clear').onclick=clearAll;$('save').onclick=()=>{try{localStorage.setItem('yunarunes-rune-calculator',JSON.stringify({monster:$('monster').value,mode:$('mode').value,set:$('set').value}));$('advice').textContent='✓ Build guardada neste dispositivo.'}catch(e){}};init();</script><script src="language.js?v=20260925-lang-v14"></script><script src="language-dynamic.js?v=20260925-lang-v28"></script></body></html>
