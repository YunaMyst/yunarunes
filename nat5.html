<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YunaRunes — Nat 5</title>
<style>
:root{--bg:#0f141a;--panel:#171e26;--panel2:#202a34;--text:#eef3f7;--muted:#93a1ae;--accent:#35a9e1;--border:#2b3742;--gold:#e6c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:20;background:#151b22;border-bottom:1px solid var(--border);padding:14px 22px}.topline{max-width:1240px;margin:auto;display:flex;align-items:center;gap:24px}.logo{color:#fff;text-decoration:none;font-size:25px;font-weight:900}.logo span{color:var(--accent)}nav{display:flex;gap:18px;flex:1;justify-content:center}nav a{color:#cbd5dd;text-decoration:none;font-weight:700}nav a.active,nav a:hover{color:#5fc7f5}.langs{display:flex;gap:6px}.langs button{border:0;border-radius:7px;background:var(--panel2);color:#fff;padding:10px 11px;font-weight:900;cursor:pointer}.langs button.active{background:var(--accent);color:#061018}.wrap{max-width:1240px;margin:auto;padding:24px 16px}.hero{background:linear-gradient(135deg,#171e26,#11171d);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 7px}.hero p{color:var(--muted);margin:0}.search{width:100%;margin:14px 0;background:#0d1217;color:#fff;border:1px solid var(--accent);border-radius:9px;padding:14px;font-size:15px}.status{color:var(--muted);margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#131a21;border:1px solid var(--border);border-radius:10px;padding:11px;color:inherit}.card-main{display:block;color:inherit;text-decoration:none}.card:hover{border-color:var(--accent);transform:translateY(-1px)}.synergy-btn{display:flex;align-items:center;justify-content:center;margin-top:9px;min-height:38px;border:1px solid var(--accent);border-radius:8px;background:#172330;color:#fff;text-decoration:none;font-weight:900;font-size:13px;padding:7px 9px;box-sizing:border-box}.synergy-btn:hover{background:var(--accent);color:#061018}.portrait{height:175px;border-radius:8px;background:#0d1217;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px}.portrait img{max-width:100%;max-height:100%;object-fit:contain}.name{font-size:16px;font-weight:900}.meta{color:var(--muted);font-size:12px;margin-top:4px}.stars{color:var(--gold)}.section{margin-top:22px}.note{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.topline{display:block}.logo{display:block;padding-bottom:10px}.top nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;justify-content:initial}.top nav a{text-align:center;font-size:12px}.langs{position:absolute;right:10px;top:10px}.langs button{padding:8px;font-size:10px}.wrap{padding:15px 10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.portrait{height:165px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header class="top"></header>
<main class="wrap"><section class="hero"><h1>⭐ Nat 5</h1><p data-i18n="Nat5 intro">Encontra rapidamente os monstros Nat 5 e abre a ficha para ver builds, conteúdo e combinações.</p><input id="search" class="search" type="search" placeholder="Pesquisar Nat 5..." data-i18n-placeholder="Search Nat 5..."><div id="status" class="status">Carregando...</div></section><section><div id="grid" class="grid"></div></section><section class="section"><div class="note"><h2 data-i18n="Synergy title">🤝 Com que mobs usar?</h2><p data-i18n="Synergy text">Abre qualquer Nat 5 acima para veres na ficha do monstro quais os mobs recomendados para usar com ele, além de builds, conteúdo e informações do mob.</p></div></section></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let all=[];const tr={pt:{Home:'Início',Database:'Database','Team Builder':'Team Builder',Runes:'Runas','Nat5 intro':'Encontra rapidamente os monstros Nat 5 e abre a ficha para ver builds, conteúdo e combinações.','Search Nat 5...':'Pesquisar Nat 5...','Synergy title':'🤝 Com que mobs usar?','Synergy text':'Abre qualquer Nat 5 acima para veres na ficha do monstro quais os mobs recomendados para usar com ele, além de builds, conteúdo e informações do mob.'},en:{Home:'Home',Database:'Database','Team Builder':'Team Builder',Runes:'Runes','Nat5 intro':'Quickly find Nat 5 monsters and open their profile to see builds, content and team combinations.','Search Nat 5...':'Search Nat 5...','Synergy title':'🤝 What monsters should I use with it?','Synergy text':'Open any Nat 5 above to see its monster profile, recommended teammates, builds and content information.'}};function lang(){return localStorage.getItem('yunarunes-language')==='en'?'en':'pt'}function applyLang(){const l=lang();document.documentElement.lang=l==='en'?'en':'pt-BR';document.querySelectorAll('[data-i18n]').forEach(x=>{const k=x.dataset.i18n;x.textContent=tr[l][k]||x.textContent});document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x.dataset.lang===l));document.querySelector('#search').placeholder=tr[l]['Search Nat 5...']}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('yunarunes-language',b.dataset.lang);applyLang();render()});function clean(s){return String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim()}function isA2(m){return m?.isSecondAwakening===true||Number(m?.awakeningLevel)===2||/\|A2$/i.test(String(m?.detailsKey||''))}function playable(m){return m&&m.name&&m.image&&Number(m.stars)===5&&!isA2(m)&&!/(angelmon|devilmon|rainbowmon)/i.test(clean(m.name))}function unique(arr){const seen=new Set();return arr.filter(playable).filter(m=>{const k=[clean(m.name).toLowerCase(),m.element].join('|');if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>clean(a.name).localeCompare(clean(b.name),'pt-PT'))}function profile(m){return 'monster-view.html?name='+encodeURIComponent(clean(m.name))+'&element='+encodeURIComponent(m.element||'')+'&stars=5'}function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=all.filter(m=>!q||clean(m.name).toLowerCase().includes(q)||String(m.family||'').toLowerCase().includes(q));document.getElementById('status').textContent=list.length+' Nat 5';document.getElementById('grid').innerHTML=list.map(m=>`<div class="card"><a class="card-main" href="${profile(m)}"><div class="portrait"><img loading="lazy" src="${esc(m.image)}" alt="${esc(clean(m.name))}" onerror="this.style.display='none'"></div><div class="name">${esc(clean(m.name))}</div><div class="meta">${esc(m.element||'')} · <span class="stars">★★★★★</span></div></a><a class="synergy-btn" href="monster-view.html?name=${encodeURIComponent(clean(m.name))}#synergy">🤝 ${lang()==='en'?'View synergies':'Ver sinergias'}</a></div>`).join('')||'<div class="note">Nenhum Nat 5 encontrado.</div>'}async function init(){try{const r=await fetch('monster-catalog.json?v=20260916-4',{cache:'no-store'});const d=await r.json();all=unique(Array.isArray(d)?d:(d.monsters||d.data||[]));render();applyLang()}catch(e){document.getElementById('status').textContent='Erro ao carregar os monstros.'}}document.getElementById('search').addEventListener('input',render);init();
</script><script src="language.js?v=20260925-lang-v14"></script><script src="language-dynamic.js?v=20260925-lang-v30"></script></body></html>
