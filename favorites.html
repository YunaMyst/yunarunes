<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Meus Mobs</title><style>:root{--bg:#0b1015;--p:#141b23;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px 16px}.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.mob{background:#10171e;border:1px solid var(--b);border-radius:10px;padding:10px;color:#fff;text-decoration:none}.mob:hover{border-color:var(--a)}.mob img{width:100%;height:150px;object-fit:contain}.mob b{display:block;margin-top:6px}.remove{margin-top:7px;background:#202a34;color:#fff;border:1px solid var(--b);border-radius:6px;padding:7px;cursor:pointer;width:100%}.muted{color:var(--m)}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"></header><main class="wrap"><section class="card"><h1>❤️ Meus Mobs</h1><p class="muted">Guarda os teus monstros favoritos neste dispositivo para aceder rapidamente às fichas.</p></section><section id="grid" class="grid"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=s=>String(s||'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();const key=s=>clean(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');let db=[];const $=id=>document.getElementById(id);function favs(){try{return JSON.parse(localStorage.getItem('yunarunes-favorites')||'[]')}catch(e){return[]}}function save(a){try{localStorage.setItem('yunarunes-favorites',JSON.stringify(a))}catch(e){}}function render(){const f=favs();const list=f.map(k=>db.find(m=>key(m.name)===k)).filter(Boolean);$('grid').innerHTML=list.length?list.map(m=>'<article class="mob"><a href="monster-view.html?name='+encodeURIComponent(clean(m.name))+'" style="color:inherit;text-decoration:none"><img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'"><b>'+esc(clean(m.name))+'</b><span class="muted">'+esc(m.element||'')+' · '+esc(m.stars||'')+'★</span></a><button class="remove" data-remove="'+esc(key(m.name))+'">✕ Remover</button></article>').join(''):'<div class="card"><p class="muted">Ainda não tens mobs favoritos. Abre uma ficha e toca em ❤️ Guardar.</p></div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{save(favs().filter(x=>x!==b.dataset.remove));render()})}async function init(){try{const r=await fetch('monster-catalog.json?v=20260918',{cache:'no-store'});const d=await r.json();db=(Array.isArray(d)?d:d.monsters||[]).filter(m=>m&&m.name&&m.image);render()}catch(e){}}init();</script><script src="language.js"></script><script src="language-dynamic.js"></script></body></html>
