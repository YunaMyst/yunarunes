<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Comparar Mobs</title><style>:root{--bg:#0b1015;--p:#141b23;--p2:#10171e;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px 16px}.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:20px;margin-bottom:16px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.controls input{width:100%;background:#0c1218;color:#fff;border:1px solid var(--b);border-radius:7px;padding:12px}.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mob{background:var(--p2);border:1px solid var(--b);border-radius:10px;padding:15px}.mob img{width:130px;height:130px;object-fit:contain;display:block;margin:auto}.stat{display:flex;justify-content:space-between;border-top:1px solid var(--b);padding:9px 0;font-size:13px}.muted{color:var(--m)}.btn{background:var(--a);color:#061018;border:0;border-radius:8px;padding:11px 15px;font-weight:900;cursor:pointer;margin-top:12px}.badge{display:inline-block;padding:5px 8px;background:#202a34;border:1px solid var(--b);border-radius:6px;margin:3px;font-size:11px}@media(max-width:700px){.controls,.compare{grid-template-columns:1fr}.mob img{width:110px;height:110px}}</style></head><body><header class="top"></header><main class="wrap"><section class="card"><h1>⚖️ Comparar Mobs</h1><p class="muted">Compara dados da base lado a lado. O YunaRunes não transforma a comparação num ranking.</p><div class="controls"><input id="a" list="names" placeholder="Mob 1"><input id="b" list="names" placeholder="Mob 2"><input id="c" list="names" placeholder="Mob 3"><datalist id="names"></datalist></div><button class="btn" id="go">Comparar</button></section><section id="out" class="compare"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db=[];const $=id=>document.getElementById(id);const clean=s=>String(s||'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();const key=s=>clean(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');function find(v){const k=key(v);return db.find(m=>key(m.name)===k)||db.find(m=>key(m.name).includes(k))}function render(){const ms=['a','b','c'].map(id=>find($(id).value)).filter(Boolean);$('out').innerHTML=ms.length?ms.map(m=>'<article class="mob"><img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'"><h2>'+esc(clean(m.name))+'</h2><div><span class="badge">'+esc(m.element||'—')+'</span><span class="badge">'+esc(m.stars||'—')+'★</span><span class="badge">'+esc(m.role||'—')+'</span></div><div class="stat"><b>Família</b><span>'+esc(m.family||'—')+'</span></div><div class="stat"><b>Função</b><span>'+esc(m.role||'—')+'</span></div><div class="stat"><b>Despertar</b><span>'+esc(m.awakeningLevel||1)+'</span></div><div class="stat"><b>Conteúdo</b><span>Consultar ficha individual</span></div><a class="btn" href="monster-view.html?name='+encodeURIComponent(clean(m.name))+'">Abrir ficha</a></article>').join(''):'<div class="card"><p class="muted">Escolhe pelo menos dois monstros.</p></div>'}async function init(){try{const r=await fetch('monster-catalog.json?v=20260918',{cache:'no-store'});const d=await r.json();db=(Array.isArray(d)?d:d.monsters||[]).filter(m=>m&&m.name&&m.image&&Number(m.stars)>=2&&Number(m.stars)<=5);$('names').innerHTML=[...new Set(db.map(m=>m.name))].sort().map(n=>'<option value="'+esc(n)+'">').join('');const p=new URLSearchParams(location.search);['a','b','c'].forEach((id,i)=>{const v=p.get(id);if(v)$(id).value=v})}catch(e){} }$('go').onclick=render;init();</script><script src="language.js?v=20260925-lang-v14"></script><script src="language-dynamic.js?v=20260925-lang-v28"></script></body></html>
