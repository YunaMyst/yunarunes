<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="YunaRunes — perfil individual de monstro Summoners War."><title>Monster — YunaRunes</title><style>:root{--bg:#0b1015;--p:#141b22;--p2:#1c2630;--t:#eef3f7;--m:#91a0ad;--a:#35a9e1;--b:#2b3742;--gold:#e6c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#121820;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:22px;margin-top:16px}.hero{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}.portrait{width:220px;height:220px;background:#0d1217;border-radius:12px;display:grid;place-items:center;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:contain}.fallback{font-size:90px}.badge,.tag{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin:3px}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.stars{color:var(--gold);letter-spacing:2px;font-size:18px;margin:10px 0}.muted{color:var(--m);line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0e141a;border:1px solid var(--b);padding:14px;border-radius:7px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.btn{display:inline-block;background:var(--a);color:#061018;border-radius:6px;padding:11px 15px;text-decoration:none;font-weight:800;margin:8px 8px 0 0}.btn.alt{background:var(--p2);color:#fff;border:1px solid var(--b)}.section-title{margin:0 0 12px}.skill{background:#0e141a;border:1px solid var(--b);padding:15px;border-radius:7px;margin:10px 0}.skill h3{margin:0 0 7px}.note{padding:12px;background:#101820;border-left:3px solid var(--a);color:var(--m);margin-top:12px}.materials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.material{background:#0e141a;border:1px solid var(--b);border-radius:7px;padding:14px}.loading{color:var(--m)}@media(max-width:700px){.hero{grid-template-columns:1fr}.portrait{width:150px;height:150px}.grid{grid-template-columns:1fr 1fr}.materials{grid-template-columns:1fr}.wrap{padding:16px 10px}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="index.html#monsters">← Voltar à Monster Database</a><div id="app"><div class="card loading">A carregar perfil do monstro...</div></div></main><script>const params=new URLSearchParams(location.search),name=params.get('name'),wantedElement=params.get('element')||'',wantedStars=params.get('stars')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const CSV_URL='https://raw.githubusercontent.com/Selahtin86/summoners-war-db/75104b286b752cd05739dce1db50cd3a3829bdf5/data/monsters.csv';function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];if(c==='"'){if(q&&n==='"'){f+='"';i++}else q=!q}else if(c===','&&!q){row.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(f);if(row.some(v=>v.trim()))rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows}async function init(){const app=document.getElementById('app');if(!name){app.innerHTML='<div class="card"><h1>Monstro não especificado</h1><p class="muted">Escolhe um monstro na Monster Database.</p></div>';return}try{let m=null;try{const r=await fetch(CSV_URL,{cache:'no-store'});if(r.ok){const rows=parseCSV(await r.text()),h=rows.shift().map(x=>x.replace(/^\uFEFF/,'')),idx=Object.fromEntries(h.map((x,i)=>[x.trim(),i]));for(const r of rows){const n=r[idx.awakened_name];const e=r[idx.element];const s=Number(r[idx.star_grade])||0;if(n&&n.toLowerCase()===name.toLowerCase()&&s>=1&&s<=5&&(!wantedElement||e===wantedElement)&&(!wantedStars||String(s)===wantedStars)){m={name:n,element:e,role:r[idx.monster_type],stars:s,family:r[idx.monster_family],image:r[idx.image_url]||r[idx.base_image_url]||''};break}}}}catch(e){}if(!m){const r=await fetch('monsters.json',{cache:'no-store'}),arr=await r.json();m=arr.find(x=>x.name.toLowerCase()===name.toLowerCase()&&(!wantedElement||x.element===wantedElement)&&(!wantedStars||String(x.stars)===wantedStars))}if(!m){app.innerHTML='<div class="card"><h1>Monstro não encontrado</h1><p class="muted">Esta variante ainda não existe na base de dados.</p></div>';return}let d={};try{const dr=await fetch('monster-details.json',{cache:'no-store'});if(dr.ok){const all=await dr.json();d=all[m.name]||all[m.name+' '+m.element]||{}}}catch(e){}const stats=d.stats||{};const statKeys=['HP','ATK','DEF','SPD','CRI Rate','CRI Dmg','Resistance','Accuracy'];const statHtml=statKeys.map(k=>'<div class="stat"><b>'+esc(k)+'</b>'+(stats[k]!=null?esc(stats[k]):'<span class="muted">A verificar</span>')+'</div>').join('');const skills=Array.isArray(d.skills)?d.skills:[];const skillHtml=skills.length?skills.map((s,i)=>'<div class="skill"><h3>Skill '+(i+1)+': '+esc(s.name||'Skill')+'</h3><p class="muted">'+esc(s.description||'')+'</p>'+((s.effects||[]).map(e=>'<span class="tag">'+esc(e)+'</span>').join(''))+'</div>').join(''):'<div class="note">As skills detalhadas deste monstro ainda não estão na base verificada. Não vou inventar descrições.</div>';const sets=d.runes&&Array.isArray(d.runes.sets)?d.runes.sets:[];const runeHtml=sets.length?sets.map(x=>'<span class="tag">'+esc(x)+'</span>').join(''):'<span class="muted">Recomendações ainda não verificadas.</span>';const awaken=d.awakening||{};const mats=awaken.materials||{};const materialHtml=Object.keys(mats).length?Object.entries(mats).map(([k,v])=>'<div class="material"><b>'+esc(k)+'</b><div class="muted">'+esc(v)+'</div></div>').join(''):'<div class="note">Materiais específicos de despertar ainda não foram adicionados para este monstro.</div>';const leader=d.leaderSkill?'<div class="skill"><h3>Leader Skill</h3><p class="muted">'+esc(d.leaderSkill)+'</p></div>':'';const portrait=m.image?'<img src="'+esc(m.image)+'" alt="'+esc(m.name)+' '+esc(m.element)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">':'';app.innerHTML='<section class="card hero"><div class="portrait">'+portrait+'<span class="fallback" style="display:'+(m.image?'none':'block')+'">👾</span></div><div><h1>'+esc(m.name)+'</h1><span class="badge '+esc(m.element)+'">'+esc(m.element)+'</span><span class="muted">'+esc(m.family||'')+'</span><div class="stars">'+('★'.repeat(Math.max(0,Math.min(5,Number(m.stars)||0))))+'</div><p class="muted">Perfil individual YunaRunes — variante '+esc(m.element)+'.</p><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Montar Rune Build</a><a class="btn alt" href="optimizer.html?monster='+encodeURIComponent(m.name)+'">Abrir Optimizer</a></div></section><section class="card"><h2 class="section-title">Informações</h2><div class="grid"><div class="stat"><b>Função</b>'+esc(m.role||'A verificar')+'</div><div class="stat"><b>Elemento</b>'+esc(m.element)+'</div><div class="stat"><b>Estrelas naturais</b>'+esc(m.stars)+'★</div><div class="stat"><b>Família</b>'+esc(m.family||'A verificar')+'</div></div></section><section class="card"><h2 class="section-title">Stats base</h2><div class="grid">'+statHtml+'</div><div class="note">Os stats só são mostrados como valores quando existem dados na base YunaRunes. A evolução para 6★ é diferente da estrela natural do monstro.</div></section><section class="card"><h2 class="section-title">Skills</h2>'+skillHtml+leader+'</section><section class="card"><h2 class="section-title">Despertar</h2><p class="muted">'+esc(awaken.description||'O despertar pode alterar aparência, nome ou habilidades dependendo do monstro. Os detalhes específicos serão preenchidos apenas quando verificados.')+'</p><div class="materials">'+materialHtml+'</div></section><section class="card"><h2 class="section-title">Runas recomendadas</h2><div>'+runeHtml+'</div><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Abrir Rune Builder</a></section></section>'}catch(e){app.innerHTML='<div class="card"><h1>Erro ao carregar</h1><p class="muted">Não foi possível carregar os dados deste monstro.</p></div>'}}init();</script></body></html>
