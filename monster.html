<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="YunaRunes — perfil de monstro Summoners War."><title>Monster — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:24px;margin-top:18px}.hero{display:flex;gap:24px;align-items:center}.portrait{width:170px;height:170px;background:var(--p2);border-radius:10px;display:grid;place-items:center;font-size:80px;flex:none}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin-right:6px}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.stars{color:#e6c75b;letter-spacing:2px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:6px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.muted{color:var(--m);line-height:1.5}.btn{display:inline-block;background:var(--a);color:#061018;border-radius:5px;padding:11px 15px;text-decoration:none;font-weight:800;margin-top:15px}@media(max-width:650px){.hero{flex-direction:column;align-items:flex-start}.portrait{width:130px;height:130px;font-size:60px}.grid{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="index.html#monsters">← Voltar à Monster Database</a><div id="app"></div></main><script>let data=[];const name=new URLSearchParams(location.search).get('name');async function init(){const app=document.getElementById('app');if(!name){app.innerHTML='<div class="card"><h1>Monstro não especificado</h1><p class="muted">Escolhe um monstro na Monster Database.</p></div>';return}try{const r=await fetch('monsters.json',{cache:'no-store'});data=await r.json();const m=data.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!m){app.innerHTML='<div class="card"><h1>Monstro não encontrado</h1><p class="muted">Este monstro ainda não existe na base de dados.</p></div>';return}app.innerHTML='<section class="card hero"><div class="portrait">'+(m.emoji||'👾')+'</div><div><h1>'+m.name+'</h1><span class="badge '+m.element+'">'+m.element+'</span><span class="muted">'+m.family+'</span><div class="stars">'+('★'.repeat(m.stars))+'</div><p class="muted">Perfil YunaRunes baseado nos dados atualmente disponíveis na base de monstros.</p><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Montar Rune Build</a></div></section><section class="card"><h2>Informações</h2><div class="grid"><div class="stat"><b>Função</b>'+m.role+'</div><div class="stat"><b>Elemento</b>'+m.element+'</div><div class="stat"><b>Estrelas</b>'+m.stars+'★</div><div class="stat"><b>Família</b>'+m.family+'</div></div></section><section class="card"><h2>Skills & Stats</h2><p class="muted">As skills detalhadas e os stats base serão adicionados à ficha deste monstro numa próxima atualização da base de dados.</p></section><section class="card"><h2>Runas recomendadas</h2><p class="muted">A recomendação específica de runas será ligada aos dados de build do YunaRunes. Por agora, podes abrir o Rune Builder para criar a tua própria build.</p><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Abrir Rune Builder</a></section>'}catch(e){app.innerHTML='<div class="card"><h1>Erro</h1><p class="muted">Não foi possível carregar monsters.json.</p></div>'}}init();</script></body></html>
