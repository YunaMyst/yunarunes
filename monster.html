<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="YunaRunes — perfil de monstro Summoners War."><title>Monster — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px}.logo{font-size:24px;font-weight:900;text-decoration:none;color:#fff}.logo span{color:var(--a)}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.back{color:var(--a);text-decoration:none}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:24px;margin-top:18px}.hero{display:flex;gap:24px;align-items:center}.portrait{width:170px;height:170px;background:var(--p2);border-radius:10px;display:grid;place-items:center;font-size:80px;flex:none}.badge{display:inline-block;padding:5px 9px;border-radius:5px;font-size:12px;font-weight:800;margin-right:6px}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.stars{color:#e6c75b;letter-spacing:2px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:6px}.stat b{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.muted{color:var(--m);line-height:1.5}.btn{display:inline-block;background:var(--a);color:#061018;border-radius:5px;padding:11px 15px;text-decoration:none;font-weight:800;margin-top:15px}.skill{background:#11171d;border:1px solid var(--b);padding:14px;border-radius:6px;margin:10px 0}.skill h3{margin:0 0 6px}.tag{display:inline-block;padding:4px 8px;background:var(--p2);border-radius:4px;color:var(--m);font-size:12px;margin:3px}@media(max-width:650px){.hero{flex-direction:column;align-items:flex-start}.portrait{width:130px;height:130px;font-size:60px}.grid{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><a class="back" href="index.html#monsters">← Voltar à Monster Database</a><div id="app"></div></main><script>const name=new URLSearchParams(location.search).get('name');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const app=document.getElementById('app');if(!name){app.innerHTML='<div class="card"><h1>Monstro não especificado</h1><p class="muted">Escolhe um monstro na Monster Database.</p></div>';return}try{const [mr,dr]=await Promise.all([fetch('monsters.json',{cache:'no-store'}),fetch('monster-details.json',{cache:'no-store'})]);const monsters=await mr.json();const details=await dr.json();const m=monsters.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!m){app.innerHTML='<div class="card"><h1>Monstro não encontrado</h1><p class="muted">Este monstro ainda não existe na base de dados.</p></div>';return}const d=details[m.name]||{};const stats=d.stats||{};const skills=Array.isArray(d.skills)?d.skills:[];const statKeys=['HP','ATK','DEF','SPD','CRI Rate','CRI Dmg','Resistance','Accuracy'];const statHtml=statKeys.map(k=>'<div class="stat"><b>'+esc(k)+'</b>'+(stats[k]!=null?esc(stats[k]):'<span class="muted">A verificar</span>')+'</div>').join('');const skillHtml=skills.length?skills.map(s=>'<div class="skill"><h3>'+esc(s.name||'Skill')+'</h3><p class="muted">'+esc(s.description||'')+'</p>'+(s.effects||[]).map(e=>'<span class="tag">'+esc(e)+'</span>').join('')+'</div>').join(''):'<p class="muted">As skills detalhadas ainda não foram adicionadas. O YunaRunes só vai publicar valores depois de serem verificados.</p>';const sets=d.runes&&Array.isArray(d.runes.sets)?d.runes.sets:[];const runeHtml=sets.length?sets.map(x=>'<span class="tag">'+esc(x)+'</span>').join(''):'<span class="muted">Recomendações ainda não disponíveis.</span>';app.innerHTML='<section class="card hero"><div class="portrait">'+(m.emoji||'👾')+'</div><div><h1>'+esc(m.name)+'</h1><span class="badge '+esc(m.element)+'">'+esc(m.element)+'</span><span class="muted">'+esc(m.family)+'</span><div class="stars">'+('★'.repeat(Number(m.stars)||0))+'</div><p class="muted">Perfil YunaRunes com dados separados entre informação básica e detalhes verificados.</p><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Montar Rune Build</a></div></section><section class="card"><h2>Informações</h2><div class="grid"><div class="stat"><b>Função</b>'+esc(m.role)+'</div><div class="stat"><b>Elemento</b>'+esc(m.element)+'</div><div class="stat"><b>Estrelas</b>'+esc(m.stars)+'★</div><div class="stat"><b>Família</b>'+esc(m.family)+'</div></div></section><section class="card"><h2>Stats base</h2><div class="grid">'+statHtml+'</div></section><section class="card"><h2>Skills</h2>'+skillHtml+(d.leaderSkill?'<div class="skill"><h3>Leader Skill</h3><p class="muted">'+esc(d.leaderSkill)+'</p></div>':'')+'</section><section class="card"><h2>Runas recomendadas</h2><div>'+runeHtml+'</div><a class="btn" href="runes.html?monster='+encodeURIComponent(m.name)+'">Abrir Rune Builder</a></section>'}catch(e){app.innerHTML='<div class="card"><h1>Erro ao carregar</h1><p class="muted">Confirma se monsters.json e monster-details.json estão publicados no mesmo repositório.</p></div>'}}init();</script></body></html>
