<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Visualizador</title>
<style>
body{margin:0;background:#080d12;color:#eef3f7;font-family:Arial,sans-serif}.top{background:#151b22;border-bottom:1px solid #2b3742;padding:12px 18px;position:sticky;top:0;z-index:5}.topline{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:18px}.viewer{min-height:calc(100vh - 90px);display:flex;flex-direction:column;align-items:center}.title{text-align:center}.title h1{margin:8px 0 4px;font-size:28px}.muted{color:#8e9aa6}.stage{width:min(850px,96vw);height:min(76vh,760px);margin-top:12px;position:relative;overflow:hidden;border:1px solid #2e3b47;border-radius:18px;background:radial-gradient(circle at 50% 35%,#293944 0,#111920 48%,#070b10 100%);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none}.stage:active{cursor:grabbing}.stage:after{content:'';position:absolute;bottom:7%;width:45%;height:5%;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(16px)}#mob{max-width:88%;max-height:91%;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 25px 25px rgba(0,0,0,.6));pointer-events:none}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px}.controls button{background:#202a34;color:#fff;border:1px solid #3a4a58;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.hint{text-align:center;font-size:12px;color:#778692;margin-bottom:18px}.dots{display:flex;gap:7px;justify-content:center}.dot{width:8px;height:8px;border-radius:50%;background:#46535e}.dot.active{background:#45b9ee}
</style></head><body><header class="top"><div class="topline"><a href="javascript:history.back()">← Voltar</a><a href="index.html">YunaRunes</a></div></header>
<main class="wrap"><section class="viewer"><div class="title"><h1 id="name">A carregar...</h1><div class="muted">Visualização em corpo inteiro</div></div><div class="stage" id="stage"><img id="mob" alt=""></div><div class="controls"><button id="prev">← Esquerda</button><button id="next">Direita →</button><button id="auto">▶ Girar automaticamente</button><button id="reset">↺ Reiniciar</button></div><div class="dots" id="dots"></div><div class="hint">Arrasta o mob para a esquerda/direita ou usa os botões. No telemóvel, desliza para mudar de ângulo.</div></section></main>
<script>
const params=new URLSearchParams(location.search),wanted=params.get('name')||'';let views=[],idx=0,drag=false,lastX=0,timer=null;
const clean=s=>String(s||'').replace(/\s*(2ª\s*modifica(?:ção|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();
async function findWikiImages(name){
 const q=encodeURIComponent(name+' (front) OR '+name+' (back) OR '+name+' (left) OR '+name+' (right)');
 const url='https://summonerswar.fandom.com/api.php?action=query&generator=search&gsrsearch='+q+'&gsrnamespace=6&gsrlimit=20&prop=imageinfo&iiprop=url&iiurlwidth=900&format=json&origin=*';
 try{const r=await fetch(url);const j=await r.json();const pages=Object.values(j.query?.pages||{});const found={};
 pages.forEach(p=>{const title=(p.title||'').replace(/^File:/,'').replace(/\.png$|\.jpg$|\.jpeg$/i,'').toLowerCase();const ii=p.imageinfo?.[0];if(!ii?.url)return;for(const side of ['front','back','left','right'])if(title.includes(side)&&title.includes(name.toLowerCase()))found[side]=ii.thumburl||ii.url});
 return [found.front,found.right,found.back,found.left].filter(Boolean);
 }catch(e){return[]}
}
function render(){const im=document.getElementById('mob');if(!views[idx])return;im.src=views[idx];document.getElementById('dots').innerHTML=views.map((_,i)=>'<span class="dot '+(i===idx?'active':'')+'"></span>').join('');}
function step(n){if(!views.length)return;idx=(idx+n+views.length)%views.length;render()}
function toggleAuto(){if(timer){clearInterval(timer);timer=null;document.getElementById('auto').textContent='▶ Girar automaticamente'}else{timer=setInterval(()=>step(1),900);document.getElementById('auto').textContent='⏸ Parar rotação'}}
async function load(){document.getElementById('name').textContent=clean(wanted)||'Monstro';const r=await fetch('./monster-catalog.json?v=20260922',{cache:'no-store'}),d=await r.json();const arr=Array.isArray(d)?d:(d.monsters||d.data||[]);const m=arr.find(x=>clean(x.name).toLowerCase()===clean(wanted).toLowerCase())||arr.find(x=>clean(x.name).toLowerCase().includes(clean(wanted).toLowerCase()));if(!m)return;const wiki=await findWikiImages(clean(m.name));views=wiki.length?wiki:[m.image];render()}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('auto').onclick=toggleAuto;document.getElementById('reset').onclick=()=>{idx=0;render()};
const s=document.getElementById('stage');s.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;s.setPointerCapture(e.pointerId)});s.addEventListener('pointermove',e=>{if(!drag)return;const d=e.clientX-lastX;if(Math.abs(d)>25){step(d<0?1:-1);lastX=e.clientX}});s.addEventListener('pointerup',()=>drag=false);s.addEventListener('pointercancel',()=>drag=false);
load();
</script><script src="language.js"></script><script src="language-dynamic.js"></script></body></html>
