<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suporte privado | YunaRunes</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080d15;color:#edf5fc;font:14px Arial,sans-serif}main{width:min(1100px,calc(100% - 28px));margin:34px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{color:#8bdcff;font-size:24px;margin:0 0 8px}.muted{color:#9eafbf}.notice{padding:14px;border:1px solid #35516a;border-radius:12px;margin:18px 0;background:#101d2a}button,select{padding:9px 12px;border:1px solid #367ca3;border-radius:8px;background:#14283a;color:#eaf7ff;cursor:pointer}#requests{display:grid;gap:12px}.request{padding:16px;border:1px solid #2c465b;border-radius:12px;background:#101a26}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.head strong{color:#8bdcff}.meta{color:#9eb0c1;font-size:12px;margin:8px 0}.message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;margin:12px 0}.attachment{max-width:100%;max-height:360px;border-radius:8px;border:1px solid #344b60;margin-top:10px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.empty{text-align:center;padding:30px;color:#9eb0c1}</style></head><body><main><div class="top"><div><h1>🛟 Suporte YunaRunes</h1><div class="muted">Painel privado de pedidos recebidos</div></div><div class="actions"><button id="refresh">Atualizar</button><a href="index.html" style="color:#8bdcff">Voltar ao site</a></div></div><div id="notice" class="notice">A verificar a tua sessão…</div><div id="requests"></div></main>
<script type="module" src="yunarunes-cloud.js?v=20261101-player-cloud-v1"></script><script>
(()=>{'use strict';const API='https://uxwbbaeupemihonwyszu.supabase.co/functions/v1/support-admin',KEY='sb_publishable_6A3yVOK07l0h6bmdjZ0U3A_CjzobvMX',notice=document.getElementById('notice'),list=document.getElementById('requests');let token='';const labels={new:'Novo',in_progress:'Em atendimento',resolved:'Resolvido'};function el(t,c,v){const x=document.createElement(t);if(c)x.className=c;if(v!==undefined)x.textContent=v;return x}
async function call(method='GET',body){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Não foi possível carregar os pedidos.');return d}
function render(rows){list.innerHTML='';if(!rows.length){list.append(el('div','empty','Ainda não há pedidos de suporte.'));return}for(const row of rows){const card=el('article','request'),head=el('div','head'),title=el('strong','',row.name||'Jogador'),date=el('span','muted',new Date(row.created_at).toLocaleString()),meta=el('div','meta',(row.email||'Sem email')+' · '+({problem:'Problema',usage:'Ajuda de utilização',idea:'Sugestão',other:'Outro'}[row.category]||row.category)),msg=el('div','message',row.message),actions=el('div','actions'),select=el('select');head.append(title,date);for(const v of ['new','in_progress','resolved']){const o=el('option','',labels[v]);o.value=v;if(row.status===v)o.selected=true;select.append(o)}const save=el('button','','Guardar estado');save.addEventListener('click',async()=>{save.disabled=true;try{await call('PATCH',{id:row.id,status:select.value});notice.textContent='Estado atualizado.'}catch(e){notice.textContent=e.message}finally{save.disabled=false}});actions.append(select,save);card.append(head,meta,msg);if(row.attachment_base64){const img=el('img','attachment');img.src=row.attachment_base64;img.alt='Imagem enviada pelo jogador';card.append(img)}card.append(actions);list.append(card)}}
async function load(){notice.textContent='A carregar pedidos privados…';try{const d=await call();render(d.requests||[]);notice.textContent='Acesso autorizado. '+(d.requests||[]).length+' pedido(s).'}catch(e){notice.textContent=e.message;list.innerHTML=''}}
async function init(){for(let i=0;i<50&&!window.YunaRunesCloud;i++)await new Promise(r=>setTimeout(r,100));const c=window.YunaRunesCloud;if(!c){notice.textContent='Não foi possível iniciar a sessão YunaRunes.';return}try{const {data,error}=await c.client.auth.getSession();if(error)throw error;if(!data.session){notice.textContent='Inicia sessão na tua conta YunaRunes e depois abre novamente este painel.';return}token=data.session.access_token;await load()}catch(e){notice.textContent=e.message||'Falha de autenticação.'}}
document.getElementById('refresh').addEventListener('click',load);init()})();
</script><script src="support.js?v=20261102-support-v1"></script>
