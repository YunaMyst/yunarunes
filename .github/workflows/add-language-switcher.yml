name: Add language switcher
on:
  push:
    paths:
      - '.github/workflows/add-language-switcher.yml'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'language-switcher-fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add language script to all HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              tag='<script src="language.js"></script>'
              if tag not in s:
                  s=s.replace('</body>', tag+'</body>')
              s=s.replace('<html lang="pt-PT">','<html lang="pt-PT">',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' language.js
          git diff --cached --quiet || git commit -m 'language-switcher-fix: add PT and EN selector to all pages'
          git push
