name: Add language switcher
on:
  push:
    paths:
      - '.github/workflows/add-language-switcher.yml'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'skip-header-patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one header translator and add dynamic translator
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('<script src="header-fix.js"></script>','')
              s=s.replace('<script src="language-dynamic.js"></script>','')
              tag='<script src="language.js"></script>'
              if tag not in s:
                  s=s.replace('</body>', tag+'</body>')
              s=s.replace('</body>','<script src="language-dynamic.js"></script></body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git diff --cached --quiet || git commit -m 'enable complete PT BR and ENG translation'
          git push
