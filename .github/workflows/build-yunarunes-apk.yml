name: Build YunaRunes APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-yunarunes-apk.yml'

permissions:
  contents: write

concurrency:
  group: yunarunes-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.YUNARUNES_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YUNARUNES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YUNARUNES_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YUNARUNES_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing YUNARUNES_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing YUNARUNES_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing YUNARUNES_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing YUNARUNES_KEY_PASSWORD secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/yunarunes-release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          YUNARUNES_KEYSTORE_PASSWORD: ${{ secrets.YUNARUNES_KEYSTORE_PASSWORD }}
          YUNARUNES_KEY_ALIAS: ${{ secrets.YUNARUNES_KEY_ALIAS }}
          YUNARUNES_KEY_PASSWORD: ${{ secrets.YUNARUNES_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YunaRunes-Android-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to website
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/release/app-release.apk downloads/yunarunes.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add downloads/yunarunes.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish signed YunaRunes release APK"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to publish APK after 3 attempts"
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi
