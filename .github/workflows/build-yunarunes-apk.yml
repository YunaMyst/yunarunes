name: Build YunaRunes APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-yunarunes-apk.yml'

permissions:
  contents: write

concurrency:
  group: yunarunes-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.YUNARUNES_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YUNARUNES_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YUNARUNES_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YUNARUNES_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing YUNARUNES_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing YUNARUNES_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing YUNARUNES_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing YUNARUNES_KEY_PASSWORD secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/yunarunes-release.jks

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          YUNARUNES_KEYSTORE_PATH: ${{ github.workspace }}/android/yunarunes-release.jks
          YUNARUNES_KEYSTORE_PASSWORD: ${{ secrets.YUNARUNES_KEYSTORE_PASSWORD }}
          YUNARUNES_KEY_ALIAS: ${{ secrets.YUNARUNES_KEY_ALIAS }}
          YUNARUNES_KEY_PASSWORD: ${{ secrets.YUNARUNES_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Validate APK package and alignment
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "package: name='com.yunarunes.mobile' versionCode='6' versionName='1.3.0'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"

      - name: Verify APK signature schemes
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -F "Verified using v1 scheme (JAR signing): true" /tmp/apksigner.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/apksigner.txt

      - name: Test APK installation on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 5
        timeout-minutes: 8
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e
            adb uninstall com.yunarunes.mobile || true
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell pm path com.yunarunes.mobile
            adb shell monkey -p com.yunarunes.mobile 1

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YunaRunes-Android-Release-1.3.0
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish APK to website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          mkdir -p downloads
          cp android/app/build/outputs/apk/release/app-release.apk downloads/yunarunes.apk
          git add downloads/yunarunes.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish signed YunaRunes release APK 1.3.0"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to publish APK after 3 attempts"
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi
