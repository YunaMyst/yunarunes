name: Deploy private YunaRunes support backend
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/support-requests/**'
      - 'supabase/functions/support-admin/**'
      - '.github/workflows/deploy-supabase-support.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: uxwbbaeupemihonwyszu
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: sb_publishable_6A3yVOK07l0h6bmdjZ0U3A_CjzobvMX
      SUPPORT_ADMIN_EMAILS: ${{ secrets.SUPPORT_ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          missing=()
          for key in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY SUPPORT_ADMIN_EMAILS; do
            if [ -z "${!key}" ]; then missing+=("$key"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment not run. Missing GitHub Actions secrets: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.ready == 'true'
        with:
          version: latest
      - name: Link project and apply private support database
        if: steps.credentials.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes
      - name: Deploy protected support functions
        if: steps.credentials.outputs.ready == 'true'
        run: |
          supabase functions deploy support-requests --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy support-admin --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" SUPPORT_ADMIN_EMAILS="$SUPPORT_ADMIN_EMAILS"
