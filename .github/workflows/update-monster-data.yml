name: Update monster data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  update-monsters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch SWARFARM Bestiary data
        run: python scripts/update_monster_data.py

      - name: Commit updated data
        run: |
          git config user.name 'YunaRunes Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monster-details.json
          if git diff --cached --quiet; then
            echo 'No monster data changes.'
          else
            git commit -m 'Auto-update monster data'
            git push
          fi
