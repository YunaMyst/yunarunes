name: Update monster data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_monster_data.py'
      - '.github/workflows/update-monster-data.yml'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

concurrency:
  group: monster-data-update-pt
  cancel-in-progress: true

jobs:
  update-monsters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch SWARFARM Bestiary data
        run: python scripts/update_monster_data.py

      - name: Commit updated data
        run: |
          git config user.name 'YunaRunes Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monster-details.json monster-catalog.json .translation-cache-pt.json
          if git diff --cached --quiet; then
            echo 'No monster data changes.'
            exit 0
          fi
          git commit -m 'Auto-update Portuguese monster database'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
