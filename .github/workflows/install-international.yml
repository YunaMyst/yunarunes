name: Install YunaRunes international selector
on:
  push:
    branches: [main]
    paths:
      - 'international.js'
      - '.github/workflows/install-international.yml'
permissions:
  contents: write
concurrency:
  group: yunarunes-international-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add the international selector to every site page
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = '<script src="international.js?v=20261109"></script>'
          changed = []
          for path in Path('.').glob('*.html'):
              source = path.read_text(encoding='utf-8')
              import re
              # Remove old/duplicate tags, then add exactly one current script reference.
              updated = re.sub(r'\s*<script src="international\.js[^"]*"></script>\s*', '\n', source)
              if '</body>' in updated.lower():
                  pos = updated.lower().rfind('</body>')
                  updated = updated[:pos] + marker + '\n' + updated[pos:]
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)
          print('International selector installed in:', ', '.join(changed))
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git diff --cached --quiet || git commit -m 'install international language selector across site'
          git push origin HEAD:main
