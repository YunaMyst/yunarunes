<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes - Guild Tools</title><link rel="stylesheet" href="advanced-tools.css"></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="tool-wrap"><section class="hero"><h1>Guild / Siege Tools</h1><p class="muted">Planeia defesas e matchups de Siege e WGB.</p></section><section class="card"><div class="toolbar"><label>Modo<select id="mode"><option value="siege">Siege</option><option value="wgb">WGB</option></select></label><label>Pesquisar<input id="search" placeholder="Ex.: Skogul"></label><button class="btn" id="refresh">Atualizar</button></div></section><section class="two"><section class="card"><h2>Builds públicas</h2><div id="builds" class="list"></div></section><section class="card"><h2>Matchup Planner</h2><label class="muted">Defesa adversária<input id="enemy" placeholder="Mob A, Mob B, Mob C"></label><label class="muted">Meu ataque<input id="attack" placeholder="Mob A, Mob B, Mob C"></label><button class="btn" id="save">Guardar</button><div id="saved" class="list"></div></section></section><section class="card"><h2>Defesas rápidas</h2><div id="defs" class="team"></div></section></main><script>const EN=localStorage.getItem('yunarunes-language')==='en';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={},saved=JSON.parse(localStorage.getItem('yunarunes-guild-matchups')||'[]');const copy=EN?{none:'No public build found.',empty:'No saved matchups.',ok:'Matchup saved.',remove:'Remove'}:{none:'Nenhuma build pública encontrada.',empty:'Nenhum matchup guardado.',ok:'Matchup guardado.',remove:'Apagar'};async function load(){try{const r=await fetch('guild-builds.json',{cache:'no-store'});if(r.ok)data=await r.json()}catch(_){}render()}function render(){const mode=$('mode').value,q=$('search').value.toLowerCase().trim(),arr=Object.values(data).filter(x=>x&&x.name&&x.name!=='_meta'&&x.modes&&x.modes[mode]&&(!q||x.name.toLowerCase().includes(q)));$('builds').innerHTML=arr.length?arr.map(x=>{const r=x.runes&&x.runes[mode],t=x.teams&&x.teams[mode]||[];return '<div class="row"><strong>'+esc(x.name)+'</strong><div class="muted">'+esc(x.role||'')+' · '+esc(r&&r.sets?r.sets.join(' / '):'')+' · '+esc(r&&r.slots||'')+'</div><div class="chips">'+((r&&r.subs)||[]).map(s=>'<span class="badge">'+esc(s)+'</span>').join('')+'</div>'+t.slice(0,2).map(z=>'<div class="muted">'+esc(z.join(' / '))+'</div>').join('')+'</div>'}).join(''):'<div class="empty">'+copy.none+'</div>';$('saved').innerHTML=saved.length?saved.map((x,i)=>'<div class="row"><strong>'+esc(x.enemy)+'</strong><div class="muted">→ '+esc(x.attack)+' · '+esc(x.mode)+'</div><button class="btn danger" data-i="'+i+'">'+copy.remove+'</button></div>').join(''):'<div class="empty">'+copy.empty+'</div>';$('saved').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{saved.splice(Number(b.dataset.i),1);localStorage.setItem('yunarunes-guild-matchups',JSON.stringify(saved));render()});$('defs').innerHTML=arr.slice(0,9).map(x=>{const t=x.teams&&x.teams.siege&&x.teams.siege[0]||[];return '<div class="slot"><strong>'+esc(x.name)+'</strong><div class="muted">'+(t.length?t.map(esc).join('<br>'):'—')+'</div></div>'}).join('')||'<div class="empty">'+copy.none+'</div>'}$('refresh').onclick=render;$('mode').onchange=render;$('search').oninput=render;$('save').onclick=()=>{const enemy=$('enemy').value.trim(),attack=$('attack').value.trim();if(!enemy||!attack)return;saved.unshift({enemy,attack,mode:$('mode').value,date:Date.now()});localStorage.setItem('yunarunes-guild-matchups',JSON.stringify(saved));render();alert(copy.ok)};load();</script><script src="language.js?v=20260925-lang-v14"></script><script src="language-dynamic.js?v=20260925-lang-v24"></script></body></html>
