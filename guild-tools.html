<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes - Guild Tools</title><link rel="stylesheet" href="advanced-tools.css"><style id="guild-language-controls-fix">html body header.top{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important;flex-wrap:wrap!important;position:relative!important;z-index:2147483000!important;overflow:visible!important;pointer-events:auto!important}header.top .yuna-language-controls{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:7px!important;margin-left:auto!important;position:relative!important;z-index:2147483001!important;pointer-events:auto!important}header.top .yuna-language-controls [data-lang]{display:inline-flex!important;align-items:center!important;justify-content:center!important;position:relative!important;z-index:2147483002!important;pointer-events:auto!important;touch-action:manipulation!important;cursor:pointer!important;box-sizing:border-box!important;min-height:40px!important;padding:0 11px!important;border:1px solid #34475a!important;border-radius:8px!important;background:#111c27!important;color:#f2f6fa!important;font:800 12px/1 Arial,sans-serif!important;text-decoration:none!important;white-space:nowrap!important}header.top .yuna-language-controls [data-lang].active{background:#35a9e1!important;border-color:#35a9e1!important;color:#061018!important}header.top .yuna-language-controls [data-lang]::before,header.top .yuna-language-controls [data-lang]::after{pointer-events:none!important}@media(max-width:600px){html body header.top{padding:10px!important}header.top .yuna-language-controls{gap:5px!important}header.top .yuna-language-controls [data-lang]{min-height:38px!important;padding:0 10px!important;font-size:11px!important}}</style><style id="guild-tools-layout-fix">.two>.card label{display:block;color:#93a1ae;font-size:12px;line-height:1.5;margin:8px 0}.two>.card label input{display:block;width:100%;box-sizing:border-box;margin-top:6px;background:#0d1217;color:#fff;border:1px solid #2b3742;border-radius:7px;padding:11px;min-width:0}.two>.card #save{margin-top:8px}.two>.card .list{margin-top:12px}.two>.card h2{margin-top:18px;margin-bottom:16px}@media(max-width:600px){.two>.card label input{font-size:16px}}</style></head><body><header class="top"><a class="logo yunarunes-home" href="index.html" aria-label="YunaRunes" style="display:inline-flex!important;align-items:center!important;flex:0 0 auto!important;width:max-content!important;max-width:100%!important;min-width:0!important;color:#fff!important;text-decoration:none!important;font-size:28px!important;font-weight:900!important;letter-spacing:-.7px!important;line-height:1.15!important;white-space:nowrap!important;background:transparent!important;border:0!important">YunaRunes</a><div class="yuna-controls" style="display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap"><button type="button" data-lang="pt" aria-label="Português" style="min-height:36px;padding:7px 10px;border:1px solid #34475a;border-radius:8px;background:#111c27;color:#fff;cursor:pointer">🇧🇷 PT/BR</button><button type="button" data-lang="en" aria-label="English" style="min-height:36px;padding:7px 10px;border:1px solid #34475a;border-radius:8px;background:#111c27;color:#fff;cursor:pointer">🇬🇧 ENG</button></div></header><main class="tool-wrap"><section class="hero"><h1>Guild / Siege Tools</h1><p class="muted">Planeia defesas e matchups de Siege e WGB.</p></section><section class="card"><div class="toolbar"><label>Modo<select id="mode"><option value="siege">Siege</option><option value="wgb">WGB</option></select></label><label>Pesquisar<input id="search" placeholder="Ex.: Skogul"></label><button class="btn" id="refresh">Atualizar</button></div></section><section class="two"><section class="card"><h2>Builds públicas</h2><div id="builds" class="list" data-no-translate="true"></div></section><section class="card"><h2>Matchup Planner</h2><label class="muted">Defesa adversária<input id="enemy" placeholder="Mob A, Mob B, Mob C"></label><label class="muted">Meu ataque<input id="attack" placeholder="Mob A, Mob B, Mob C"></label><button class="btn" id="save">Guardar</button><div id="saved" class="list"></div></section></section><section class="card"><h2>Defesas rápidas</h2><div id="defs" class="team" data-no-translate="true"></div></section></main><script>const EN=localStorage.getItem('yunarunes-language')==='en';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),statLabel=v=>esc(v).replace(/\bVIDA\s*(?=%|\b)/gi,'HP').replace(/\bvida\s*(?=%|\b)/gi,'HP').replace(/\bHP\s*%/gi,'HP%');let data={},saved=[];try{const raw=JSON.parse(localStorage.getItem('yunarunes-guild-matchups')||'[]');if(Array.isArray(raw))saved=raw.slice(0,100).filter(x=>x&&typeof x.enemy==='string'&&typeof x.attack==='string')}catch(e){localStorage.removeItem('yunarunes-guild-matchups')}const copy=EN?{none:'No public build found.',empty:'No saved matchups.',ok:'Matchup saved.',remove:'Remove'}:{none:'Nenhuma build pública encontrada.',empty:'Nenhum matchup guardado.',ok:'Matchup guardado.',remove:'Apagar'};const fallback={"skogul":{name:"Skogul",modes:{siege:true,wgb:true},role:"Sustain / dano",runes:{siege:{sets:["Violent + Will"],slots:"HP% / HP% / HP%",subs:["SPD","HP%","DEF%","RES"]},wgb:{sets:["Violent + Will"],slots:"HP% / HP% / HP%",subs:["SPD","HP%","DEF%","RES"]}},teams:{siege:[["Aegir","Skogul","Triana"],["Khmun","Skogul","Orion"]],wgb:[["Aegir","Skogul","Triana"]]}},"megan2a":{name:"Megan (2A)",modes:{siege:true,wgb:true},role:"Suporte / booster",runes:{siege:{sets:["Swift + Will"],slots:"SPD / HP% / HP%",subs:["SPD","ACC","HP%","DEF%"]},wgb:{sets:["Swift + Will"],slots:"SPD / HP% / HP%",subs:["SPD","ACC","HP%","DEF%"]}},teams:{siege:[["Bernard (2A)","Megan (2A)","Lushen"],["Galleon","Lushen","Megan (2A)"]],wgb:[["Bernard (2A)","Megan (2A)","Lushen"]]}},"camilla":{name:"Camilla",modes:{siege:true,wgb:true},role:"Sustain / bruiser",runes:{siege:{sets:["Violent + Will"],slots:"SPD / HP% / HP%",subs:["SPD","HP%","DEF%","RES"]},wgb:{sets:["Violent + Will"],slots:"SPD / HP% / HP%",subs:["SPD","HP%","DEF%","RES"]}},teams:{siege:[["Camilla","Riley","Feng Yan"]],wgb:[["Camilla","Riley","Feng Yan"]]}}};data=fallback;render();async function load(){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),5000);try{const r=await fetch('./guild-builds.json',{cache:'no-store',signal:controller.signal});clearTimeout(timeout);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j&&Object.keys(j).some(k=>k!=='_meta')){data=j;render()}else throw new Error('Base vazia')}catch(e){clearTimeout(timeout);console.warn('YunaRunes: a manter builds de reserva porque guild-builds.json não carregou.',e)}}function render(){const mode=$('mode').value,q=$('search').value.toLowerCase().trim(),arr=Object.values(data).filter(x=>x&&x.name&&x.name!=='_meta'&&x.modes&&x.modes[mode]&&(!q||x.name.toLowerCase().includes(q)));$('builds').innerHTML=arr.length?arr.map(x=>{const r=x.runes&&x.runes[mode],t=x.teams&&x.teams[mode]||[];return '<div class="row"><strong>'+esc(x.name)+'</strong><div class="muted">'+esc(x.role||'')+' · '+esc(r&&r.sets?r.sets.join(' / '):'')+' · '+statLabel(r&&r.slots||'')+'</div><div class="chips">'+((r&&r.subs)||[]).map(s=>'<span class="badge">'+statLabel(s)+'</span>').join('')+'</div>'+t.slice(0,2).map(z=>'<div class="muted">'+esc(z.join(' / '))+'</div>').join('')+'</div>'}).join(''):'<div class="empty">'+copy.none+'</div>';$('saved').innerHTML=saved.length?saved.map((x,i)=>'<div class="row"><strong>'+esc(x.enemy)+'</strong><div class="muted">→ '+esc(x.attack)+' · '+esc(x.mode)+'</div><button class="btn danger" data-i="'+i+'">'+copy.remove+'</button></div>').join(''):'<div class="empty">'+copy.empty+'</div>';$('saved').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{saved.splice(Number(b.dataset.i),1);localStorage.setItem('yunarunes-guild-matchups',JSON.stringify(saved));render()});$('defs').innerHTML=arr.slice(0,9).map(x=>{const t=x.teams&&x.teams.siege&&x.teams.siege[0]||[];return '<div class="slot"><strong>'+esc(x.name)+'</strong><div class="muted">'+(t.length?t.map(esc).join('<br>'):'—')+'</div></div>'}).join('')||'<div class="empty">'+copy.none+'</div>'}$('refresh').onclick=render;$('mode').onchange=render;$('search').oninput=render;$('save').onclick=()=>{const enemy=$('enemy').value.trim(),attack=$('attack').value.trim();if(!enemy||!attack)return;saved.unshift({enemy,attack,mode:$('mode').value,date:Date.now()});localStorage.setItem('yunarunes-guild-matchups',JSON.stringify(saved));render();alert(copy.ok)};load();</script><style>header.top{min-height:58px}</style><script>(()=>{const btns=document.querySelectorAll('[data-lang]');function setLang(lang){localStorage.setItem('yunarunes-language',lang==='en'?'en':'pt');document.documentElement.lang=lang==='en'?'en':'pt-BR';const en=lang==='en';document.querySelector('.hero h1').textContent=en?'Guild / Siege Tools':'Ferramentas de Guilda / Cerco';document.querySelector('.hero p').textContent=en?'Plan Siege and WGB defenses and matchups.':'Planeia defesas e matchups de Cerco e WGB.';const labels=document.querySelectorAll('.toolbar label');labels[0].firstChild.textContent=en?'Mode':'Modo';labels[1].firstChild.textContent=en?'Search':'Pesquisar';document.getElementById('search').placeholder=en?'E.g. Skogul':'Ex.: Skogul';document.getElementById('refresh').textContent=en?'Refresh':'Atualizar';document.querySelectorAll('.two>.card h2')[0].textContent=en?'Public builds':'Builds públicas';document.querySelectorAll('.two>.card h2')[1].textContent=en?'Matchup Planner':'Planeador de Matchups';const ls=document.querySelectorAll('.two>.card label');ls[0].childNodes[0].textContent=en?'Enemy defense':'Defesa adversária';ls[1].childNodes[0].textContent=en?'My attack':'Meu ataque';document.getElementById('save').textContent=en?'Save':'Guardar';document.querySelector('.tool-wrap>.card:last-child h2').textContent=en?'Quick defenses':'Defesas rápidas';btns.forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',String(b.dataset.lang===lang))});}btns.forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));setLang(localStorage.getItem('yunarunes-language')==='en'?'en':'pt');})();</script><script src="language.js?v=20261020-app-header-grid-v7"></script></body></html>
