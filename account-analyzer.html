<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Account Analyzer</title><link rel="stylesheet" href="advanced-tools.css"><style>.toolbar{display:flex!important;align-items:center!important;gap:12px!important;flex-wrap:wrap!important}.toolbar>#demo,.toolbar>#export{flex:0 0 auto!important;white-space:nowrap!important}.toolbar>label{display:flex;flex-direction:column;gap:6px;flex:1 1 200px;min-width:180px}.toolbar>label input{display:none!important}.json-picker{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border:1px solid #34475a;border-radius:8px;background:#111c27;color:#f2f6fa;font-weight:800;cursor:pointer}.json-filename{display:block;max-width:100%;overflow-wrap:anywhere;font-size:12px;opacity:.8}#source{display:block;margin:14px 0 0;line-height:1.5}@media(max-width:600px){.toolbar{align-items:stretch!important}.toolbar>#demo,.toolbar>#export{flex:1 1 100%!important}.toolbar>label{flex:1 1 100%!important;min-width:0!important}}</style></head><body><header class="top"><a class="logo yunarunes-home" href="index.html" aria-label="YunaRunes" style="display:inline-flex!important;align-items:center!important;flex:0 0 auto!important;width:max-content!important;max-width:100%!important;min-width:0!important;color:#fff!important;text-decoration:none!important;font-size:28px!important;font-weight:900!important;letter-spacing:-.7px!important;line-height:1.15!important;white-space:nowrap!important;background:transparent!important;border:0!important">YunaRunes</a><div class="yuna-controls" style="display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap"><a class="donate-link" href="https://www.paypal.com/myaccount/summary" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:7px 10px;border:1px solid #8c63c4;border-radius:8px;backgr ion class="card"><h2 data-pt="Runas" data-en="Runes">Runes</h2><div id="runeStats" class="list"></div></section></section><section class="card"><h2 data-pt="Qualidade da conta" data-en="Account quality">Account quality</h2><div id="quality"></div></section></main><script>
const getEN=()=>{try{return (localStorage.getItem('yunarunes-language')||document.cookie.match(/(?:^|; )yunarunes-language=([^;]+)/)?.[1]||document.documentElement.lang||'pt').toLowerCase().startsWith('en')}catch(_){return (document.documentElement.lang||'pt').toLowerCase().startsWith('en')}};const EN=getEN();const T=EN?{demo:'Analyzing demo data.',custom:'Custom account data loaded.',json:'Invalid JSON file. Please select a valid account JSON file.',no:'No data available.',export:'account',monsters:'Monsters',runes:'Runes',average:'Average quality',total:'Total',nat5:'NAT 5',nat4:'NAT 4',nat3:'NAT 3',runesLabel:'runes',strong:'Very strong account',good:'Good foundation for progress',improve:'Plenty of room to improve',runeQuality:'Runes ≥85%',artifactAverage:'Average artifacts'}:{demo:'A analisar dados de demonstração.',custom:'Dados personalizados da conta carregados.',json:'JSON inválido. Escolhe um ficheiro JSON de conta válido.',no:'Sem dados disponíveis.',export:'conta',monsters:'Monstros',runes:'Runas',average:'Qualidade média',total:'Total',nat5:'NAT 5',nat4:'NAT 4',nat3:'NAT 3',runesLabel:'runas',strong:'Conta muito forte',good:'Boa base para evolução',improve:'Grande margem para melhorar',runeQuality:'Runas ≥85%',artifactAverage:'Artefactos média'};const $=id=>document.getElementById(id);$('jsonPicker').onclick=()=> $('file').click();$('file').addEventListener('change',()=>{$('jsonFilename').textContent=$('file').files[0]?.name||(getEN()?'No file selected':'Nenhum ficheiro selecionado')});const demo={monsters:[{name:'Galleon',stars:4},{name:'Lushen',stars:4},{name:'Camilla',stars:5},{name:'Riley',stars:5},{name:'Megan',stars:3},{name:'Skogul',stars:4},{name:'Feng Yan',stars:5},{name:'Theomars',stars:4}],runes:[{set:'Violent',eff:92},{set:'Swift',eff:88},{set:'Will',eff:84},{set:'Rage',eff:81},{set:'Fatal',eff:76},{set:'Violent',eff:91},{set:'Swift',eff:73},{set:'Despair',eff:86}],artifacts:[{type:'left',quality:82},{type:'right',quality:79},{type:'left',quality:91}]};let data=demo;
function calc(){const m=data.monsters||[],r=data.runes||[],a=data.artifacts||[];const nat5=m.filter(x=>Number(x.stars)===5).length,rv=r.length?Math.round(r.reduce((s,x)=>s+Number(x.eff||x.quality||0),0)/r.length):0,rv95=r.filter(x=>Number(x.eff||x.quality||0)>=85).length,aq=a.length?Math.round(a.reduce((s,x)=>s+Number(x.quality||x.eff||0),0)/a.length):0,score=Math.round(Math.min(100,nat5*6+rv*.45+rv95*2+aq*.2));$('stats').innerHTML=`<div class="stat"><b>${T.monsters}</b><strong>${m.length}</strong></div><div class="stat"><b>${T.nat5}</b><strong>${nat5}</strong></div><div class="stat"><b>${T.runes}</b><strong>${r.length}</strong></div><div class="stat"><b>${T.average}</b><strong>${rv}%</strong></div>`;const bySet={};r.forEach(x=>bySet[x.set]=(bySet[x.set]||0)+1);$('monsterStats').innerHTML=[[T.total,m.length],[T.nat5,nat5],[T.nat4,m.filter(x=>Number(x.stars)===4).length],[T.nat3,m.filter(x=>Number(x.stars)===3).length]].map(x=>`<div class="row"><strong>${x[0]}</strong><span class="muted">${x[1]}</span></div>`).join('')||`<div class="empty">${T.no}</div>`;$('runeStats').innerHTML=[...Object.entries(bySet)].sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>`<div class="row"><strong>${x[0]}</strong><span class="muted">${x[1]} ${T.runesLabel}</span></div>`).join('')+`<div class="row"><strong>≥85%</strong><span class="muted">${rv95}</span></div>`;$('quality').innerHTML=`<div class="note"><strong>${score}/100</strong> — ${score>=85?T.strong:score>=70?T.good:T.improve}.</div><div class="progress"><i style="width:${score}%"></i></div><div class="chips" style="margin-top:10px"><span class="badge">${T.runeQuality}: ${rv95}</span><span class="badge">${T.artifactAverage}: ${aq}%</span><span class="badge">${T.nat5}: ${nat5}</span></div>`}
$('demo').onclick=()=>{data=demo;$('source').textContent=T.demo;calc()};$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||typeof d!=='object')throw Error();data={monsters:d.monsters||d.monster||[],runes:d.runes||d.rune_inventory||[],artifacts:d.artifacts||[]};$('source').textContent=T.custom;calc()}catch(_){$('source').textContent=T.json}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({generated:new Date().toISOString(),summary:{monsters:data.monsters?.length||0,runes:data.runes?.length||0,artifacts:data.artifacts?.length||0},data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yunarunes-account-analysis.json';a.click();URL.revokeObjectURL(a.href)};calc();
</script><script src="advanced-tools-lang.js?v=20261008-v5"></script><script src="yunarunes-upgrades.js?v=20261001-v2"></script><script src="language.js?v=20261016-brand-v29"></script></body></html>
