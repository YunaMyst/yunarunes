<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Account Analyzer</title><link rel="stylesheet" href="advanced-tools.css"><style>.toolbar{display:flex!important;align-items:center!important;gap:12px!important;flex-wrap:wrap!important}.toolbar>#demo,.toolbar>#export{flex:0 0 auto!important;white-space:nowrap!important}.toolbar>label{display:flex;flex-direction:column;gap:6px;flex:1 1 200px;min-width:180px}.toolbar>label input{display:block;width:100%;margin-top:0!important}#source{display:block;margin:14px 0 0;line-height:1.5}@media(max-width:600px){.toolbar{align-items:stretch!important}.toolbar>#demo,.toolbar>#export{flex:1 1 100%!important}.toolbar>label{flex:1 1 100%!important;min-width:0!important}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="tool-wrap"><section class="hero"><h1>📊 Account Analyzer</h1><p class="muted">Analisa a tua conta a partir de monstros e inventário. Sem servidor: os dados ficam no teu navegador.</p></section><section class="card"><div class="toolbar"><button class="btn" id="demo" data-pt="Usar análise de demonstração" data-en="Use demo analysis">Use demo analysis</button><label><span data-pt="Importar conta JSON" data-en="Import account JSON">Import account JSON</span><input id="file" type="file" accept="application/json,.json"></label><button class="btn secondary" id="export" data-pt="Exportar análise" data-en="Export analysis">Export analysis</button></div><p class="muted" id="source" data-pt="A analisar dados de demonstração." data-en="Analyzing demo data.">Analyzing demo data.</p></section><section class="stat-grid" id="stats"></section><section class="two"><section class="card"><h2 data-pt="Monstros" data-en="Monsters">Monsters</h2><div id="monsterStats" class="list"></div></section><section class="card"><h2 data-pt="Runas" data-en="Runes">Runes</h2><div id="runeStats" class="list"></div></section></section><section class="card"><h2 data-pt="Qualidade da conta" data-en="Account quality">Account quality</h2><div id="quality"></div></section></main><script>
const EN=(localStorage.getItem('yunarunes-language')||'pt').toLowerCase().startsWith('en');const T=EN?{demo:'Analyzing demo data.',custom:'Custom account data loaded.',json:'Invalid JSON.',no:'No data available.',export:'account'}:{demo:'A analisar dados de demonstração.',custom:'Dados personalizados da conta carregados.',json:'JSON inválido.',no:'Sem dados disponíveis.',export:'conta'};const $=id=>document.getElementById(id);const demo={monsters:[{name:'Galleon',stars:4},{name:'Lushen',stars:4},{name:'Camilla',stars:5},{name:'Riley',stars:5},{name:'Megan',stars:3},{name:'Skogul',stars:4},{name:'Feng Yan',stars:5},{name:'Theomars',stars:4}],runes:[{set:'Violent',eff:92},{set:'Swift',eff:88},{set:'Will',eff:84},{set:'Rage',eff:81},{set:'Fatal',eff:76},{set:'Violent',eff:91},{set:'Swift',eff:73},{set:'Despair',eff:86}],artifacts:[{type:'left',quality:82},{type:'right',quality:79},{type:'left',quality:91}]};let data=demo;
function calc(){const m=data.monsters||[],r=data.runes||[],a=data.artifacts||[];const nat5=m.filter(x=>Number(x.stars)===5).length,rv=r.length?Math.round(r.reduce((s,x)=>s+Number(x.eff||x.quality||0),0)/r.length):0,rv95=r.filter(x=>Number(x.eff||x.quality||0)>=85).length,aq=a.length?Math.round(a.reduce((s,x)=>s+Number(x.quality||x.eff||0),0)/a.length):0,score=Math.round(Math.min(100,nat5*6+rv*.45+rv95*2+aq*.2));$('stats').innerHTML=`<div class="stat"><b>Monstros</b><strong>${m.length}</strong></div><div class="stat"><b>NAT 5</b><strong>${nat5}</strong></div><div class="stat"><b>Runas</b><strong>${r.length}</strong></div><div class="stat"><b>Qualidade média</b><strong>${rv}%</strong></div>`;const bySet={};r.forEach(x=>bySet[x.set]=(bySet[x.set]||0)+1);$('monsterStats').innerHTML=[['Total',m.length],['NAT 5',nat5],['NAT 4',m.filter(x=>Number(x.stars)===4).length],['NAT 3',m.filter(x=>Number(x.stars)===3).length]].map(x=>`<div class="row"><strong>${x[0]}</strong><span class="muted">${x[1]}</span></div>`).join('')||`<div class="empty">${T.no}</div>`;$('runeStats').innerHTML=[...Object.entries(bySet)].sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>`<div class="row"><strong>${x[0]}</strong><span class="muted">${x[1]} runas</span></div>`).join('')+`<div class="row"><strong>≥85%</strong><span class="muted">${rv95}</span></div>`;$('quality').innerHTML=`<div class="note"><strong>${score}/100</strong> — ${score>=85?'Conta muito forte':score>=70?'Boa base para evolução':'Grande margem para melhorar'}.</div><div class="progress"><i style="width:${score}%"></i></div><div class="chips" style="margin-top:10px"><span class="badge">Runas ≥85%: ${rv95}</span><span class="badge">Artefactos média: ${aq}%</span><span class="badge">NAT 5: ${nat5}</span></div>`}
$('demo').onclick=()=>{data=demo;$('source').textContent=T.demo;calc()};$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||typeof d!=='object')throw Error();data={monsters:d.monsters||d.monster||[],runes:d.runes||d.rune_inventory||[],artifacts:d.artifacts||[]};$('source').textContent=T.custom;calc()}catch(_){$('source').textContent=T.json}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({generated:new Date().toISOString(),summary:{monsters:data.monsters?.length||0,runes:data.runes?.length||0,artifacts:data.artifacts?.length||0},data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yunarunes-account-analysis.json';a.click();URL.revokeObjectURL(a.href)};calc();
</script><script src="advanced-tools-lang.js?v=20261008-v5"></script><script src="yunarunes-upgrades.js?v=20261001-v2"></script><script src="language.js?v=20261012-language-buttons-v11"></script></body></html>
