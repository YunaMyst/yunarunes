<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Rune Optimizer</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{background:#151b22;border-bottom:1px solid var(--b);padding:18px 24px}.logo{font-size:24px;font-weight:900;color:white;text-decoration:none}.logo span{color:var(--a)}.wrap{max-width:1050px;margin:auto;padding:25px 16px}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:20px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{color:var(--m);font-size:13px}select,input{width:100%;margin-top:6px;padding:11px;background:#0d1217;color:white;border:1px solid var(--b);border-radius:5px}.btn{background:var(--a);border:0;border-radius:5px;padding:12px 18px;font-weight:800;cursor:pointer;margin-top:15px}.muted{color:var(--m)}.result{display:grid;grid-template-columns:55px 1fr auto;gap:14px;align-items:center;border:1px solid var(--b);background:#11171d;border-radius:7px;padding:14px;margin-top:10px}.rank{font-size:25px;font-weight:900}.score{font-size:20px;font-weight:900;color:var(--a)}.bar{height:7px;background:#28333d;border-radius:5px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--a)}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tag{background:var(--p2);padding:5px 8px;border-radius:5px;font-size:12px}.ok{color:#8ee28e}.warn{color:#ffd27a}@media(max-width:700px){.grid{grid-template-columns:1fr}.result{grid-template-columns:45px 1fr}.score{grid-column:2}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="wrap"><div class="card"><h1>⚙️ Rune Optimizer</h1><p class="muted">Define os objetivos e o YunaRunes cria um ranking de builds candidatas.</p><div class="grid"><label>Monstro<input id="monster" placeholder="Ex.: Lushen"></label><label>Modo<select id="mode"><option value="balanced">Normal — equilibrado</option><option value="speed">SPD — velocidade</option><option value="damage">DMG — dano</option><option value="tank">EHP — sobrevivência</option></select></label><label>Set<select id="set"><option>Qualquer</option><option>Violent</option><option>Swift</option><option>Will</option><option>Despair</option><option>Rage</option><option>Fatal</option><option>Revenge</option><option>Shield</option><option>Nemesis</option></select></label></div></div><div class="card"><h2>Stats mínimas</h2><div class="grid"><label>SPD<input id="spd" type="number" min="0" value="0"></label><label>HP%<input id="hp" type="number" min="0" max="300" value="0"></label><label>DEF%<input id="def" type="number" min="0" max="300" value="0"></label><label>ATK%<input id="atk" type="number" min="0" max="300" value="0"></label><label>CR%<input id="cr" type="number" min="0" max="100" value="0"></label><label>CD%<input id="cd" type="number" min="0" max="300" value="0"></label><label>ACC%<input id="acc" type="number" min="0" max="100" value="0"></label><label>RES%<input id="res" type="number" min="0" max="100" value="0"></label></div><button class="btn" onclick="optimize()">Encontrar melhores builds</button></div><div class="card"><h2>Resultados</h2><div id="results" class="muted">Define os requisitos e inicia a pesquisa.</div></div></main><script>const profiles={balanced:[86,91,78,74],speed:[98,92,63,55],damage:[82,96,76,68],tank:[80,72,98,94]};function val(id){return Number(document.getElementById(id).value)||0}function optimize(){const mode=document.getElementById('mode').value,set=document.getElementById('set').value,base=profiles[mode],req={spd:val('spd'),hp:val('hp'),def:val('def'),atk:val('atk'),cr:val('cr'),cd:val('cd'),acc:val('acc'),res:val('res')};let names=set==='Qualquer'?['Violent / Will','Swift / Will','Violent / Broken','Despair / Will']: [set+' / Will',set+' / Broken',set+' / Revenge',set+' / Shield'];const targetPenalty=Math.min(30,(req.spd+req.hp/5+req.def/5+req.atk/5+req.cr/2+req.cd/4+req.acc/2+req.res/2)/20);let html='';names.forEach((n,i)=>{let score=Math.max(1,Math.min(99,base[i]+Math.min(req.spd,100)*.05-targetPenalty*.15-i*2));const speed=Math.round(req.spd+18-i*3);const hp=Math.round(req.hp+30-i*4);const def=Math.round(req.def+20-i*3);html+='<div class="result"><div class="rank">#'+(i+1)+'</div><div><b>'+n+'</b><div class="stats"><span class="tag">SPD '+speed+'</span><span class="tag">HP% '+hp+'</span><span class="tag">DEF% '+def+'</span><span class="tag '+(req.spd?'ok':'warn')+'">'+(req.spd?'✓ SPD alvo':'Sem alvo SPD')+'</span></div><div class="bar"><i style="width:'+score+'%"></i></div></div><div class="score">'+score.toFixed(0)+'</div></div>'});document.getElementById('results').innerHTML=html+'<p class="muted">Modo '+mode.toUpperCase()+' · ranking demonstrativo. Para otimização matemática real, o próximo passo é importar o inventário de runas do jogador.</p>'}const p=new URLSearchParams(location.search).get('monster');if(p)document.getElementById('monster').value=p;</script></body></html>
