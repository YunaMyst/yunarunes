<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Builder — YunaRunes</title><style>:root{--bg:#0b1015;--p:#141b23;--t:#f2f6fa;--m:#95a4b2;--a:#35a9e1;--ok:#7ee787;--bad:#ff8f8f;--b:#2a3743}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{min-height:62px;background:#111820;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px;gap:28px;position:sticky;top:0;z-index:20}.logo{font-size:24px;font-weight:900;color:#fff;text-decoration:none}.logo span{color:var(--a)}nav{display:flex;gap:18px;overflow:auto;white-space:nowrap}nav a{color:#c3ccd5;text-decoration:none;font-size:14px}.wrap{max-width:1250px;margin:auto;padding:24px 18px}.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:20px;margin-bottom:16px}.muted{color:var(--m);line-height:1.5}.error{color:var(--bad)}.ok{color:var(--ok)}h1,h2,h3{margin-top:0}.search,.tool-row{display:flex;gap:9px;flex-wrap:wrap}.search input,.search select,.tool-row input,.tool-row select{flex:1;min-width:180px;background:#0c1218;color:#fff;border:1px solid var(--b);border-radius:7px;padding:12px}.btn{background:var(--a);color:#061018;border:0;border-radius:7px;padding:12px 17px;font-weight:800;cursor:pointer}.synergy-results{margin-top:15px}.synergy-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}.synergy-card{background:#10171e;border:1px solid var(--b);border-radius:10px;padding:10px;text-align:center;cursor:pointer}.synergy-card:hover{border-color:var(--a);transform:translateY(-2px)}.synergy-card img{width:80px;height:80px;object-fit:contain}.synergy-card b{display:block;margin:5px 0}.synergy-reason{font-size:11px;color:var(--m);line-height:1.35}@media(max-width:900px){.synergy-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.synergy-grid{grid-template-columns:repeat(2,1fr)}}.team{display:grid;gap:12px}.team.size-4{grid-template-columns:repeat(4,minmax(0,1fr))}.team.size-3{grid-template-columns:repeat(3,minmax(0,1fr))}.slot,.mini-slot{background:#10171e;border:1px solid var(--b);border-radius:12px;padding:12px;text-align:center}.slot,.mini-slot{cursor:pointer}.slot:hover,.mini-slot:hover{border-color:var(--a);transform:translateY(-2px)}.slot img{width:115px;height:115px;object-fit:contain;display:block;margin:auto}.slot h3{font-size:15px;margin:8px 0}.tag{display:inline-block;border:1px solid var(--b);padding:4px 7px;border-radius:5px;font-size:11px;color:var(--m);margin:2px}.selected{color:var(--a);font-weight:900}.recommended{color:var(--ok);font-weight:900}.detail{background:#111820;border:1px solid var(--b);border-radius:12px;margin-top:12px;padding:16px;display:none}.detail.open{display:block}.head{display:flex;align-items:center;gap:14px}.head img{width:85px;height:85px;object-fit:contain}.runes-box{margin-top:15px;padding:14px;background:#0d141a;border:1px solid var(--b);border-radius:10px}.rune-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}.rune-slot{background:#111820;border:1px solid var(--b);border-radius:8px;padding:10px;text-align:center}.rune-slot b{display:block;color:var(--a);font-size:12px;margin-bottom:5px}.rune-slot span{font-size:12px}.priority{margin-top:10px;color:var(--ok);font-size:13px}.empty{text-align:center;padding:24px}.badge{display:inline-block;padding:5px 8px;border-radius:5px;background:#202c37;font-size:11px}.team-options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:15px}.team-option{background:#10171e;border:1px solid var(--b);border-radius:12px;padding:14px}.team-option h3{margin:0 0 5px}.mini-team{display:grid;gap:8px;margin-top:10px}.mini-team.size-4{grid-template-columns:repeat(4,1fr)}.mini-team.size-3{grid-template-columns:repeat(3,1fr)}.mini-slot{padding:8px}.mini-slot img{width:65px;height:65px;object-fit:contain}.mini-slot b{display:block;font-size:11px;margin-top:3px}.team-label{color:var(--a);font-size:12px;font-weight:800}.clicked-runes{margin-top:18px}.clicked-runes:not(.open){display:none}.local-runes{margin-top:10px;padding:10px;text-align:left}.local-runes .runes-box{margin-top:8px}@media(max-width:900px){.team-options{grid-template-columns:1fr}}@media(max-width:700px){.rune-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.top{padding:0 14px}.team.size-4,.team.size-3{grid-template-columns:1fr}.mini-team.size-4,.mini-team.size-3{grid-template-columns:repeat(2,1fr)}.slot img{width:105px;height:105px}.card{padding:15px}.rune-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a><nav><a href="index.html">Monstros</a><a href="database.html">Database</a><a href="team-builder.html">Team Builder</a><a href="runes.html">Runas</a><a href="optimizer.html">Optimizer</a></nav></header><main class="wrap"><section class="card"><h1>⚔️ Team Builder</h1><p class="muted">Pesquisa um monstro e o YunaRunes monta várias opções de equipes respeitando o limite de cada conteúdo.</p><div class="search"><input id="search" list="monsterNames" autocomplete="off" placeholder="Pesquisar um monstro..."><datalist id="monsterNames"></datalist><select id="mode"><option value="arena">🏟️ Arena</option><option value="siege">🏰 Siege</option><option value="wgb">🌍 WGB</option></select><select id="side"><option value="attack">⚔️ Ataque</option><option value="defense">🛡️ Defesa</option></select><button class="btn" id="buildBtn">Criar equipes</button><button class="btn" id="synergyBtn" type="button" onclick="YunaRunesSynergy()">🤝 Sinergia</button></div><p id="limitInfo" class="muted"></p><p id="status" class="muted">Carregando monstros...</p><div id="synergyResults" class="synergy-results"></div></section><section id="out" class="card empty">Pesquisa um monstro para começar.</section></main><script>
let catalog=[],guildBuilds={};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=v=>String(v??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();const key=v=>clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');const playable=m=>!!m&&Number(m.stars)>=2&&Number(m.stars)<=5&&!!m.family&&m.family!=='100000'&&m.obtainable!==false&&!!m.image&&!/material|angelmon|devilmon|rainbowmon/i.test(clean(m.name));const role=m=>String(m?.role||'').toLowerCase();const kind=m=>{const n=key(m.name),r=role(m);if(/riley|lulu|konamiya|fran|belladeon|colleen|chasun|triana|megan|jeanne|veromos/.test(n))return'sustain';if(/galleon|tiana|orion|bernard|woosa|seara|zibala/.test(n))return'control';if(r==='attack')return'damage';if(r==='defense')return'control';if(r==='support'||r==='hp')return'support';return'utility'};const img=m=>m?.image?'<img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'">':'';const teamSize=mode=>mode==='arena'?4:3;const limitText=mode=>mode==='arena'?'Arena: máximo 4 mobs por equipe (Ataque ou Defesa).':mode==='siege'?'Siege: máximo 3 mobs por equipe (Ataque ou Defesa).':'WGB: máximo 3 mobs por equipe (Ataque ou Defesa).';function findMonster(text){const k=key(text);if(!k)return null;return catalog.find(m=>key(m.name)===k)||catalog.find(m=>key(m.name).startsWith(k))||catalog.find(m=>key(m.name).includes(k))||null}
const runeDB={galleon:{sets:'Swift + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'SPD, HP%, DEF%, ACC'},tiana:{sets:'Swift + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'SPD, HP%, DEF%, RES'},lushen:{sets:'Fatal/Blade ou Rage/Blade',slots:[['1','ATK'],['2','ATK%'],['3','DEF'],['4','CD%'],['5','HP'],['6','ATK%']],subs:'CR, CD, ATK%, SPD'},seara:{sets:'Violent + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','CD%'],['5','HP'],['6','ACC%']],subs:'SPD, ACC, CR, HP%, ATK%'},orion:{sets:'Swift + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','ACC%']],subs:'SPD, ACC, HP%, DEF%, RES'},bernard:{sets:'Swift + Broken/Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'SPD, HP%, DEF%, ACC'},woosa:{sets:'Violent + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'SPD, HP%, DEF%, RES'},camilla:{sets:'Violent + Nemesis/Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','CD%'],['5','HP'],['6','HP%']],subs:'HP%, SPD, CR, CD, DEF%'},fengyan:{sets:'Violent + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','CD%'],['5','HP'],['6','DEF%']],subs:'DEF%, SPD, CR, CD, HP%'},riley:{sets:'Violent + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'SPD, HP%, DEF%, RES'},vigor:{sets:'Violent + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'SPD, HP%, DEF%, CR'},skogul:{sets:'Triple HP ou Violent + Will',slots:[['1','ATK'],['2','HP%'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'HP%, SPD, DEF%, RES'},megan:{sets:'Swift + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'SPD, ACC, HP%, DEF%, RES'},poseidon:{sets:'Despair + Focus/Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','CD%'],['5','HP'],['6','ACC%']],subs:'SPD, ACC, CR, HP%, ATK%'},zibala:{sets:'Swift + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','ACC%']],subs:'SPD, ACC, HP%, DEF%'},josephine:{sets:'Violent + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'SPD, HP%, DEF%, RES'},windy:{sets:'Energy/Guard + Will',slots:[['1','ATK'],['2','HP%'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'HP%, DEF%, SPD, RES'},juno:{sets:'Violent + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','CD%'],['5','HP'],['6','HP%']],subs:'SPD, CR, CD, HP%, DEF%'},chow:{sets:'Violent + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','CD%'],['5','HP'],['6','ATK%']],subs:'SPD, CR, CD, HP%, ATK%'},tarq:{sets:'Violent + Blade/Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','CD%'],['5','HP'],['6','ATK%']],subs:'CR, CD, SPD, ATK%, HP%'}};
function runeRecommendation(m){const k=key(m.name);if(runeDB[k])return runeDB[k];const knd=kind(m);if(knd==='damage')return{sets:'Rage/Blade ou Fatal/Blade',slots:[['1','ATK'],['2','ATK% / SPD'],['3','DEF'],['4','CD% / CR%'],['5','HP'],['6','ATK%']],subs:'CR, CD, ATK%, SPD'};if(knd==='control')return{sets:'Swift/Violent + Will',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','ACC%']],subs:'SPD, ACC, HP%, DEF%, RES'};return{sets:'Violent + Will ou sets de HP',slots:[['1','ATK'],['2','SPD'],['3','DEF'],['4','HP%'],['5','HP'],['6','HP%']],subs:'SPD, HP%, DEF%, RES'}}
function renderRunes(m){const r=runeRecommendation(m);return '<div class="runes-box"><h3>🛡️ Runas recomendadas</h3><p class="muted"><b>Sets:</b> '+esc(r.sets)+'</p><div class="rune-grid">'+r.slots.map(x=>'<div class="rune-slot"><b>Slot '+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join('')+'</div><div class="priority"><b>Substats prioritárias:</b> '+esc(r.subs)+'</div></div>'}
function showClickedRunes(el){const m=findMonster(el.getAttribute('data-rune-name'));if(!m)return;document.querySelectorAll('.local-runes').forEach(x=>x.remove());const p=document.createElement('div');p.className='local-runes';p.innerHTML=renderRunes(m);el.appendChild(p)}
function score(m,t,mode,side){if(!playable(m)||m===t)return-99999;let s=0,km=kind(m),kt=kind(t);if(km!==kt)s+=20;if(side==='attack'){if(km==='damage'&&kt!=='damage')s+=35;if(km==='control'&&kt==='damage')s+=25;if(km==='support'||km==='sustain')s+=15}else{if(km==='control')s+=30;if(km==='sustain')s+=28;if(km==='support')s+=18}if(m.element!==t.element)s+=4;if(Number(m.stars)===5)s+=3;if(String(m.family)===String(t.family))s-=1000;const n=key(t.name),q=key(m.name);if(km!==kt)s+=10;if((mode==='siege'||mode==='wgb')&&guildBuilds[key(m.name)])s+=15;return s}
function rankCompanions(t,mode,side,exclude=[]){const ex=new Set(exclude.map(key));return catalog.filter(m=>playable(m)&&m!==t&&!ex.has(key(m.name))).map(m=>({m,s:score(m,t,mode,side)})).sort((a,b)=>b.s-a.s)}
function makeTeam(t,mode,side,exclude=[]){const size=teamSize(mode),team=[t],usedFamilies=new Set([String(t.family)]),excluded=new Set(exclude.map(key));const candidates=rankCompanions(t,mode,side,exclude);const preferred=side==='attack'?['control','damage','support','sustain']:['control','sustain','support','damage'];for(const need of preferred){if(team.length>=size)break;const pick=candidates.find(x=>!excluded.has(key(x.m.name))&&!usedFamilies.has(String(x.m.family))&&kind(x.m)===need);if(pick){team.push(pick.m);usedFamilies.add(String(pick.m.family));excluded.add(key(pick.m.name))}}if(team.length<size)for(const x of candidates){if(team.length>=size)break;if(excluded.has(key(x.m.name))||usedFamilies.has(String(x.m.family)))continue;team.push(x.m);usedFamilies.add(String(x.m.family));excluded.add(key(x.m.name))}return team}
function makeOptions(t,mode,side){const size=teamSize(mode),options=[],signatures=new Set(),ranked=rankCompanions(t,mode,side);const max=12;for(let i=0;i<max&&ranked.length>=size-1;i++){const exclude=ranked.slice(0,i).map(x=>x.m.name);const team=makeTeam(t,mode,side,exclude);if(team.length!==size)continue;const sig=team.slice(1).map(m=>key(m.name)).sort().join('|');if(signatures.has(sig))continue;signatures.add(sig);options.push(team)}return options}
function renderTeamOption(team,i,mode,side){const size=teamSize(mode),labels=['Equipe principal','Alternativa 2','Alternativa 3','Alternativa 4','Alternativa 5','Alternativa 6','Alternativa 7','Alternativa 8','Alternativa 9','Alternativa 10','Alternativa 11','Alternativa 12'];return '<div class="team-option"><h3>⚔️ '+labels[i]+'</h3><div class="team-label">'+esc(mode.toUpperCase())+' · '+(side==='attack'?'⚔️ Ataque':'🛡️ Defesa')+' · '+size+' mobs</div><div class="mini-team size-'+size+'">'+team.map((m,j)=>'<div class="mini-slot" data-rune-name="'+esc(clean(m.name))+'">'+img(m)+'<b>'+esc(clean(m.name))+'</b><span class="tag">'+(j===0?'⭐ PESQUISADO':'🤝')+'</span></div>').join('')+'</div><p class="muted" style="font-size:12px">'+(i===0?'Combinação de referência baseada nas funções e sinergias conhecidas.':'Variação automática para oferecer outra composição.')+'</p></div>'}
function build(){const t=findMonster($('search').value);if(!t){$('out').innerHTML='<div class="empty error">Monstro não encontrado. Primeiro espera os monstros carregarem e escolhe um nome da lista.</div>';return}const mode=$('mode').value,side=$('side').value,size=teamSize(mode),options=makeOptions(t,mode,side);$('limitInfo').textContent=limitText(mode);if(!options.length){$('out').innerHTML='<div class="empty error">Não foi possível criar uma equipe válida com '+size+' mobs.</div>';return}$('out').innerHTML='<h2>⚔️ Equipes sugeridas com '+esc(clean(t.name))+'</h2><p class="muted">Foram geradas <b>'+options.length+'</b> opções diferentes. <b>'+esc(mode.toUpperCase())+'</b> permite no máximo <b>'+size+' mobs</b>.</p><div class="team-options">'+options.map((team,i)=>renderTeamOption(team,i,mode,side)).join('')+'</div><div id="clickedRunes" class="detail clicked-runes"></div><div style="margin-top:18px"><h3>🔍 Ver detalhes da equipe principal</h3><div class="team size-'+size+'">'+options[0].map((m,i)=>'<div class="slot" data-rune-name="'+esc(clean(m.name))+'">'+img(m)+'<h3>'+esc(clean(m.name))+'</h3><span class="tag '+(i===0?'selected':'recommended')+'">'+(i===0?'⭐ PESQUISADO':'🤝 RECOMENDADO')+'</span><span class="tag">'+esc(m.element)+'</span><span class="tag">'+esc(m.role)+'</span></div>').join('')+'</div></div>';document.querySelectorAll('[data-rune-name]').forEach(el=>el.onclick=()=>showClickedRunes(el))}
function showSynergy(){
  const box=$('synergyResults');
  const button=$('synergyBtn');
  if(!box)return;
  box.innerHTML='<div class="muted">⏳ A procurar sinergias...</div>';
  if(button)button.disabled=true;
  try{
    const t=findMonster($('search').value);
    if(!t){
      box.innerHTML='<div class="empty error">Pesquisa primeiro um monstro válido para ver as sinergias.</div>';
      return;
    }
    const mode=$('mode').value;
    const side=$('side').value;
    const targetKind=kind(t);
    const targetElement=String(t.element||'').toLowerCase();
    const ranked=catalog.filter(m=>playable(m)&&m!==t&&String(m.family)!==String(t.family))
      .map(m=>{
        const k=kind(m), el=String(m.element||'').toLowerCase();
        let points=0, reason=[];
        if(k!==targetKind){points+=40;reason.push('função complementar')}
        if(k==='support'||k==='sustain'){points+=25;reason.push('suporte/sustentação')}
        if(k==='control'){points+=20;reason.push('controlo')}
        if(k==='damage'){points+=15;reason.push('dano')}
        if(el!==targetElement){points+=5;reason.push('elemento diferente')}
        if(mode!=='arena'&&guildBuilds[key(m.name)]){points+=10;reason.push('utilizado em conteúdo de guild')}
        if(side==='defense'&&(k==='control'||k==='sustain'))points+=8;
        if(side==='attack'&&(k==='damage'||k==='control'))points+=8;
        return {m,points,reason:[...new Set(reason)]};
      })
      .sort((a,b)=>b.points-a.points)
      .slice(0,10);
    if(!ranked.length){
      box.innerHTML='<div class="empty error">Não encontrei outros monstros jogáveis para sugerir.</div>';
      return;
    }
    box.innerHTML='<div class="card" style="margin:0"><h3>🤝 Sinergias para '+esc(clean(t.name))+'</h3><p class="muted">Sugestões automáticas para complementar '+esc(clean(t.name))+' em '+esc(mode.toUpperCase())+' · '+(side==='attack'?'Ataque':'Defesa')+'.</p><div class="synergy-grid">'+ranked.map((x,i)=>{
      const reason=x.reason.length?x.reason.join(' · '):'pode complementar a equipe';
      return '<div class="synergy-card" data-rune-name="'+esc(clean(x.m.name))+'" role="button" tabindex="0">'+
        '<span class="badge">#'+(i+1)+'</span>'+img(x.m)+
        '<b>'+esc(clean(x.m.name))+'</b>'+
        '<span class="tag">'+esc(x.m.element||'')+'</span>'+
        '<span class="tag">'+esc(x.m.role||'')+'</span>'+
        '<p class="synergy-reason">✓ '+esc(reason)+'</p></div>';
    }).join('')+'</div></div>';
    box.querySelectorAll('.synergy-card').forEach(el=>{
      const open=()=>showClickedRunes(el);
      el.addEventListener('click',open);
      el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
    });
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(err){
    console.error('YunaRunes Sinergia:',err);
    box.innerHTML='<div class="empty error">O botão Sinergia encontrou um erro: '+esc(err.message||err)+'</div>';
  }finally{
    if(button)button.disabled=false;
  }
}
function updateLimit(){$('limitInfo').textContent=limitText($('mode').value)}async function loadJSON(path){const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path+' HTTP '+r.status);return r.json()}async function init(){try{const j=await loadJSON('monster-catalog.json');const raw=Array.isArray(j)?j:(Array.isArray(j.monsters)?j.monsters:[]);catalog=raw.filter(playable);if(!catalog.length)throw new Error('A base não contém monstros jogáveis.');$('status').innerHTML='<span class="ok">✓ '+catalog.length+' monstros carregados.</span>';$('monsterNames').innerHTML=[...new Set(catalog.map(m=>clean(m.name)))].sort((a,b)=>a.localeCompare(b,'pt-PT')).map(n=>'<option value="'+esc(n)+'">').join('');try{guildBuilds=await loadJSON('guild-builds.json')}catch(e){guildBuilds={}}updateLimit();const p=new URLSearchParams(location.search);const requested=p.get('name');if(requested){$('search').value=requested;build();showSynergy();document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'})}}catch(e){console.error(e);$('status').innerHTML='<span class="error">Não foi possível carregar os monstros. '+esc(e.message)+'</span>'}}$('buildBtn').addEventListener('click',build);$('mode').addEventListener('change',updateLimit);$('search').onkeydown=e=>{if(e.key==='Enter')build()};init();</script><script src="language.js?v=20260925-lang-v14"></script><script src="language-dynamic.js?v=20260925-lang-v29"></script><script src="synergy.js?v=20260925-synergy-v1"></script></body></html>
