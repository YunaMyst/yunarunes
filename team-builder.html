<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Builder — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{min-height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px;gap:28px;position:sticky;top:0;z-index:5}.logo{font-size:24px;font-weight:900;color:#fff;text-decoration:none}.logo span{color:var(--a)}nav{display:flex;gap:18px;overflow:auto;white-space:nowrap}nav a{color:#c3ccd5;text-decoration:none;font-size:14px}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:20px;margin-bottom:16px}.search{display:grid;grid-template-columns:2fr 1fr auto;gap:9px}.search input,.search select{width:100%;background:#0d1217;color:#fff;border:1px solid var(--b);border-radius:5px;padding:12px}.btn{background:var(--a);color:#061018;border:0;border-radius:5px;padding:12px 17px;font-weight:800;cursor:pointer}.muted{color:var(--m);line-height:1.5}.team{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.slot{background:#11171d;border:1px solid var(--b);border-radius:7px;padding:14px;text-align:center}.slot a{color:inherit;text-decoration:none;display:block}.slot img{width:90px;height:90px;object-fit:contain;display:block;margin:auto}.slot h3{font-size:15px;margin:9px 0 4px}.tag{display:inline-block;border:1px solid var(--b);padding:4px 7px;border-radius:4px;font-size:11px;color:var(--m);margin:3px}.used{color:#7ee787}.why{background:var(--p2);border-radius:7px;padding:14px;margin-top:12px}.empty{padding:25px;text-align:center;color:var(--m)}.mode-info{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mode-info span{border:1px solid var(--b);padding:5px 8px;border-radius:4px;font-size:11px;color:var(--m)}@media(max-width:700px){.search{grid-template-columns:1fr}.team{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.team{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a><nav><a href="index.html">Monstros</a><a href="database.html">Database</a><a href="team-builder.html">Team Builder</a><a href="runes.html">Runas</a><a href="optimizer.html">Optimizer</a></nav></header><main class="wrap"><div class="card"><h1>⚔️ Team Builder</h1><p class="muted">Escolhe um monstro e o conteúdo. O YunaRunes sugere uma equipa de 5 procurando complementar funções, elementos e utilização conhecida.</p><div class="search"><input id="search" list="monsterNames" placeholder="Pesquisar monstro..."><datalist id="monsterNames"></datalist><select id="mode"><option value="pve">PvE / Farming</option><option value="dungeon">Dungeons</option><option value="pvp">PvP</option><option value="rta">RTA</option></select><button class="btn" onclick="build()">Ver equipa</button></div></div><div id="out" class="card empty">Pesquisa um monstro para começar.</div></main><script>let catalog=[],usage={monsters:{}};const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const clean=v=>String(v??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();const key=v=>clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');const role=m=>String(m?.role||'').toLowerCase();function kind(m){const r=role(m),n=clean(m?.name).toLowerCase();if(/fran|belladeon|colleen|riley|lulu|konamiya|jeanne|chasun|veromos/.test(n))return'sustain';if(r==='attack')return'damage';if(r==='defense')return'control';if(r==='support'||r==='hp')return'support';return'utility'}function playable(m){const s=Number(m?.stars||0),f=String(m?.family||'');return s>=2&&s<=5&&f&&f!=='100000'&&m?.obtainable!==false&&!/material|angelmon|devilmon|rainbowmon/i.test(clean(m?.name))&&m?.image}function modes(m){const d=usage.monsters?.[key(m.name)]||{};return['rta','arena','siege','pve'].filter(x=>d[x])}function score(m,target,need,mode){if(!playable(m)||m===target)return-99999;let s=0,k=kind(m),tm=modes(target),mm=modes(m);if(k===need)s+=100;if(m.element!==target.element)s+=6;if(Number(m.awakeningLevel||0)>=2)s+=8;if(mode==='dungeon'&&['support','sustain','control'].includes(k))s+=15;if(mode==='pve'&&k==='damage')s+=15;if((mode==='pvp'||mode==='rta')&&k==='control')s+=18;if(mode==='rta'&&k==='support')s+=10;s+=mm.filter(x=>tm.includes(x)).length*12;if(mode==='rta'&&mm.includes('rta'))s+=10;if(mode==='pvp'&&['arena','siege'].some(x=>mm.includes(x)))s+=8;if(String(m.family)===String(target.family))s-=1000;return s}function makeTeam(t,mode){const needs=mode==='pve'||mode==='dungeon'?['support','control','sustain','damage']:['control','support','damage','sustain'];let team=[t],used=new Set([String(t.family)+'|'+t.element]);for(const need of needs){let best=null,bs=-1e9;catalog.forEach(m=>{const k=String(m.family)+'|'+m.element;if(used.has(k))return;const s=score(m,t,need,mode);if(s>bs){bs=s;best=m}});if(best){team.push(best);used.add(String(best.family)+'|'+best.element)}}return team}function link(m){return 'monster-view.html?id='+encodeURIComponent(m.id||'')+'&name='+encodeURIComponent(m.name||'')+'&element='+encodeURIComponent(m.element||'')+'&stars='+encodeURIComponent(m.stars||'')+'&awakening='+encodeURIComponent(m.awakeningLevel||0)}function card(m,i){const mm=modes(m);return '<div class="slot"><a href="'+link(m)+'">'+(m.image?'<img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'">':'<div style="height:90px">👾</div>')+'<h3>'+esc(clean(m.name))+'</h3><span class="tag">'+esc(m.element||'')+'</span><span class="tag">'+esc(m.role||'')+'</span><div class="muted">'+(i===0?'⭐ Monstro escolhido':esc(kind(m)))+'</div>'+(mm.length?'<div class="mode-info">'+mm.map(x=>'<span class="used">✓ '+esc(x.toUpperCase())+'</span>').join('')+'</div>':'')+'</a></div>'}function build(){const q=clean(document.getElementById('search').value).toLowerCase();const mode=document.getElementById('mode').value;const t=catalog.find(m=>clean(m.name).toLowerCase()===q)||catalog.find(m=>clean(m.name).toLowerCase().includes(q));if(!t){document.getElementById('out').innerHTML='<div class="empty">Não encontrei esse monstro. Escolhe um nome da pesquisa.</div>';return}const team=makeTeam(t,mode),labels={pve:'PvE / Farming',dungeon:'Dungeons',pvp:'PvP',rta:'RTA'};document.getElementById('out').innerHTML='<h2>'+esc(labels[mode])+' — '+esc(clean(t.name))+'</h2><p class="muted">O monstro pesquisado fica fixo e os outros 4 são escolhidos para complementar a equipa. Os dados de conteúdo são usados apenas quando existem na base YunaRunes.</p><div class="team">'+team.map(card).join('')+'</div><div class="why"><b>💡 Sugestão automática</b><p class="muted">Esta equipa é uma recomendação inicial, não uma classificação oficial. Em PvP/RTA, adapta a equipa ao adversário.</p></div>'}async function init(){try{const r=await fetch('monster-catalog.json?'+Date.now(),{cache:'no-store'});const d=await r.json();catalog=(Array.isArray(d)?d:d.monsters||[]).filter(playable);const names=[...new Set(catalog.map(m=>clean(m.name)))].sort((a,b)=>a.localeCompare(b,'pt-PT'));document.getElementById('monsterNames').innerHTML=names.map(n=>'<option value="'+esc(n)+'">').join('');try{const u=await fetch('usage-info.json?'+Date.now(),{cache:'no-store'});if(u.ok)usage=await u.json()}catch(e){}const p=new URLSearchParams(location.search);if(p.get('name')){document.getElementById('search').value=p.get('name');build()}}catch(e){document.getElementById('out').innerHTML='<div class="empty">Erro ao carregar a base de monstros.</div>'}}init();</script></body></html>
