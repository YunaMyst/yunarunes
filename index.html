100%;object-fit:contain}.name{font-weight:800;font-size:17px}.meta{margin-top:6px;color:#8b949e;font-size:13px}.badge{display:inline-block;padding:3px 7px;border-radius:5px;font-size:11px;font-weight:800;margin:7px 5px 0 0}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.a2{background:#493b12;color:#f2cc60}.empty{text-align:center;color:#8b949e;padding:30px}.mobile-nav{display:none}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}}@media(max-width:650px){.top{display:block;padding:8px 10px 0}.logo{display:block;font-size:30px;padding:3px 8px 12px}.nav{display:none}.lang{position:absolute;right:8px;top:7px}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);margin:0 -10px;background:#101a23;border-top:1px solid #30363d;padding:8px 4px}.mobile-nav a{display:flex;flex-direction:column;align-items:center;gap:4px;color:#cbd5dd;text-decoration:none;font-size:11px}.mobile-nav a b{font-size:22px;color:#5fc7f5}.wrap{padding:15px 10px}.hero{padding:18px 15px}.controls{grid-template-columns:1fr}.controls input{grid-column:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:9px}.portrait{height:175px}.name{font-size:14px}.portrait{height:175px}.name{font-size:14px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.portrait{height:210px}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a><nav class="nav"><a class="active" href="index.html">Monstros</a><a href="nat5.html">⭐ Nat 5</a><a href="codes.html">🎁 Códigos</a><a href="database.html">Database</a><a href="team-builder.html">⚔️ Team Builder</a><a href="runes.html">Runas</a><a href="optimizer.html">Optimizer</a></nav><div class="lang"><a href="./downloads/yunarunes.apk?v=1.4.2" download>📱 APK</a><button data-lang="pt">🇧🇷 PT/BR</button><button data-lang="en">🇬🇧 ENG</button></div><nav class="mobile-nav"><a class="active" href="index.html"><b>⌂</b>Monstros</a><a href="nat5.html"><b>⭐</b>Nat 5</a><a href="codes.html"><b>🎁</b>Códigos</a><a href="database.html"><b>▤</b>Database</a><a href="team-builder.html"><b>⚔</b>Team</a></nav></header><main class="wrap"><section class="hero"><h1>👹 Monster Database</h1><p class="muted">Todos os monstros jogáveis de 2★ a 5★.</p></section><section><div id="status" class="status">A carregar a base...</div><div class="controls"><input id="search" placeholder="🔎 Pesquisar nome, família ou elemento..."><select id="element"><option value="">Todos os elementos</option><option>Fire</option><option>Water</option><option>Wind</option><option>Light</option><option>Dark</option></select><select id="stars"><option value="">Todas as estrelas</option><option value="2">2★</option><option value="3">3★</option><option value="4">4★</option><option value="5">5★</option></select></div><div class="filters"><button class="chip active" data-a2="">Todos</button><button class="chip" data-a2="normal">Normais</button><button class="chip" data-a2="a2">2A — Segundo Despertar</button></div><div id="grid" class="grid"></div></section></main><script>let catalog=[],a2Filter='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=s=>String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();const key=s=>clean(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');const isA2=m=>Boolean(m?.isSecondAwakening===true||m?.isSecondAwakening==='true'||Number(m?.awakeningLevel)===2||String(m?.detailsKey||'').toUpperCase().endsWith('|A2'));function playable(m){return m&&m.name&&m.image&&Number(m.stars)>=2&&Number(m.stars)<=5&&!/material|angelmon|devilmon|rainbowmon/i.test(clean(m.name))}function unique(a){const x=new Map();for(const m of a.filter(playable)){const n=clean(m.name),a2=isA2(m),k=[String(m.family??''),String(m.element??''),a2?'2A':'normal',key(n)].join('|');if(!x.has(k))x.set(k,{...m,name:n,isSecondAwakening:a2})}return [...x.values()].sort((a,b)=>a.name.localeCompare(b.name,'pt-PT')||String(a.element).localeCompare(String(b.element))||Number(a.awakeningLevel)-Number(b.awakeningLevel))}function render(){const q=($('search').value||'').trim().toLowerCase(),e=$('element').value,s=$('stars').value;const list=catalog.filter(m=>(!q||[m.name,m.element,m.role,m.family].join(' ').toLowerCase().includes(q))&&(!e||m.element===e)&&(!s||String(m.stars)===s)&&(!a2Filter||(a2Filter==='a2'?isA2(m):!isA2(m))));$('status').textContent=list.length+' monstros encontrados';$('grid').innerHTML=list.map(m=>'<a class="card" href="monster-view.html?id='+encodeURIComponent(m.id||'')+'&name='+encodeURIComponent(m.name)+'&element='+encodeURIComponent(m.element||'')+'&stars='+encodeURIComponent(m.stars||'')+'&awakening='+encodeURIComponent(m.awakeningLevel||0)+'"><div class="portrait"><img loading="lazy" src="'+esc(m.image)+'" alt="'+esc(m.name)+'" onerror="this.style.display=\'none\'"></div><div class="name">'+esc(m.name)+'</div><div class="meta">'+esc(m.element||'')+(m.stars?' · '+esc(m.stars)+'★':'')+'</div><span class="badge '+esc(m.element)+'">'+esc(m.element)+'</span>'+(isA2(m)?'<span class="badge a2">2A</span>':'')+'</a>').join('')||'<div class="empty">Nenhum monstro encontrado.</div>'}function setA2(v,b){a2Filter=v;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}async function init(){try{const r=await fetch('monster-catalog.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('base');const d=await r.json();catalog=unique(Array.isArray(d)?d:(d.monsters||[]));$('status').textContent=catalog.length+' monstros únicos carregados';render()}catch(e){$('status').textContent='Não foi possível carregar a base de monstros.';console.error(e)}}$('search').oninput=render;$('element').onchange=render;$('stars').onchange=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>setA2(b.dataset.a2,b));init();</script></body></html>
