<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YunaRunes — Database</title>
<style>body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;color:inherit;text-decoration:none}.name{font-weight:700;font-size:18px}.meta{margin-top:8px;color:#8b949e}.badge{display:inline-block;padding:4px 7px;border-radius:6px;margin:5px 5px 0 0;font-size:12px}.a2{background:#493b12;color:#f2cc60}.rta{background:#263b63;color:#9ec5ff}.arena{background:#4b3420;color:#ffc58a}.siege{background:#263f2b;color:#a7e3b0}.pve{background:#40305a;color:#d8b8ff}.none{background:#252b33;color:#8b949e}</style>
</head>
<body><h1>Database</h1><div id="status">A carregar a base...</div><div id="grid" class="grid"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();
const playable=m=>m&&m.name;
const unique=a=>{const x=new Map();for(const m of a){const k=clean(m.name).toLowerCase();if(!x.has(k))x.set(k,{...m,name:clean(m.name)});}return [...x.values()]};
const RTA={Oliver:'S+',Giana:'S+', 'Son Zhang Lao':'S+','Shi Hou':'S+',Okeanos:'S','Tian Lang':'S',Josephine:'S',Sonia:'S',Harmonia:'S',Zeratu:'S',Vanessa:'S',Lora:'S',Juno:'S',Haegang:'S',Kovarci:'S',Jeogun:'S',Yeonhong:'A',Chandra:'A',Han:'A',Verdehile:'A',Seara:'A',Racuni:'A',Shizuka:'A',Seimei:'A',Ethna:'A',Leo:'A',Miles:'A',Velajuel:'A',Karnal:'A',Nephthys:'A',Moore:'B',Nana:'B',Camilla:'B',Woosa:'B',Cheongpung:'B',Anavel:'B',Rica:'B','Mo Long':'B',Eshir:'B',Ganymede:'B'};
const ARENA={Oliver:'S+',Giana:'S+',Teshar:'S+',Nephthys:'S',Veromos:'S',Kro:'S',Loren:'S',Sigmarus:'S',Tyron:'S',Camilla:'S',Masha:'S',Juno:'A',Rica:'A',Leo:'A',Fran:'A',Galleon:'A',Lushen:'A',Riley:'A',Savannah:'A',Verdehile:'A',Seara:'B',Karnal:'B'};
const SIEGE={Feng Yan:'S',Artamiel:'S',Rakan:'S',Chandra:'S',Louise:'S',Carcano:'S',Eshir:'S',Shahat:'S',Moore:'S',Cheongpung:'S',Karnal:'S',Savannah:'S','Mo Long':'S',Seara:'S',Giana:'S',Riley:'S',Rakan:'S',Triana:'A',Manon:'A',Nora:'A',Skogul:'A',Orion:'A',Vigor:'A',Eshir:'A'};
const PVE={Teshar:'S+',Loren:'S',Sigmarus:'S',Tyron:'S',Kro:'S',Veromos:'S',Fran:'S',Riley:'S',Lushen:'S',Icaru:'S',Spectra:'S',Mellia:'S',Sath:'S',Verdehile:'S',Galleon:'A',Raoq:'A',Naomi:'A',Vigor:'A',Shaina:'A',Sabrina:'A',Talia:'A'};
const rating=(map,n)=>map[n]||'—';
const badges=m=>'<span class="badge rta">RTA: '+esc(rating(RTA,m.name))+'</span><span class="badge arena">Arena: '+esc(rating(ARENA,m.name))+'</span><span class="badge siege">Siege: '+esc(rating(SIEGE,m.name))+'</span><span class="badge pve">PvE: '+esc(rating(PVE,m.name))+'</span>';
async function init(){try{const r=await fetch('monster-catalog.json?v='+Date.now());const data=await r.json();const monsters=unique(Array.isArray(data)?data:(data.monsters||[])).filter(playable);document.getElementById('status').textContent=monsters.length+' monstros únicos carregados';document.getElementById('grid').innerHTML=monsters.map(m=>'<a class="card" href="monster-view.html?name='+encodeURIComponent(m.name)+'&element='+encodeURIComponent(m.element||'')+'&stars='+encodeURIComponent(m.stars||'')+'"><div class="name">'+esc(m.name)+'</div><div class="meta">'+esc(m.element||'')+(m.stars?' · '+esc(m.stars)+'★':'')+'</div>'+badges(m)+(m.isSecondAwakening?'<div><span class="badge a2">2A</span></div>':'')+'</a>').join('')}catch(e){document.getElementById('status').textContent='Erro ao carregar a base.';console.error(e)}}init();
</script></body></html>
