<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YunaRunes — Database</title><style>body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;color:inherit;text-decoration:none}.name{font-weight:700;font-size:18px}.meta{margin-top:8px;color:#8b949e}.usage{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.mode{background:#11171d;border:1px solid #30363d;border-radius:7px;padding:6px 3px;text-align:center;font-size:11px;color:#8b949e}.mode strong{display:block;font-size:11px;margin-bottom:3px}.mode.used{color:#7ee787;border-color:#238636;background:#12251a;font-weight:800}.a2{background:#493b12;color:#f2cc60;margin-top:5px}</style></head><body><h1>Database</h1><div id="status">A carregar a base...</div><div id="grid" class="grid"></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=s=>String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();const key=s=>clean(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');const playable=m=>m&&m.name;const unique=a=>{const x=new Map();for(const m of a.filter(playable)){const n=clean(m.name);const k=[String(m.family??''),String(m.element??''),String(m.awakeningLevel??0),m.isSecondAwakening?'2A':'normal',key(n)].join('|');if(!x.has(k))x.set(k,{...m,name:n})}return [...x.values()]};const RTA=['Oliver','Giana','Son Zhang Lao','Shi Hou','Okeanos','Tian Lang','Josephine','Sonia','Harmonia','Zeratu','Vanessa','Lora','Juno','Haegang','Kovarci','Jeogun','Yeonhong','Chandra','Han','Verdehile','Seara','Racuni','Shizuka','Seimei','Ethna','Leo','Miles','Velajuel','Karnal','Nephthys','Moore','Nana','Camilla','Woosa','Cheongpung','Anavel','Rica','Mo Long','Eshir','Ganymede','Hathor','Chiwu','Diana','Mei Hou Wang','Minato','Praha','Amber','Charlotte','Sekhmet','Sagar','Zibala','Tomoe','Taor','Tetra','Herne','Abellio','Masha'];const ARENA=['Oliver','Giana','Teshar','Nephthys','Veromos','Kro','Loren','Sigmarus','Tyron','Camilla','Masha','Juno','Rica','Leo','Fran','Galleon','Lushen','Riley','Savannah','Verdehile','Seara','Karnal','Vanessa','Chiwu','Zima','Abellio','Alice','Alicia','Berenice','Sonia','Feng Yan'];const SIEGE=['Feng Yan','Artamiel','Rakan','Chandra','Louise','Carcano','Eshir','Shahat','Moore','Cheongpung','Karnal','Savannah','Mo Long','Seara','Giana','Riley','Triana','Manon','Nora','Skogul','Orion','Vigor','Odin','Cichlid','Clara','Imesety','Susano','Praha','Qebehsenuef','Malite','Ophilia','Iunu','Emma','Tetra','Ritesh','Taranys','Camilla','Abellio','Sonia','Coco','Theomars','Galleon','Shaina','Sabrina'];const PVE=['Teshar','Loren','Sigmarus','Tyron','Kro','Veromos','Fran','Riley','Lushen','Icaru','Spectra','Mellia','Sath','Verdehile','Galleon','Raoq','Naomi','Vigor','Shaina','Sabrina','Talia','Belladeon','Colleen','Baretta','Mav','Theomars','Xiong Fei','Dias','Lapis','Iris','Konamiya','Eirgar','Astar','Kaki','Baleygr','Hraesvelg','Homunculus'];const maps={rta:new Set(RTA.map(key)),arena:new Set(ARENA.map(key)),siege:new Set(SIEGE.map(key)),pve:new Set(PVE.map(key))};const used=(map,n)=>map.has(key(n));const mode=(label,isUsed)=>'<div class="mode'+(isUsed?' used':'')+'"><strong>'+label+'</strong>'+(isUsed?'X':'—')+'</div>';const badges=m=>'<div class="usage">'+mode('RTA',used(maps.rta,m.name))+mode('Arena',used(maps.arena,m.name))+mode('Siege',used(maps.siege,m.name))+mode('PvE',used(maps.pve,m.name))+'</div>';async function init(){try{const r=await fetch('monster-catalog.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('catalog');const data=await r.json();const monsters=unique(Array.isArray(data)?data:(data.monsters||[]));document.getElementById('status').textContent=monsters.length+' monstros únicos carregados';document.getElementById('grid').innerHTML=monsters.map(m=>'<a class="card" href="monster-view.html?id='+encodeURIComponent(m.id||'')+'&name='+encodeURIComponent(m.name)+'&element='+encodeURIComponent(m.element||'')+'&stars='+encodeURIComponent(m.stars||'')+'&awakening='+encodeURIComponent(m.awakeningLevel||0)+'"><div class="name">'+esc(m.name)+'</div><div class="meta">'+esc(m.element||'')+(m.stars?' · '+esc(m.stars)+'★':'')+'</div>'+badges(m)+(m.isSecondAwakening?'<div><span class="a2">2A</span></div>':'')+'</a>').join('')}catch(e){document.getElementById('status').textContent='Erro ao carregar a base.';console.error(e)}}init();</script></body></html>
