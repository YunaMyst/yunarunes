<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Base completa de monstros jogáveis de Summoners War em português — YunaRunes."><title>Base de Monstros — YunaRunes</title><style>:root{--bg:#0f141a;--p:#171e26;--p2:#202a34;--t:#eef3f7;--m:#93a1ae;--a:#35a9e1;--b:#2b3742;--gold:#e6c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}.top{min-height:62px;background:#151b22;border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 24px;gap:28px;position:sticky;top:0;z-index:5}.logo{font-size:24px;font-weight:900;color:#fff;text-decoration:none}.logo span{color:var(--a)}nav{display:flex;gap:18px;overflow:auto;white-space:nowrap}nav a{color:#c3ccd5;text-decoration:none}.wrap{max-width:1300px;margin:auto;padding:24px 16px}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:18px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px;margin:15px 0}.toolbar input,.toolbar select{width:100%;background:#0d1217;color:white;border:1px solid var(--b);border-radius:5px;padding:12px}.muted{color:var(--m)}.monsters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.monster{background:#11171d;border:1px solid var(--b);border-radius:8px;padding:10px;text-decoration:none;color:inherit;min-width:0}.portrait{height:135px;background:#0d1217;border-radius:6px;display:grid;place-items:center;overflow:hidden;margin-bottom:9px}.portrait img{width:100%;height:100%;object-fit:contain}.fallback{font-size:45px}.monster h3{font-size:15px;margin:0 0 6px}.badge{display:inline-block;padding:3px 7px;border-radius:4px;font-size:11px;font-weight:800;margin:2px 4px 2px 0}.Fire{background:#56201e;color:#ff9a91}.Water{background:#183b5b;color:#9bceff}.Wind{background:#29441f;color:#b9ed9b}.Light{background:#554d22;color:#fff1a0}.Dark{background:#3e294f;color:#dfb9ff}.a2{background:#6a4a18;color:#ffd875}.playable{background:#173e29;color:#8df0ad}.empty{padding:30px;text-align:center}@media(max-width:1000px){.monsters{grid-template-columns:repeat(4,1fr)}}@media(max-width:750px){.monsters{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:450px){.monsters{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.portrait{height:190px}}</style></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a><nav><a href="index.html">Início</a><a href="database.html">Monstros</a><a href="runes.html">Runas</a><a href="optimizer.html">Optimizer</a></nav></header><main class="wrap"><section class="card"><h1>📚 Base completa de monstros</h1><p class="muted">Todos os monstros jogáveis encontrados na base do YunaRunes, com pesquisa e filtros em português.</p><div id="status" class="muted">A carregar a base...</div><div class="toolbar"><input id="q" placeholder="🔎 Pesquisar monstro, família ou função..." oninput="render()"><select id="element" onchange="render()"><option value="">Todos os elementos</option><option value="Fire">Fogo</option><option value="Water">Água</option><option value="Wind">Vento</option><option value="Light">Luz</option><option value="Dark">Trevas</option></select><select id="stars" onchange="render()"><option value="">Todas as estrelas</option><option>3</option><option>4</option><option>5</option><option>6</option></select><select id="awakening" onchange="render()"><option value="">Todos os despertares</option><option value="normal">Normal</option><option value="2a">Segundo Despertar</option></select></div><div id="list" class="monsters"></div></section></main><script>let monsters=[];const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const elementPt={Fire:'Fogo',Water:'Água',Wind:'Vento',Light:'Luz',Dark:'Trevas'};const rolePt={Attack:'Ataque',Defense:'Defesa',HP:'PV',Support:'Suporte'};function clean(v){return String(v??'').replace(/\b2ª\s*modificação\s*do\s*/gi,'').replace(/\b2ª\s*modificação\b/gi,'').replace(/\bEdit[_\s-]*(Left|Right)\b/gi,'').replace(/\b(Left|Right|Direita|Direito|Esquerda|Esquerdo)\b/gi,'').replace(/[_]+/g,' ').replace(/\s{2,}/g,' ').trim()}function playable(m){const s=Number(m.stars||0),fam=String(m.family||'');const n=clean(m.name);return m&&m.image&&s>=2&&s<=6&&fam!=='100000'&&fam!=='0'&&!/edit|left|right|direita|direito|esquerda|esquerdo|cristal|chefe do despertar/i.test(n)}function dedupe(a){const map=new Map();for(const m of a.filter(playable)){const k=[m.family,m.element,m.awakeningLevel||0,m.isSecondAwakening?1:0,clean(m.name).toLowerCase()].join('|');if(!map.has(k))map.set(k,m)}return [...map.values()].sort((a,b)=>clean(a.name).localeCompare(clean(b.name),'pt-PT'))}async function init(){try{const r=await fetch('monster-catalog.json?v='+Date.now());const d=await r.json();monsters=dedupe(Array.isArray(d)?d:(d.monsters||[]));document.getElementById('status').textContent=monsters.length+' monstros únicos carregados';render()}catch(e){document.getElementById('status').textContent='Não foi possível carregar a base de monstros.'}}function render(){const q=(document.getElementById('q').value||'').toLowerCase(),el=document.getElementById('element').value,st=document.getElementById('stars').value,aw=document.getElementById('awakening').value;const list=monsters.filter(m=>(!q||[m.name,m.family,m.role,m.element].join(' ').toLowerCase().includes(q))&&(!el||m.element===el)&&(!st||String(m.stars)===st)&&(!aw||(aw==='2a'?m.isSecondAwakening:!m.isSecondAwakening)));document.getElementById('list').innerHTML=list.map(m=>'<a class="monster" href="monster-view.html?name='+encodeURIComponent(m.name)+'&element='+encodeURIComponent(m.element)+'&stars='+encodeURIComponent(m.stars)+'&awakening='+encodeURIComponent(m.awakeningLevel||0)+'"><div class="portrait"><img src="'+esc(m.image)+'" alt="'+esc(clean(m.name))+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><span class="fallback" style="display:none">👾</span></div><h3>'+esc(clean(m.name))+'</h3><span class="badge '+esc(m.element)+'">'+esc(elementPt[m.element]||m.element)+'</span><span class="badge">'+esc(m.stars)+'★</span><span class="badge">'+esc(rolePt[m.role]||m.role||'Função')+'</span>'+(m.isSecondAwakening?'<span class="badge a2">2A</span>':'')+'<div class="badge playable">✓ Jogável</div></a>').join('')||'<div class="empty muted">Nenhum monstro encontrado.</div>'}init();</script></body></html>
