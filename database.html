<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YunaRunes — Database</title>
<style>body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;color:inherit;text-decoration:none}.name{font-weight:700;font-size:18px}.meta{margin-top:8px;color:#8b949e}.badge{display:inline-block;padding:4px 7px;border-radius:6px;margin-right:5px;font-size:12px}.a2{background:#493b12;color:#f2cc60}</style>
</head>
<body><h1>Database</h1><div id="status">A carregar a base...</div><div id="grid" class="grid"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();
const playable=m=>m&&m.name;
const unique=a=>{const x=new Map();for(const m of a){const k=clean(m.name).toLowerCase();if(!x.has(k))x.set(k,{...m,name:clean(m.name)});}return [...x.values()]};
async function init(){try{const r=await fetch('monster-catalog.json');const data=await r.json();const monsters=unique(Array.isArray(data)?data:(data.monsters||[])).filter(playable);document.getElementById('status').textContent=monsters.length+' monstros únicos carregados';document.getElementById('grid').innerHTML=monsters.map(m=>'<a class="card" href="monster-view.html?id='+encodeURIComponent(m.id)+'"><div class="name">'+esc(m.name)+'</div><div class="meta">'+esc(m.element||'')+(m.stars?' · '+esc(m.stars)+'★':'')+'</div>'+(m.isSecondAwakening?'<div><span class="badge a2">2A</span></div>':'')+'</a>').join('')}catch(e){document.getElementById('status').textContent='Erro ao carregar a base.';console.error(e)}}init();
</script></body></html>
