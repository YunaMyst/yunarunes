<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YunaRunes — Database</title>
<style>body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;color:inherit;text-decoration:none}.name{font-weight:700;font-size:18px}.meta{margin-top:8px;color:#8b949e}.usage{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.mode{background:#11171d;border:1px solid #30363d;border-radius:7px;padding:6px 3px;text-align:center;font-size:11px;color:#8b949e}.mode strong{display:block;font-size:11px;margin-bottom:3px}.mode.used{color:#7ee787;border-color:#238636;background:#12251a;font-weight:800}.a2{background:#493b12;color:#f2cc60;margin-top:5px}.rta strong{color:#9ec5ff}.arena strong{color:#ffc58a}.siege strong{color:#a7e3b0}.pve strong{color:#d8b8ff}</style>
</head>
<body><h1>Database</h1><div id="status">A carregar a base...</div><div id="grid" class="grid"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();
const key=s=>clean(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
const playable=m=>m&&m.name;
const unique=a=>{const x=new Map();for(const m of a){const n=clean(m.name);const k=key(n);if(!x.has(k))x.set(k,{...m,name:n});}return [...x.values()]};
const RTA={Oliver:'S+','Giana':'S+','Son Zhang Lao':'S+','Shi Hou':'S+',Okeanos:'S','Tian Lang':'S',Josephine:'S',Sonia:'S',Harmonia:'S',Zeratu:'S',Vanessa:'S',Lora:'S',Juno:'S',Haegang:'S',Kovarci:'S',Jeogun:'S',Yeonhong:'A',Chandra:'A',Han:'A',Verdehile:'A',Seara:'A',Racuni:'A',Shizuka:'A',Seimei:'A',Ethna:'A',Leo:'A',Miles:'A',Velajuel:'A',Karnal:'A',Nephthys:'A',Moore:'B',Nana:'B',Camilla:'B',Woosa:'B',Cheongpung:'B',Anavel:'B',Rica:'B','Mo Long':'B',Eshir:'B',Ganymede:'B'};
const ARENA={Oliver:'S+',Giana:'S+',Teshar:'S+',Nephthys:'S',Veromos:'S',Kro:'S',Loren:'S',Sigmarus:'S',Tyron:'S',Camilla:'S',Masha:'S',Juno:'A',Rica:'A',Leo:'A',Fran:'A',Galleon:'A',Lushen:'A',Riley:'A',Savannah:'A',Verdehile:'A',Seara:'B',Karnal:'B'};
const SIEGE={'Feng Yan':'S',Artamiel:'S',Rakan:'S',Chandra:'S',Louise:'S',Carcano:'S',Eshir:'S',Shahat:'S',Moore:'S',Cheongpung:'S',Karnal:'S',Savannah:'S','Mo Long':'S',Seara:'S',Giana:'S',Riley:'S',Triana:'A',Manon:'A',Nora:'A',Skogul:'A',Orion:'A',Vigor:'A'};
const PVE={Teshar:'S+',Loren:'S',Sigmarus:'S',Tyron:'S',Kro:'S',Veromos:'S',Fran:'S',Riley:'S',Lushen:'S',Icaru:'S',Spectra:'S',Mellia:'S',Sath:'S',Verdehile:'S',Galleon:'A',Raoq:'A',Naomi:'A',Vigor:'A',Shaina:'A',Sabrina:'A',Talia:'A'};
const makeMap=map=>Object.fromEntries(Object.entries(map).map(([n,v])=>[key(n),v]));
const maps={rta:makeMap(RTA),arena:makeMap(ARENA),siege:makeMap(SIEGE),pve:makeMap(PVE)};
const used=(map,n)=>!!map[key(n)];
const mode=(cls,label,isUsed)=>'<div class="mode '+cls+(isUsed?' used':'')+'"><strong>'+label+'</strong>'+(isUsed?'X':'—')+'</div>';
const badges=m=>'<div class="usage">'+mode('rta','RTA',used(maps.rta,m.name))+mode('arena','Arena',used(maps.arena,m.name))+mode('siege','Siege',used(maps.siege,m.name))+mode('pve','PvE',used(maps.pve,m.name))+'</div>';
async function init(){try{const r=await fetch('monster-catalog.json?v='+Date.now());const data=await r.json();const monsters=unique(Array.isArray(data)?data:(data.monsters||[])).filter(playable);document.getElementById('status').textContent=monsters.length+' monstros únicos carregados';document.getElementById('grid').innerHTML=monsters.map(m=>'<a class="card" href="monster-view.html?name='+encodeURIComponent(m.name)+'&element='+encodeURIComponent(m.element||'')+'&stars='+encodeURIComponent(m.stars||'')+'"><div class="name">'+esc(m.name)+'</div><div class="meta">'+esc(m.element||'')+(m.stars?' · '+esc(m.stars)+'★':'')+'</div>'+badges(m)+(m.isSecondAwakening?'<div><span class="a2">2A</span></div>':'')+'</a>').join('')}catch(e){document.getElementById('status').textContent='Erro ao carregar a base.';console.error(e)}}init();
</script></body></html>
