<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Database</title><style>body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;margin:0;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;color:inherit;text-decoration:none}.name{font-weight:700;font-size:18px}.meta{margin-top:8px;color:#8b949e}.usage{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.mode{background:#11171d;border:1px solid #30363d;border-radius:7px;padding:6px 3px;text-align:center;font-size:11px;color:#8b949e}.mode strong{display:block;font-size:11px;margin-bottom:3px}.mode.used{color:#7ee787;border-color:#238636;background:#12251a;font-weight:800}.a2{background:#493b12;color:#f2cc60;margin-top:5px;display:inline-block;padding:2px 5px;border-radius:5px}</style></head><body><h1>Database</h1><div id="status">A carregar a base...</div><div id="grid" class="grid"></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clean=s=>String(s??'').replace(/\s*(2ª\s*modifica(?:ç|c)ão|edit|direita|esquerda)\s*/gi,' ').replace(/\s+/g,' ').trim();const key=s=>clean(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');const playable=m=>m&&m.name&&m.image;const unique=a=>{const x=new Map();for(const m of a.filter(playable)){const n=clean(m.name);const k=[String(m.family??''),String(m.element??''),String(m.awakeningLevel??0),m.isSecondAwakening?'2A':'normal',key(n)].join('|');if(!x.has(k))x.set(k,{...m,name:n})}return [...x.values()]};const mode=(label,on)=>'<div class="mode'+(on?' used':'')+'"><strong>'+label+'</strong>'+(on?'X':'—')+'</div>';const usageFor=(u,m)=>{const d=u.monsters?.[key(m.name)];return d||{}};const badges=(u,m)=>{const d=usageFor(u,m);return '<div class="usage">'+mode('RTA',!!d.rta)+mode('Arena',!!d.arena)+mode('Siege',!!d.siege)+mode('PvE',!!d.pve)+'</div>'};async function init(){try{const [cr,ur]=await Promise.all([fetch('monster-catalog.json?v='+Date.now(),{cache:'no-store'}),fetch('usage-info.json?v='+Date.now(),{cache:'no-store'})]);if(!cr.ok||!ur.ok)throw Error('base');const data=await cr.json(),usage=await ur.json();const monsters=unique(Array.isArray(data)?data:(data.monsters||[]));document.getElementById('status').textContent=monsters.length+' monstros únicos carregados';document.getElementById('grid').innerHTML=monsters.map(m=>'<a class="card" href="monster-view.html?id='+encodeURIComponent(m.id||'')+'&name='+encodeURIComponent(m.name)+'&element='+encodeURIComponent(m.element||'')+'&stars='+encodeURIComponent(m.stars||'')+'&awakening='+encodeURIComponent(m.awakeningLevel||0)+'"><div class="name">'+esc(m.name)+'</div><div class="meta">'+esc(m.element||'')+(m.stars?' · '+esc(m.stars)+'★':'')+'</div>'+badges(usage,m)+(m.isSecondAwakening?'<div><span class="a2">2A</span></div>':'')+'</a>').join('')}catch(e){document.getElementById('status').textContent='Erro ao carregar a base.';console.error(e)}}init();</script></body></html>
