<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YunaRunes — Artifact Optimizer</title><link rel="stylesheet" href="advanced-tools.css"></head><body><header class="top"><a class="logo" href="index.html">Yuna<span>Runes</span></a></header><main class="tool-wrap"><section class="hero"><h1>💠 Artifact Optimizer</h1><p class="muted">Ordena artefactos por adequação ao monstro, tipo de dano e qualidade das linhas.</p></section><section class="card"><div class="toolbar"><label>Monstro<input id="monster" list="monsters" placeholder="Ex.: Galleon"><datalist id="monsters"></datalist></label><label>Tipo<select id="type"><option value="any">Qualquer</option><option value="left">Esquerdo</option><option value="right">Direito</option></select></label><label>Função<select id="role"><option value="damage">Damage</option><option value="support">Support</option><option value="control">Control</option></select></label><button class="btn" id="run">Otimizar</button></div><p class="muted" id="source">A usar artefactos de demonstração.</p><label class="muted">Importar artefactos JSON<input id="file" type="file" accept="application/json,.json"></label></section><section class="stat-grid" id="summary"></section><section class="card"><h2>Melhores artefactos</h2><div id="results" class="list"></div></section></main><script>const PT={title:'Artifact Optimizer',loading:'A analisar artefactos...',demo:'A usar artefactos de demonstração.',custom:'Inventário personalizado ativo.',opt:'Otimizar',any:'Qualquer',left:'Esquerdo',right:'Direito',damage:'Damage',support:'Support',control:'Control',best:'Melhores artefactos',score:'Score',why:'Porque',type:'Tipo',grade:'Qualidade',lines:'Linhas'};const EN={title:'Artifact Optimizer',loading:'Analyzing artifacts...',demo:'Using demo artifacts.',custom:'Custom inventory active.',opt:'Optimize',any:'Any',left:'Left',right:'Right',damage:'Damage',support:'Support',control:'Control',best:'Best artifacts',score:'Score',why:'Why',type:'Type',grade:'Quality',lines:'Lines'};const L=()=>localStorage.getItem('yunarunes-language')==='en'?EN:PT;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let arts=[];const demo=[{name:'ATK / Skill 3',type:'left',sets:['ATK%','Skill 3','Additional Damage'],score:92,lines:['ATK% +7%','Skill 3 +10%','Additional Damage 6%'],tags:['damage']},{name:'HP / Damage Received',type:'right',sets:['HP%','Damage Received -','Additional Damage'],score:89,lines:['HP% +8%','Damage Received -5%','Additional Damage 4%'],tags:['support','control']},{name:'SPD / Skill 2',type:'left',sets:['SPD','Skill 2','Damage Received -'],score:86,lines:['SPD +7','Skill 2 +8%','Damage Received -4%'],tags:['support','control']},{name:'CD / Additional Damage',type:'right',sets:['CD%','Additional Damage','Skill 3'],score:84,lines:['CD% +7%','Additional Damage 5%','Skill 3 +6%'],tags:['damage']},{name:'DEF / Recovery',type:'right',sets:['DEF%','Recovery','Damage Received -'],score:78,lines:['DEF% +8%','Recovery +6%','Damage Received -4%'],tags:['support']},{name:'ATK / Skill 2',type:'left',sets:['ATK%','Skill 2','Additional Damage'],score:76,lines:['ATK% +6%','Skill 2 +7%','Additional Damage 3%'],tags:['damage','control']}];async function loadMonsters(){try{const r=await fetch('monsters.json',{cache:'no-store'});if(!r.ok)return;const d=await r.json();const a=Array.isArray(d)?d:d.monsters||[];$('monsters').innerHTML=a.filter(x=>x?.name).slice(0,200).map(x=>`<option value="${esc(x.name)}"></option>`).join('')}catch(_){}}function score(a){const role=$('role').value;let s=Number(a.score||0);if(a.tags?.includes(role))s+=8;if($('type').value!=='any'&&a.type===$('type').value)s+=5;return s}function render(){const role=$('role').value,type=$('type').value;const list=arts.filter(a=>type==='any'||a.type===type).map(a=>({...a,final:score(a)})).sort((a,b)=>b.final-a.final);$('summary').innerHTML=`<div class="stat"><b>${L().title}</b><strong>${list.length}</strong></div><div class="stat"><b>${L().score} médio</b><strong>${list.length?Math.round(list.reduce((x,a)=>x+a.final,0)/list.length):0}</strong></div><div class="stat"><b>${L().type}</b><strong>${type==='any'?L().any:type==='left'?L().left:L().right}</strong></div><div class="stat"><b>Role</b><strong>${role}</strong></div>`;$('results').innerHTML=list.length?list.slice(0,15).map(a=>`<div class="row"><strong>${esc(a.name)} <span class="badge">${a.final}</span></strong><span class="muted">${L().type}: ${esc(a.type)} · ${L().grade}: ${Math.min(100,a.final)}%</span><div class="chips">${(a.sets||[]).map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><div class="small muted">${L().lines}: ${a.lines.map(esc).join(' · ')}</div><div class="note" style="margin-top:8px">${L().why}: ${a.tags?.includes(role)?'matching role scaling':'useful secondary lines'}${$('monster').value?' · '+esc($('monster').value):''}</div></div>`).join(''):'<div class="empty">No artifacts match these filters.</div>'}$('run').onclick=render;$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw Error();arts=d.map((a,i)=>({...a,id:a.id||String(i),score:Number(a.score||a.quality||70),sets:a.sets||a.lines||[],lines:a.lines||a.substats||[],type:a.type||'left',tags:a.tags||[]}));$('source').textContent=L().custom;render()}catch(_){$('source').textContent='Invalid JSON.'}});arts=demo;loadMonsters();render();</script><script src="language.js?v=20260923-lang-v13"></script><script src="advanced-tools-lang.js"></script><script src="language-dynamic.js?v=20260923-lang-v13"></script></body></html>
