t</option></select></label><label><span data-pt="Função" data-en="Role">Role</span><select id="role"><option value="damage">Damage</option><option value="support">Support</option><option value="control">Control</option></select></label><button class="btn" id="run" data-pt="Otimizar" data-en="Optimize">Optimize</button></div><p class="muted" id="source" data-pt="A usar artefactos de demonstração." data-en="Using demo artifacts.">Using demo artifacts.</p><label class="muted"><span data-pt="Importar artefactos JSON" data-en="Import JSON artifacts">Import JSON artifacts</span><span class="json-picker" id="jsonPicker" data-pt="Escolher ficheiro" data-en="Choose file">Choose file</span><span class="json-filename" id="jsonFilename" data-pt="Nenhum ficheiro selecionado" data-en="No file selected">No file selected</span><input class="json-file-input" id="file" type="file" accept="application/json,.json" hidden style="display:none!important"></label></section><section class="stat-grid" id="summary"></section><section class="card"><h2 data-pt="Melhores artefactos" data-en="Best artifacts">Best artifacts</h2><div id="results" class="list"></div></section></main><script>const PT={roleLabel:'Função',average:'médio',title:'Artifact Optimizer',loading:'A analisar artefactos...',demo:'A usar artefactos de demonstração.',custom:'Inventário personalizado ativo.',opt:'Otimizar',any:'Qualquer',left:'Esquerdo',right:'Direito',damage:'Damage',support:'Support',control:'Control',best:'Melhores artefactos',score:'Score',why:'Porque',type:'Tipo',grade:'Qualidade',lines:'Linhas'};const EN={roleLabel:'Role',average:'average',title:'Artifact Optimizer',loading:'Analyzing artifacts...',demo:'Using demo artifacts.',custom:'Custom inventory active.',opt:'Optimize',any:'Any',left:'Left',right:'Right',damage:'Damage',support:'Support',control:'Control',best:'Best artifacts',score:'Score',why:'Why',type:'Type',grade:'Quality',lines:'Lines'};const L=()=>{try{return (localStorage.getItem('yunarunes-language')||document.cookie.match(/(?:^|; )yunarunes-language=([^;]+)/)?.[1]||document.documentElement.lang||'pt').toLowerCase().startsWith('en')?EN:PT}catch(_){return document.documentElement.lang==='en'?EN:PT}};const $=id=>document.getElementById(id);const isEnglish=()=>{try{return localStorage.getItem('yunarunes-language')==='en'||document.documentElement.lang==='en'}catch(_){return document.documentElement.lang==='en'}};function updateJsonPickerLanguage(){const en=isEnglish();$('jsonPicker').textContent=en?'Choose file':'Escolher ficheiro';if(!$('file').files[0])$('jsonFilename').textContent=en?'No file selected':'Nenhum ficheiro selecionado';const title=document.querySelector('label:has(#file) > span:first-child');if(title)title.textContent=en?'Import JSON artifacts':'Importar artefactos JSON'}$('jsonPicker').addEventListener('click',()=> $('file').click());$('file').addEventListener('change',()=>{$('jsonFilename').textContent=$('file').files[0]?.name||(isEnglish()?'No file selected':'Nenhum ficheiro selecionado')});updateJsonPickerLanguage();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let arts=[];const demo=[{name:'ATK / Skill 3',type:'left',sets:['ATK%','Skill 3','Additional Damage'],score:92,lines:['ATK% +7%','Skill 3 +10%','Additional Damage 6%'],tags:['damage']},{name:'HP / Damage Received',type:'right',sets:['HP%','Damage Received -','Additional Damage'],score:89,lines:['HP% +8%','Damage Received -5%','Additional Damage 4%'],tags:['support','control']},{name:'SPD / Skill 2',type:'left',sets:['SPD','Skill 2','Damage Received -'],score:86,lines:['SPD +7','Skill 2 +8%','Damage Received -4%'],tags:['support','control']},{name:'CD / Additional Damage',type:'right',sets:['CD%','Additional Damage','Skill 3'],score:84,lines:['CD% +7%','Additional Damage 5%','Skill 3 +6%'],tags:['damage']},{name:'DEF / Recovery',type:'right',sets:['DEF%','Recovery','Damage Received -'],score:78,lines:['DEF% +8%','Recovery +6%','Damage Received -4%'],tags:['support']},{name:'ATK / Skill 2',type:'left',sets:['ATK%','Skill 2','Additional Damage'],score:76,lines:['ATK% +6%','Skill 2 +7%','Additional Damage 3%'],tags:['damage','control']}];async function loadMonsters(){try{const r=await fetch('monsters.json',{cache:'no-store'});if(!r.ok)return;const d=await r.json();const a=Array.isArray(d)?d:d.monsters||[];$('monsters').innerHTML=a.filter(x=>x?.name).slice(0,200).map(x=>`<option value="${esc(x.name)}"></option>`).join('')}catch(_){}}function score(a){const role=$('role').value;let s=Number(a.score||0);if(a.tags?.includes(role))s+=8;if($('type').value!=='any'&&a.type===$('type').value)s+=5;return s}function render(){const role=$('role').value,type=$('type').value;const list=arts.filter(a=>type==='any'||a.type===type).map(a=>({...a,final:score(a)})).sort((a,b)=>b.final-a.final);$('summary').innerHTML=`<div class="stat"><b>${L().title}</b><strong>${list.length}</strong></div><div class="stat"><b>${L().score} ${L().average}</b><strong>${list.length?Math.round(list.reduce((x,a)=>x+a.final,0)/list.length):0}</strong></div><div class="stat"><b>${L().type}</b><strong>${type==='any'?L().any:type==='left'?L().left:L().right}</strong></div><div class="stat"><b>${L().roleLabel}</b><strong>${L()[role]||role}</strong></div>`;$('results').innerHTML=list.length?list.slice(0,15).map(a=>`<div class="row"><strong>${esc(a.name)} <span class="badge">${a.final}</span></strong><span class="muted">${L().type}: ${esc(a.type)} · ${L().grade}: ${Math.min(100,a.final)}%</span><div class="chips">${(a.sets||[]).map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div><div class="small muted">${L().lines}: ${a.lines.map(esc).join(' · ')}</div><div class="note" style="margin-top:8px">${L().why}: ${a.tags?.includes(role)?'matching role scaling':'useful secondary lines'}${$('monster').value?' · '+esc($('monster').value):''}</div></div>`).join(''):'<div class="empty">No artifacts match these filters.</div>'}$('run').onclick=render;$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw Error();arts=d.map((a,i)=>({...a,id:a.id||String(i),score:Number(a.score||a.quality||70),sets:a.sets||a.lines||[],lines:a.lines||a.substats||[],type:a.type||'left',tags:a.tags||[]}));$('source').textContent=L().custom;render()}catch(_){$('source').textContent='Invalid JSON.'}});arts=demo;loadMonsters();render();</script><script src="advanced-tools-lang.js?v=20261008-v5"></script><script src="yunarunes-upgrades.js?v=20261001-v2"></script><script>(function(){const h=document.querySelector("header.top");if(!h)return;const set=(el,k,v)=>el&&el.style.setProperty(k,v,"important");set(h,"z-index","2147483000");set(h,"overflow","visible");set(h,"pointer-events","auto");const controls=h.querySelector(".yuna-controls");set(controls,"position","relative");set(controls,"z-index","2147483001");set(controls,"pointer-events","auto");h.querySelectorAll(".yuna-controls a,.yuna-controls button,a.yunarunes-home").forEach(el=>{set(el,"position","relative");set(el,"z-index","2147483002");set(el,"pointer-events","auto");set(el,"touch-action","manipulation");set(el,"cursor","pointer");});})();</script><script src="language.js?v=20261028-ptbr-v2"></script></body></html>
